# =============================================================================
# Railway deployment configuration for Taskdeck
# =============================================================================
# This config is stored at deploy/railway.toml. Railway does not auto-detect
# config files outside the repo root, so you must set the Config Path to
# "deploy/railway.toml" in the Railway service settings.
#
# Deployment steps:
#   1. Create a Railway project at https://railway.app
#   2. Link this repo
#   3. Set Config Path to "deploy/railway.toml" in service settings
#   4. Set environment variables (see deploy/.env.production.template), including
#      Auth__Registration__Mode=Closed for the safe public-deployment default
#   5. Attach a persistent volume at /app/data
#   6. Deploy
#
# See docs/platform/CLOUD_DEPLOYMENT_GUIDE.md for full instructions.
# =============================================================================

[build]
# Use the production Dockerfile (single container: API + SPA)
dockerfilePath = "deploy/Dockerfile.production"

# Build context is the repo root. Include deploy/ so entrypoint or config
# changes trigger a redeploy (not just app source changes).
watchPatterns = ["backend/**", "frontend/**", "deploy/**"]

[deploy]
# Railway injects PORT env var; ASPNETCORE_URLS in the Dockerfile reads it
# via the ${PORT:-5000} default.
#
# Health check: Railway pings this path after deploy to verify readiness.
healthcheckPath = "/health/ready"
healthcheckTimeout = 30

# Restart on crash (Railway default behavior, explicit for clarity)
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

# Number of replicas (start with 1 for SQLite single-writer constraint)
numReplicas = 1
