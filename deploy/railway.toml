# =============================================================================
# Railway deployment configuration for Taskdeck
# =============================================================================
# Railway reads this file from the repo root (or deploy/ if configured).
#
# Deployment steps:
#   1. Create a Railway project at https://railway.app
#   2. Link this repo
#   3. Set environment variables (see deploy/.env.production.template)
#   4. Attach a persistent volume at /app/data
#   5. Deploy
#
# See docs/platform/CLOUD_DEPLOYMENT_GUIDE.md for full instructions.
# =============================================================================

[build]
# Use the production Dockerfile (single container: API + SPA)
dockerfilePath = "deploy/Dockerfile.production"

# Build context is the repo root
watchPatterns = ["backend/**", "frontend/**", "deploy/Dockerfile.production"]

[deploy]
# Railway injects PORT env var; ASPNETCORE_URLS in the Dockerfile reads it
# via the ${PORT:-5000} default.
#
# Health check: Railway pings this path after deploy to verify readiness.
healthcheckPath = "/health/ready"
healthcheckTimeout = 30

# Restart on crash (Railway default behavior, explicit for clarity)
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

# Number of replicas (start with 1 for SQLite single-writer constraint)
numReplicas = 1
