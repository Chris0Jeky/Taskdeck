name: taskdeck

services:
  api:
    profiles: ["baseline"]
    image: taskdeck-api:local
    build:
      context: ..
      dockerfile: deploy/docker/backend.Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      ConnectionStrings__DefaultConnection: Data Source=/app/data/taskdeck.db
      Jwt__SecretKey: ${TASKDECK_JWT_SECRET:?TASKDECK_JWT_SECRET must be set to a strong, unpredictable secret}
      Jwt__Issuer: ${TASKDECK_JWT_ISSUER:-Taskdeck}
      Jwt__Audience: ${TASKDECK_JWT_AUDIENCE:-TaskdeckUsers}
      Jwt__ExpirationMinutes: ${TASKDECK_JWT_EXPIRATION_MINUTES:-1440}
      Llm__EnableLiveProviders: ${TASKDECK_LLM_ENABLE_LIVE_PROVIDERS:-false}
      Llm__Provider: ${TASKDECK_LLM_PROVIDER:-Mock}
      Llm__OpenAi__ApiKey: ${TASKDECK_LLM_OPENAI_API_KEY:-}
      Llm__Gemini__ApiKey: ${TASKDECK_LLM_GEMINI_API_KEY:-}
      DevelopmentSandbox__Enabled: "false"
    volumes:
      - taskdeck-db:/app/data
    expose:
      - "8080"
    restart: unless-stopped

  web:
    profiles: ["baseline"]
    image: taskdeck-web:local
    build:
      context: ..
      dockerfile: deploy/docker/frontend.Dockerfile
      args:
        VITE_API_BASE_URL: ${TASKDECK_VITE_API_BASE_URL:-/api}
    expose:
      - "8080"
    restart: unless-stopped

  proxy:
    profiles: ["baseline"]
    image: nginx:1.27-alpine
    depends_on:
      - api
      - web
    ports:
      - "${TASKDECK_PROXY_PORT:-8080}:8080"
    volumes:
      - ./nginx/reverse-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

volumes:
  taskdeck-db:
