name: taskdeck

# Hardening notes (OPS-29):
#   - `mem_limit` / `cpus` are applied by `docker compose up` in non-swarm mode.
#   - `deploy.resources.limits` is honoured by swarm and by `docker compose
#     --compatibility`. We keep both so limits apply regardless of how the
#     stack is launched.
#   - `logging` caps per-container log disk usage. Without this, json-file logs
#     grow without bound on long-running hosts.
#   - `init: true` runs `tini` as PID 1 so SIGTERM/SIGINT are forwarded to the
#     app process even when the entrypoint is not a shell.
#   - `security_opt: no-new-privileges` is defence-in-depth; it blocks the
#     process (and children) from gaining privileges via setuid binaries.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  api:
    profiles: ["baseline"]
    image: taskdeck-api:local
    build:
      context: ..
      dockerfile: deploy/docker/backend.Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      ConnectionStrings__DefaultConnection: Data Source=/app/data/taskdeck.db
      Jwt__SecretKey: ${TASKDECK_JWT_SECRET:?TASKDECK_JWT_SECRET must be set to a strong, unpredictable secret}
      Jwt__Issuer: ${TASKDECK_JWT_ISSUER:-Taskdeck}
      Jwt__Audience: ${TASKDECK_JWT_AUDIENCE:-TaskdeckUsers}
      Jwt__ExpirationMinutes: ${TASKDECK_JWT_EXPIRATION_MINUTES:-1440}
      Llm__EnableLiveProviders: ${TASKDECK_LLM_ENABLE_LIVE_PROVIDERS:-false}
      Llm__Provider: ${TASKDECK_LLM_PROVIDER:-Mock}
      Llm__OpenAi__ApiKey: ${TASKDECK_LLM_OPENAI_API_KEY:-}
      Llm__Gemini__ApiKey: ${TASKDECK_LLM_GEMINI_API_KEY:-}
      DevelopmentSandbox__Enabled: "false"
    volumes:
      - taskdeck-db:/app/data
    expose:
      - "8080"
    init: true
    mem_limit: 512M
    mem_reservation: 256M
    cpus: 1.0
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 256M
    restart: unless-stopped

  web:
    profiles: ["baseline"]
    image: taskdeck-web:local
    build:
      context: ..
      dockerfile: deploy/docker/frontend.Dockerfile
      args:
        VITE_API_BASE_URL: ${TASKDECK_VITE_API_BASE_URL:-/api}
    expose:
      - "8080"
    init: true
    mem_limit: 128M
    mem_reservation: 64M
    cpus: 0.5
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
        reservations:
          memory: 64M
    restart: unless-stopped

  proxy:
    profiles: ["baseline"]
    # Unprivileged base: runs as UID 101, listens on 8080 natively. This keeps
    # the reverse proxy out of the last-root-container bucket so the whole
    # baseline stack runs non-root end to end.
    image: nginxinc/nginx-unprivileged:1.27-alpine
    depends_on:
      - api
      - web
    ports:
      - "${TASKDECK_PROXY_PORT:-8080}:8080"
    volumes:
      - ./nginx/reverse-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    init: true
    mem_limit: 128M
    mem_reservation: 64M
    cpus: 0.5
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
        reservations:
          memory: 64M
    restart: unless-stopped

volumes:
  taskdeck-db:
