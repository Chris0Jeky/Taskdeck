<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="432" viewBox="0 0 1400 432"><rect width="100%" height="100%" fill="white"/><text x="24" y="30" font-family="sans-serif" font-size="20" font-weight="bold">Processing And Route Sequence</text><text x="24" y="58" font-family="monospace" font-size="14">sequenceDiagram</text><text x="24" y="80" font-family="monospace" font-size="14">    participant U as User / Adapter</text><text x="24" y="102" font-family="monospace" font-size="14">    participant I as Canonical Intake</text><text x="24" y="124" font-family="monospace" font-size="14">    participant P as Policy + Router</text><text x="24" y="146" font-family="monospace" font-size="14">    participant J as Job Runner</text><text x="24" y="168" font-family="monospace" font-size="14">    participant H as Processor Host</text><text x="24" y="190" font-family="monospace" font-size="14">    participant S as Stores</text><text x="24" y="212" font-family="monospace" font-size="14">    U-&gt;&gt;I: Source + requested intent</text><text x="24" y="234" font-family="monospace" font-size="14">    I-&gt;&gt;S: Capture and immutable SourceAsset</text><text x="24" y="256" font-family="monospace" font-size="14">    I-&gt;&gt;P: capability + consent + limits</text><text x="24" y="278" font-family="monospace" font-size="14">    P-&gt;&gt;S: policy snapshot + route decision</text><text x="24" y="300" font-family="monospace" font-size="14">    P-&gt;&gt;J: create ProcessingJob</text><text x="24" y="322" font-family="monospace" font-size="14">    J-&gt;&gt;H: typed inputs + session secret</text><text x="24" y="344" font-family="monospace" font-size="14">    H--&gt;&gt;J: typed outputs + usage + warnings</text><text x="24" y="366" font-family="monospace" font-size="14">    J-&gt;&gt;S: ProcessingRun + Representations + Candidates</text><text x="24" y="388" font-family="monospace" font-size="14">    J--&gt;&gt;U: inspectable partial/final state</text></svg>
