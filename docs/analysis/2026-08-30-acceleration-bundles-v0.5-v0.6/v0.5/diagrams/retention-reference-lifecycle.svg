<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="256" viewBox="0 0 1400 256"><rect width="100%" height="100%" fill="white"/><text x="24" y="30" font-family="sans-serif" font-size="20" font-weight="bold">Retention Reference Lifecycle</text><text x="24" y="58" font-family="monospace" font-size="14">stateDiagram-v2</text><text x="24" y="80" font-family="monospace" font-size="14">  [*] --&gt; Referenced</text><text x="24" y="102" font-family="monospace" font-size="14">  Referenced --&gt; Eligible: age policy met</text><text x="24" y="124" font-family="monospace" font-size="14">  Eligible --&gt; Retained: pinned / accepted evidence / active reference</text><text x="24" y="146" font-family="monospace" font-size="14">  Eligible --&gt; Planned: dry-run sweep</text><text x="24" y="168" font-family="monospace" font-size="14">  Planned --&gt; Released: owner-scoped reference release</text><text x="24" y="190" font-family="monospace" font-size="14">  Released --&gt; Deleted: last reference removed transactionally</text><text x="24" y="212" font-family="monospace" font-size="14">  Released --&gt; Referenced: object still has references</text></svg>
