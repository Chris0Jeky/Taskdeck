<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="300" viewBox="0 0 1400 300"><rect width="100%" height="100%" fill="white"/><text x="24" y="30" font-family="sans-serif" font-size="20" font-weight="bold">Automation Safety Ladder</text><text x="24" y="58" font-family="monospace" font-size="14">flowchart LR</text><text x="24" y="80" font-family="monospace" font-size="14">  A[Candidate persisted] --&gt; B{Permission + evidence valid?}</text><text x="24" y="102" font-family="monospace" font-size="14">  B -- no --&gt; X[Review only]</text><text x="24" y="124" font-family="monospace" font-size="14">  B -- yes --&gt; C[Shadow evaluation]</text><text x="24" y="146" font-family="monospace" font-size="14">  C --&gt; D{Parity + compensation + kill switch proved?}</text><text x="24" y="168" font-family="monospace" font-size="14">  D -- no --&gt; X</text><text x="24" y="190" font-family="monospace" font-size="14">  D -- yes --&gt; E[Stable tiny canary]</text><text x="24" y="212" font-family="monospace" font-size="14">  E --&gt; F{No reversals and bounded human edits?}</text><text x="24" y="234" font-family="monospace" font-size="14">  F -- no --&gt; G[Stop and investigate]</text><text x="24" y="256" font-family="monospace" font-size="14">  F -- yes --&gt; H[Owner-authorised expansion]</text></svg>
