# Project-scoped Codex MCP configuration for Taskdeck.
# This file is loaded when the repository is a trusted project.

approval_policy = "on-request"
sandbox_mode = "workspace-write"

[features]
multi_agent = true

[agents]
# Each thread starts its own MCP stack. 10 threads x this stack measured ~21 gateway
# processes in one session (agent-harness#87) — keep the cap inside the right-sized
# fan-out range (<=3-5; <=8-12 only for a genuine sweep).
max_threads = 4
max_depth = 2
job_max_runtime_seconds = 8000

[agents.issue_worker]
description = "Implement one Taskdeck issue in an isolated worktree. Use taskdeck-worktree-issue-worker, keep ownership narrow, commit small, test, open a ready PR, and return exact evidence to the coordinator."
nickname_candidates = ["IssueWorker", "WorktreeWorker", "PatchWorker"]

[agents.pr_reviewer]
description = "Apply Taskdeck-specific PR risk lenses when the canonical review pipeline requests an independent pass. Focus on bugs, security, missing tests, docs drift, and merge risk."
nickname_candidates = ["Reviewer", "ColdReview", "Adversary"]

[agents.ci_recovery]
description = "Triage failing CI, review comments, bot comments, and conflicts for a Taskdeck PR. Use taskdeck-ci-conflict-recovery."
nickname_candidates = ["CIFixer", "Recovery", "Triage"]

[shell_environment_policy]
inherit = "all"

[windows]
sandbox = "elevated"

[shell_environment_policy.set]
PATH = "C:\\Users\\Public\\codex-shell-home\\bin;C:\\Program Files\\Docker\\Docker\\resources\\bin;C:\\Users\\jekyt\\AppData\\Local\\Microsoft\\WindowsApps;C:\\Program Files\\Git\\cmd;C:\\Program Files\\dotnet;C:\\Program Files\\nodejs;C:\\Program Files\\GitHub CLI;C:\\Windows\\system32;C:\\Windows;C:\\Windows\\System32\\Wbem;C:\\Windows\\System32\\WindowsPowerShell\\v1.0;C:\\Windows\\System32\\OpenSSH;C:\\Users\\jekyt\\source\\Taskdeck\\.runtime-codex\\bin"
HOME = 'C:\Users\jekyt\source\Taskdeck\.runtime-codex\home'
DOTNET_CLI_HOME = 'C:\Users\jekyt\source\Taskdeck\.runtime-codex\dotnet-home'
NUGET_PACKAGES = 'C:\Users\jekyt\source\Taskdeck\.runtime-codex\nuget\packages'
GIT_CONFIG_GLOBAL = 'C:\Users\jekyt\source\Taskdeck\.runtime-codex\home\.gitconfig'

[mcp_servers.openaiDeveloperDocs]
url = "https://developers.openai.com/mcp"
startup_timeout_sec = 20
tool_timeout_sec = 120

[mcp_servers.context7]
command = "npx"
args = ["-y", "@upstash/context7-mcp"]
startup_timeout_sec = 20
tool_timeout_sec = 120

[mcp_servers.ripgrep]
command = "npx"
args = ["-y", "mcp-ripgrep@latest"]
startup_timeout_sec = 20
tool_timeout_sec = 120

[mcp_servers.playwright]
command = "npx"
args = ["-y", "@executeautomation/playwright-mcp-server"]
startup_timeout_sec = 30
tool_timeout_sec = 180

[mcp_servers.chromeDevTools]
command = "npx"
args = ["-y", "chrome-devtools-mcp@latest"]
startup_timeout_sec = 30
tool_timeout_sec = 180

# The Docker MCP gateway is declared ONCE, at user scope (global MCP_DOCKER). Re-declaring it
# here started a second gateway process per session — do not add it back (agent-harness#87).

[mcp_servers.github]
url = "https://api.githubcopilot.com/mcp/"
bearer_token_env_var = "GITHUB_PAT"
startup_timeout_sec = 20
tool_timeout_sec = 120

[mcp_servers.github.tools.add_issue_comment]
approval_mode = "approve"
