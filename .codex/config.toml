# Project-scoped Codex MCP configuration for Taskdeck.
# This file is loaded when the repository is a trusted project.

approval_policy = "on-request"
sandbox_mode = "workspace-write"

[features]
multi_agent = true

[shell_environment_policy]
inherit = "all"

[windows]
sandbox = "elevated"

[shell_environment_policy.set]
PATH = "C:\\Users\\jekyt\\source\\Taskdeck\\.runtime-codex\\bin;C:\\Users\\Public\\codex-shell-home\\bin;C:\\Program Files\\Git\\cmd;C:\\Program Files\\dotnet;C:\\Program Files\\nodejs;C:\\Program Files\\GitHub CLI;C:\\Windows\\system32;C:\\Windows;C:\\Windows\\System32\\Wbem;C:\\Windows\\System32\\WindowsPowerShell\\v1.0;C:\\Windows\\System32\\OpenSSH"
HOME = 'C:\Users\jekyt\source\Taskdeck\.runtime-codex\home'
DOTNET_CLI_HOME = 'C:\Users\jekyt\source\Taskdeck\.runtime-codex\dotnet-home'
NUGET_PACKAGES = 'C:\Users\jekyt\source\Taskdeck\.runtime-codex\nuget\packages'
GIT_CONFIG_GLOBAL = 'C:\Users\jekyt\source\Taskdeck\.runtime-codex\home\.gitconfig'

[mcp_servers.openaiDeveloperDocs]
url = "https://developers.openai.com/mcp"
startup_timeout_sec = 20
tool_timeout_sec = 120

[mcp_servers.context7]
command = "npx"
args = ["-y", "@upstash/context7-mcp"]
startup_timeout_sec = 20
tool_timeout_sec = 120

[mcp_servers.ripgrep]
command = "npx"
args = ["-y", "mcp-ripgrep@latest"]
startup_timeout_sec = 20
tool_timeout_sec = 120

[mcp_servers.playwright]
command = "npx"
args = ["-y", "@executeautomation/playwright-mcp-server"]
startup_timeout_sec = 30
tool_timeout_sec = 180

[mcp_servers.github]
url = "https://api.githubcopilot.com/mcp/"
bearer_token_env_var = "GITHUB_PAT"
startup_timeout_sec = 20
tool_timeout_sec = 120
