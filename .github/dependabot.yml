# Dependabot configuration for automated dependency updates
# Policy: docs/ops/DEPENDENCY_UPDATE_POLICY.md
# Linked issue: #148 (OPS-18)

version: 2

updates:
  # --- NuGet (backend .NET) ---
  - package-ecosystem: nuget
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Chicago
    open-pull-requests-limit: 10
    reviewers:
      - jekyt
    labels:
      - dependencies
      - backend
    groups:
      # Group minor/patch updates together to reduce PR noise
      dotnet-minor-patch:
        update-types:
          - minor
          - patch
    # Let other major versions come as individual PRs for explicit review.
    ignore:
      # Keep the three RUNTIME EF Core packages mutually consistent on the 8.x
      # line (see #760/#767). Dependabot repeatedly proposes EF Core 9.x for the
      # main package while the Sqlite/Design providers stay on 8.x, which desyncs
      # them and reintroduces the ambiguous ExecuteDeleteAsync break (fixed in
      # #1102 and again in #1106). Block their major bumps until the project
      # deliberately migrates the runtime EF stack together.
      # Note: Microsoft.EntityFrameworkCore.Tools is a design-time-only package
      # (PrivateAssets) tracked separately on its own line and is intentionally
      # NOT pinned here; it does not affect the runtime compile.
      - dependency-name: "Microsoft.EntityFrameworkCore"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.EntityFrameworkCore.Sqlite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.EntityFrameworkCore.Design"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "deps(nuget)"

  # --- npm (frontend) ---
  - package-ecosystem: npm
    directory: /frontend/taskdeck-web
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Chicago
    open-pull-requests-limit: 10
    reviewers:
      - jekyt
    labels:
      - dependencies
      - frontend
    groups:
      # Group minor/patch updates together
      npm-minor-patch:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: "deps(npm)"

  # --- GitHub Actions ---
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Chicago
    open-pull-requests-limit: 5
    reviewers:
      - jekyt
    labels:
      - dependencies
      - ci
    groups:
      # Group all Actions updates together since they are low-risk
      actions-all:
        update-types:
          - major
          - minor
          - patch
    commit-message:
      prefix: "deps(actions)"
