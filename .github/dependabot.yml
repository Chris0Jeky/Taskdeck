# Dependabot configuration for automated dependency updates
# Policy: docs/ops/DEPENDENCY_UPDATE_POLICY.md
# Linked issue: #148 (OPS-18)

version: 2

updates:
  # --- NuGet (backend .NET) ---
  - package-ecosystem: nuget
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Chicago
    open-pull-requests-limit: 10
    reviewers:
      - jekyt
    labels:
      - dependencies
      - backend
    groups:
      # Group minor/patch updates together to reduce PR noise
      dotnet-minor-patch:
        update-types:
          - minor
          - patch
    # Let other major versions come as individual PRs for explicit review.
    ignore:
      # Keep the three RUNTIME EF Core packages mutually consistent on the 8.x
      # line (see #760/#767). Dependabot repeatedly proposes EF Core 9.x for the
      # main package while the Sqlite/Design providers stay on 8.x, which desyncs
      # them and reintroduces the ambiguous ExecuteDeleteAsync break (fixed in
      # #1102 and again in #1106). Block their major bumps until the project
      # deliberately migrates the runtime EF stack together.
      - dependency-name: "Microsoft.EntityFrameworkCore"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.EntityFrameworkCore.Sqlite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.EntityFrameworkCore.Design"
        update-types: ["version-update:semver-major"]
      # Central Package Management aligns the whole backend stack to the net8.0
      # TFM (#1127, ADR-0039). The packages below were re-aligned DOWN from 9.x/10.x
      # to the 8.x line; without major-version caps the next weekly dependabot run
      # re-proposes the same majors and reverts the alignment — the exact recurrence
      # ADR-0034 documents. Block their majors until the backend deliberately moves
      # off net8.0 as one coordinated migration.
      # Microsoft.EntityFrameworkCore.Tools is now capped here too: it is design-time
      # only (PrivateAssets), but on its 10.x line it dragged EF Core 9.x in
      # transitively, so it is pinned to 8.0.x with the rest of the EF stack (ADR-0039).
      - dependency-name: "Microsoft.EntityFrameworkCore.Tools"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.AspNetCore.SignalR.Client"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.Extensions.Hosting"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.Extensions.Http.Polly"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.Extensions.Logging.Abstractions"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Npgsql.EntityFrameworkCore.PostgreSQL"
        update-types: ["version-update:semver-major"]
      # FluentAssertions 8.x+ requires a paid commercial license (Xceed); the
      # project intentionally stays on the free 7.x line (maintainer decision on
      # #1088). Block major bumps so v8 isn't re-proposed every cycle.
      - dependency-name: "FluentAssertions"
        update-types: ["version-update:semver-major"]
      # StackExchange.Redis backs the SignalR backplane (ADR-0025) and the optional
      # Redis-backed cache service (RedisCacheService), both config-gated and DORMANT
      # in the single-instance default (Cache:Provider=InMemory, SignalR:Redis
      # connection string empty). Under the archive pivot (single-instance, SQLite,
      # personal-use) a major bump carries breaking-change risk on never-exercised
      # runtime paths with no benefit, so block its majors (PR #1224 closed for
      # proposing 3.0.0). Revisit only if Redis is ever deliberately activated.
      - dependency-name: "StackExchange.Redis"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "deps(nuget)"

  # --- npm (frontend) ---
  - package-ecosystem: npm
    directory: /frontend/taskdeck-web
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Chicago
    open-pull-requests-limit: 10
    reviewers:
      - jekyt
    labels:
      - dependencies
      - frontend
    groups:
      # Group minor/patch updates together
      npm-minor-patch:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: "deps(npm)"

  # --- GitHub Actions ---
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Chicago
    open-pull-requests-limit: 5
    reviewers:
      - jekyt
    labels:
      - dependencies
      - ci
    groups:
      # Group all Actions updates together since they are low-risk
      actions-all:
        update-types:
          - major
          - minor
          - patch
    commit-message:
      prefix: "deps(actions)"
