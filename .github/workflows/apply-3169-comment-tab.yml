name: Apply PR 3169 comment-tab repair

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: apply-3169-comment-tab-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: true

jobs:
  repair:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/3006-yaml-nonprintable-residuals'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
      TRIGGER_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout exact pull request branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Verify exact triggering head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TRIGGER_HEAD"

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.13.1"

      - name: Prove the committed regression is red
        shell: bash
        run: |
          set -euo pipefail
          test "$(grep -Fc "test('permits horizontal tabs in comment-only frontmatter content'" scripts/check-docs-governance.review-residuals.test.mjs)" -eq 1
          set +e
          node --test --test-name-pattern="permits horizontal tabs in comment-only frontmatter content" scripts/check-docs-governance.review-residuals.test.mjs > /tmp/pr-3169-red.log 2>&1
          status=$?
          set -e
          cat /tmp/pr-3169-red.log
          if [ "$status" -eq 0 ]; then
            echo 'Expected the comment-tab regression to fail before the validator repair.' >&2
            exit 1
          fi
          grep -F 'forbidden control or non-printable character' /tmp/pr-3169-red.log

      - name: Exempt horizontal tabs only in comment content
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/check-docs-governance.mjs')
          source = path.read_text(encoding='utf-8').replace('\r\n', '\n')

          def replace_once(old: str, new: str, label: str) -> None:
              global source
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'expected one {label}, found {count}')
              source = source.replace(old, new, 1)

          replace_once(
              'const FORBIDDEN_SCALAR_CONTROL = /[\\u0000-\\u001F\\u007F-\\u009F\\uFFFE\\uFFFF]/u\n',
              'const FORBIDDEN_SCALAR_CONTROL = /[\\u0000-\\u001F\\u007F-\\u009F\\uFFFE\\uFFFF]/u\n'
              'const FORBIDDEN_COMMENT_CONTROL = /[\\u0000-\\u0008\\u000B-\\u001F\\u007F-\\u009F\\uFFFE\\uFFFF]/u\n',
              'scalar-control definition',
          )

          replace_once(
              '    if (FORBIDDEN_SCALAR_CONTROL.test(line)) {\n'
              '      structureErrors.push(\n'
              '        `${rulePath} front matter has a forbidden control or non-printable character, which this check cannot parse`,\n'
              '      )\n'
              '      continue\n'
              '    }\n',
              '    const commentOnly = /^ *#/.test(line)\n'
              '    const forbiddenCharacter = commentOnly\n'
              '      ? FORBIDDEN_COMMENT_CONTROL\n'
              '      : FORBIDDEN_SCALAR_CONTROL\n'
              '    if (forbiddenCharacter.test(line)) {\n'
              '      structureErrors.push(\n'
              '        `${rulePath} front matter has a forbidden control or non-printable character, which this check cannot parse`,\n'
              '      )\n'
              '      continue\n'
              '    }\n',
              'frontmatter control check',
          )

          replace_once(
              '    if (/^ *#/.test(line)) {\n'
              '      continue\n'
              '    }\n',
              '    if (commentOnly) {\n'
              '      continue\n'
              '    }\n',
              'comment-only skip',
          )

          path.write_text(source, encoding='utf-8', newline='\n')
          PY

      - name: Verify complete docs-governance contracts
        shell: bash
        run: |
          set -euo pipefail
          node --test scripts/check-docs-governance*.test.mjs
          node scripts/check-docs-governance.mjs
          git diff --check

      - name: Publish the exact-parent repair and remove this applicator
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TRIGGER_HEAD"
          remote_head="$(git ls-remote --heads origin "refs/heads/$PR_HEAD_REF" | awk '{print $1}')"
          test -n "$remote_head"
          test "$remote_head" = "$TRIGGER_HEAD"

          git rm .github/workflows/apply-3169-comment-tab.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/check-docs-governance.mjs scripts/check-docs-governance.review-residuals.test.mjs
          git diff --cached --check

          expected_names=$'.github/workflows/apply-3169-comment-tab.yml\nscripts/check-docs-governance.mjs'
          actual_names="$(git diff --cached --name-only | sort)"
          test "$actual_names" = "$expected_names"

          tree="$(git write-tree)"
          repair_commit="$(printf '%s\n' 'fix(docs): permit tabs in frontmatter comments' | git commit-tree "$tree" -p "$TRIGGER_HEAD")"
          test "$(git rev-parse "$repair_commit^")" = "$TRIGGER_HEAD"
          git push --force-with-lease="refs/heads/$PR_HEAD_REF:$TRIGGER_HEAD" origin "$repair_commit:refs/heads/$PR_HEAD_REF"
