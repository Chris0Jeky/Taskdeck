name: Apply issue 1860 implementation v2

on:
  push:
    branches:
      - fix/1860-fingerprint-guard-residuals

permissions:
  contents: write

concurrency:
  group: apply-1860-implementation-v2
  cancel-in-progress: true

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-slim
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/1860-fingerprint-guard-residuals
          fetch-depth: 0

      - name: Implement clean tracked deletion classification
        shell: pwsh
        run: |
          $path = 'scripts/agentic/Assert-TaskdeckCheckoutFingerprint.ps1'
          $text = [System.IO.File]::ReadAllText($path).Replace("`r`n", "`n")

          $oldCatch = @'
                  catch [System.Management.Automation.ItemNotFoundException] {
                      if ($null -ne $MissingBaselinePaths -and $MissingBaselinePaths.ContainsKey($relativePath)) {
                          continue
                      }
                      throw 'status artifact disappeared before it could be fingerprinted'
                  }
          '@
          $newCatch = @'
                  catch [System.Management.Automation.ItemNotFoundException] {
                      if ($null -ne $MissingBaselinePaths -and $MissingBaselinePaths.ContainsKey($relativePath)) {
                          continue
                      }
                      if ($null -ne $MissingBaselinePaths -and ([string]$entry.code).Contains('D')) {
                          $records.Add([pscustomobject]@{
                                  path = $relativePath
                                  code = $entry.code
                                  deleted = $true
                                  length = [Int64]0
                                  hash = ''
                              })
                          continue
                      }
                      throw 'status artifact disappeared before it could be fingerprinted'
                  }
          '@

          $oldStability = @'
              foreach ($record in $Records) {
                  $fullPath = Get-ArtifactPath -Checkout $Checkout -RelativePath $record.path
                  try {
                      $item = Get-Item -LiteralPath $fullPath -Force -ErrorAction Stop
                  }
                  catch [System.Management.Automation.ItemNotFoundException] {
                      throw ('status inventory changed while it was fingerprinted: ' +
                          (ConvertTo-DiagnosticText -Value $record.path) + ' disappeared')
                  }

                  if ($item.PSIsContainer -or (($item.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) -or
                      [Int64]$item.Length -ne [Int64]$record.length) {
                      throw ('status inventory changed while it was fingerprinted: ' +
                          (ConvertTo-DiagnosticText -Value $record.path) + ' no longer matches its fingerprint')
                  }
              }
          '@
          $newStability = @'
              foreach ($record in $Records) {
                  $fullPath = Get-ArtifactPath -Checkout $Checkout -RelativePath $record.path
                  $deletedProperty = $record.PSObject.Properties['deleted']
                  if ($null -ne $deletedProperty -and [bool]$deletedProperty.Value) {
                      if (Test-Path -LiteralPath $fullPath) {
                          throw ('status inventory changed while it was fingerprinted: ' +
                              (ConvertTo-DiagnosticText -Value $record.path) + ' reappeared')
                      }
                      continue
                  }

                  try {
                      $item = Get-Item -LiteralPath $fullPath -Force -ErrorAction Stop
                  }
                  catch [System.Management.Automation.ItemNotFoundException] {
                      throw ('status inventory changed while it was fingerprinted: ' +
                          (ConvertTo-DiagnosticText -Value $record.path) + ' disappeared')
                  }

                  if ($item.PSIsContainer -or (($item.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) -or
                      [Int64]$item.Length -ne [Int64]$record.length) {
                      throw ('status inventory changed while it was fingerprinted: ' +
                          (ConvertTo-DiagnosticText -Value $record.path) + ' no longer matches its fingerprint')
                  }
              }
          '@

          $oldClassification = @'
              foreach ($path in ($after.Keys | Sort-Object)) {
                  if (-not $before.ContainsKey($path)) {
                      # Absent from the baseline is not the same as new on disk: a file
                      # that was clean tracked content at capture time never entered the
                      # baseline, so the lane overwrote it rather than creating it. Only
                      # an untracked (`??`) or newly index-added (`A`) artifact is really
                      # a creation.
                      $code = [string]$after[$path].code
                      $classification = 'overwritten'
                      if ($code -eq '??' -or $code.StartsWith('A', [StringComparison]::Ordinal)) {
                          $classification = 'created'
                      }
                      $changes.Add([pscustomobject]@{ path = $path; classification = $classification })
                  }
              }
          '@
          $newClassification = @'
              foreach ($path in ($after.Keys | Sort-Object)) {
                  if (-not $before.ContainsKey($path)) {
                      $deletedProperty = $after[$path].PSObject.Properties['deleted']
                      if ($null -ne $deletedProperty -and [bool]$deletedProperty.Value) {
                          $classification = 'deleted'
                      }
                      else {
                          # Absent from the baseline is not the same as new on disk: a file
                          # that was clean tracked content at capture time never entered the
                          # baseline, so the lane overwrote it rather than creating it. Only
                          # an untracked (`??`) or newly index-added (`A`) artifact is really
                          # a creation.
                          $code = [string]$after[$path].code
                          $classification = 'overwritten'
                          if ($code -eq '??' -or $code.StartsWith('A', [StringComparison]::Ordinal)) {
                              $classification = 'created'
                          }
                      }
                      $changes.Add([pscustomobject]@{ path = $path; classification = $classification })
                  }
              }
          '@

          foreach ($change in @(
              @{ Old = $oldCatch; New = $newCatch; Name = 'missing-artifact branch' },
              @{ Old = $oldStability; New = $newStability; Name = 'inventory stability branch' },
              @{ Old = $oldClassification; New = $newClassification; Name = 'compare classification branch' }
          )) {
              $count = ([regex]::Matches($text, [regex]::Escape($change.Old))).Count
              if ($count -ne 1) { throw "Expected exactly one $($change.Name), found $count." }
              $text = $text.Replace($change.Old, $change.New)
          }
          [System.IO.File]::WriteAllText($path, $text, [System.Text.UTF8Encoding]::new($false))

      - name: Canonicalize repeated regression blocks
        shell: pwsh
        run: |
          $path = 'scripts/agentic/Test-Assert-TaskdeckCheckoutFingerprint.ps1'
          $text = [System.IO.File]::ReadAllText($path).Replace("`r`n", "`n")
          $marker = "Run-Test 'classifies deletion of a clean tracked file outside the status baseline' {"
          $nextMarker = "Run-Test 'detects creation after capture' {"
          $first = $text.IndexOf($marker, [StringComparison]::Ordinal)
          $second = if ($first -ge 0) { $text.IndexOf($marker, $first + $marker.Length, [StringComparison]::Ordinal) } else { -1 }
          if ($first -lt 0) { throw 'The required deletion regression is missing.' }
          if ($second -ge 0) {
              $next = $text.IndexOf($nextMarker, $second, [StringComparison]::Ordinal)
              if ($next -lt 0) { throw 'Could not locate the test following the repeated regression blocks.' }
              $text = $text.Remove($second, $next - $second)
          }
          $remaining = ([regex]::Matches($text, [regex]::Escape($marker))).Count
          if ($remaining -ne 1) { throw "Expected one canonical deletion regression, found $remaining." }
          [System.IO.File]::WriteAllText($path, $text, [System.Text.UTF8Encoding]::new($false))

      - name: Verify focused fingerprint harness
        shell: pwsh
        run: pwsh -NoLogo -NoProfile -NonInteractive -File scripts/agentic/Test-Assert-TaskdeckCheckoutFingerprint.ps1

      - name: Commit implementation
        shell: pwsh
        run: |
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/agentic/Assert-TaskdeckCheckoutFingerprint.ps1 scripts/agentic/Test-Assert-TaskdeckCheckoutFingerprint.ps1
          git commit -m 'fix: classify clean tracked lane deletions'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin 'HEAD:fix/1860-fingerprint-guard-residuals'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
