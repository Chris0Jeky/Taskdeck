name: PR 3187 align Legacy fallback regression

# One-shot branch repair. The final step deletes this workflow after the focused contract passes.
on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
    paths:
      - .github/workflows/pr3187-stale-legacy-expectation.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: github.repository == 'Chris0Jeky/Taskdeck'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: codex/1434-legacy-fallback-copy
          fetch-depth: 0

      - name: Remove the obsolete duplicate-note expectation
        shell: python
        run: |
          from pathlib import Path

          path = Path('frontend/taskdeck-web/src/tests/components/review/ReviewProposalCard.diff.spec.ts')
          source = path.read_text(encoding='utf-8')
          old = "    expect(wrapper.find('[data-testid=\"review-diff-stored-ops-note\"]').exists()).toBe(true)\n"
          new = "    expect(wrapper.find('[data-testid=\"review-diff-stored-ops-note\"]').exists()).toBe(false)\n"
          if source.count(old) != 1:
              raise SystemExit(f'expected exactly one obsolete note assertion, found {source.count(old)}')
          path.write_text(source.replace(old, new), encoding='utf-8')

      - name: Verify the focused Legacy diff contract
        working-directory: frontend/taskdeck-web
        run: |
          npm ci
          npx vitest run src/tests/components/review/ReviewProposalCard.diff.spec.ts src/tests/components/review/ReviewProposalCard.copy.spec.ts

      - name: Publish the test-only repair and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/pr3187-stale-legacy-expectation.yml
          git add frontend/taskdeck-web/src/tests/components/review/ReviewProposalCard.diff.spec.ts
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(review): align Legacy fallback expectation"
          git push origin HEAD:codex/1434-legacy-fallback-copy
