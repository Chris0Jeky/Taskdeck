name: Repair PR 3193 exact-head applicator

on:
  push:
    branches:
      - automation/3193-exact-head-repair
    paths:
      - .github/workflows/repair-3193-exact-head.yml

permissions:
  contents: write

concurrency:
  group: repair-pr-3193-exact-head
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact repair commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify exact repair checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Bind the governance applicator to its triggering commit
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/apply-1543-secrets-governance.yml')
          source = path.read_text(encoding='utf-8')
          dollar = '$'

          replacements = [
              (
                  '  group: apply-1543-secrets-governance\n',
                  f'  group: apply-1543-secrets-governance-{dollar}{{{{ github.ref }}}}\n',
              ),
              (
                  '      - name: Checkout branch\n',
                  '      - name: Checkout exact triggering commit\n',
              ),
              (
                  '          ref: test/1543-secrets-evidence-verdict\n',
                  f'          ref: {dollar}{{{{ github.sha }}}}\n',
              ),
          ]
          for old, new in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one applicator anchor {old!r}, found {count}.')
              source = source.replace(old, new, 1)

          checkout_anchor = '''          fetch-depth: 0

      - name: Patch required docs governance contract
'''
          checkout_replacement = '''          fetch-depth: 0

      - name: Verify exact checkout provenance
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Patch required docs governance contract
'''
          if source.count(checkout_anchor) != 1:
              raise SystemExit('Expected one post-checkout applicator anchor.')
          source = source.replace(checkout_anchor, checkout_replacement, 1)

          publish_anchor = '''      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
'''
          publish_replacement = '''      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
'''
          if source.count(publish_anchor) != 1:
              raise SystemExit('Expected one pre-publication applicator anchor.')
          source = source.replace(publish_anchor, publish_replacement, 1)

          path.write_text(source, encoding='utf-8', newline='\n')
          PY

      - name: Verify repaired workflow shape
        shell: bash
        run: |
          grep -F 'ref: ${{ github.sha }}' .github/workflows/apply-1543-secrets-governance.yml
          grep -F 'test "$(git rev-parse HEAD)" = "$GITHUB_SHA"' .github/workflows/apply-1543-secrets-governance.yml
          test "$(grep -Fc 'test "$(git rev-parse HEAD)" = "$GITHUB_SHA"' .github/workflows/apply-1543-secrets-governance.yml)" -eq 2
          git diff --check

      - name: Publish repaired applicator to the PR branch
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rm .github/workflows/repair-3193-exact-head.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/apply-1543-secrets-governance.yml
          git commit -m 'ci: bind secrets governance proof to triggering head'
          git push origin HEAD:test/1543-secrets-evidence-verdict
