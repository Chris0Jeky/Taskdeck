name: Repair PR 3193 exact-head applicator

on:
  push:
    branches:
      - automation/3193-exact-head-repair
    paths:
      - .github/workflows/repair-3193-exact-head.yml

permissions:
  contents: write

concurrency:
  group: repair-pr-3193-exact-head
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact repair commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify exact repair checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Bind the governance applicator to its triggering commit
        shell: bash
        run: python scripts/ci/repair-3193-exact-head.py

      - name: Verify repaired workflow shape
        shell: bash
        run: |
          python -m py_compile scripts/ci/repair-3193-exact-head.py
          test "$(grep -Fc 'Verify exact checkout provenance' .github/workflows/apply-1543-secrets-governance.yml)" -eq 1
          test "$(grep -Fc 'git rev-parse HEAD' .github/workflows/apply-1543-secrets-governance.yml)" -eq 2
          git diff --check

      - name: Publish repaired applicator to the PR branch
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rm .github/workflows/repair-3193-exact-head.yml scripts/ci/repair-3193-exact-head.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/apply-1543-secrets-governance.yml
          git commit -m 'ci: bind secrets governance proof to triggering head'
          git push origin HEAD:test/1543-secrets-evidence-verdict
