name: Apply issue 2075 archived detail refresh

on:
  push:
    branches:
      - fix/2075-refresh-archived-capture-detail

permissions:
  contents: write

concurrency:
  group: apply-2075-archived-detail-refresh
  cancel-in-progress: true

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/2075-refresh-archived-capture-detail
          fetch-depth: 0

      - name: Require an authoritative archived detail read
        shell: python
        run: |
          from pathlib import Path

          path = Path('frontend/taskdeck-web/src/views/paper/PaperInboxView.vue')
          old = "    const detail = await captureStore.peekDetail(itemId, { recordError: false, showToast: false })"
          new = "    const detail = await captureStore.peekDetail(itemId, {\n      forceRefresh: true,\n      recordError: false,\n      showToast: false,\n    })"
          text = path.read_text(encoding='utf-8')
          count = text.count(old)
          if count != 1:
              raise RuntimeError(f'Expected one archived detail anchor, found {count}')
          path.write_text(text.replace(old, new), encoding='utf-8')

      - name: Commit refresh contract and remove helper
        run: |
          git diff --check
          git rm .github/workflows/apply-2075-archived-detail-refresh.yml
          test "$(git diff --name-only | sort | tr '\n' ' ')" = ".github/workflows/apply-2075-archived-detail-refresh.yml frontend/taskdeck-web/src/views/paper/PaperInboxView.vue "
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/taskdeck-web/src/views/paper/PaperInboxView.vue
          git commit -m 'fix: refresh archived capture detail'
          git push origin 'HEAD:fix/2075-refresh-archived-capture-detail'
