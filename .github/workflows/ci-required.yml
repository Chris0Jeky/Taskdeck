name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  docs-governance:
    name: Docs Governance
    uses: ./.github/workflows/reusable-docs-governance.yml
    with:
      node-version: 24.13.1

  backend-architecture:
    name: Backend Architecture
    uses: ./.github/workflows/reusable-backend-architecture.yml
    with:
      dotnet-version: 8.0.x

  backend-unit:
    name: Backend Unit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: |
            backend/Taskdeck.sln
            backend/**/*.csproj

      - name: Restore backend
        run: dotnet restore backend/Taskdeck.sln

      - name: Run domain tests
        run: dotnet test backend/tests/Taskdeck.Domain.Tests/Taskdeck.Domain.Tests.csproj --configuration Release --no-restore --logger "trx;LogFileName=domain.trx" --results-directory "backend/TestResults/backend-unit/${{ matrix.os }}/domain"

      - name: Run application tests
        run: dotnet test backend/tests/Taskdeck.Application.Tests/Taskdeck.Application.Tests.csproj --configuration Release --no-restore --logger "trx;LogFileName=application.trx" --results-directory "backend/TestResults/backend-unit/${{ matrix.os }}/application"

      - name: Run CLI contract tests
        run: dotnet test backend/tests/Taskdeck.Cli.Tests/Taskdeck.Cli.Tests.csproj --configuration Release --no-restore --logger "trx;LogFileName=cli.trx" --results-directory "backend/TestResults/backend-unit/${{ matrix.os }}/cli"

      - name: Upload backend unit test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-unit-trx-${{ matrix.os }}
          path: backend/TestResults/backend-unit/${{ matrix.os }}
          if-no-files-found: ignore

  api-integration:
    name: API Integration
    uses: ./.github/workflows/reusable-api-integration.yml
    with:
      dotnet-version: 8.0.x

  frontend-unit:
    name: Frontend Unit
    uses: ./.github/workflows/reusable-frontend-unit.yml
    with:
      node-version: 24.13.1

  container-images:
    name: Container Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate compose baseline
        run: TASKDECK_JWT_SECRET=ci-placeholder-secret docker compose -f deploy/docker-compose.yml --profile baseline config > /tmp/taskdeck-compose.resolved.yml

      - name: Build backend container image
        run: docker build -f deploy/docker/backend.Dockerfile -t taskdeck-api:ci .

      - name: Build frontend container image
        run: docker build --build-arg VITE_API_BASE_URL=/api -f deploy/docker/frontend.Dockerfile -t taskdeck-web:ci .

      - name: Export container image artifacts
        run: |
          docker save taskdeck-api:ci | gzip -1 > /tmp/taskdeck-api.tar.gz
          docker save taskdeck-web:ci | gzip -1 > /tmp/taskdeck-web.tar.gz
          sha256sum /tmp/taskdeck-api.tar.gz /tmp/taskdeck-web.tar.gz /tmp/taskdeck-compose.resolved.yml > /tmp/taskdeck-container-artifacts.sha256

      - name: Upload container image artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container-image-artifacts
          path: |
            /tmp/taskdeck-api.tar.gz
            /tmp/taskdeck-web.tar.gz
            /tmp/taskdeck-compose.resolved.yml
            /tmp/taskdeck-container-artifacts.sha256
          if-no-files-found: ignore

  e2e-smoke:
    name: E2E Smoke
    needs:
      - docs-governance
      - backend-architecture
      - backend-unit
      - api-integration
      - frontend-unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: |
            backend/Taskdeck.sln
            backend/**/*.csproj

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.13.1
          cache: npm
          cache-dependency-path: frontend/taskdeck-web/package-lock.json

      - name: Restore backend
        run: dotnet restore backend/Taskdeck.sln

      - name: Install frontend dependencies
        working-directory: frontend/taskdeck-web
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ hashFiles('frontend/taskdeck-web/package-lock.json') }}

      - name: Install Playwright browser
        working-directory: frontend/taskdeck-web
        run: npx playwright install --with-deps chromium

      - name: Remove stale E2E database
        working-directory: frontend/taskdeck-web
        run: node -e "require('fs').rmSync('taskdeck.e2e.ci.db',{force:true});"

      - name: Run Playwright smoke tests
        timeout-minutes: 12
        working-directory: frontend/taskdeck-web
        env:
          CI: "true"
          TASKDECK_E2E_DB: taskdeck.e2e.ci.db
        run: npx playwright test --reporter=line

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/taskdeck-web/playwright-report
          if-no-files-found: ignore

      - name: Upload Playwright test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: frontend/taskdeck-web/test-results
          if-no-files-found: ignore
