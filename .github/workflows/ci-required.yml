# =============================================================================
# CI Required — PR merge gate
# =============================================================================
#
# Workflow Topology (see docs/analysis/2026-02-21_ci-github-actions-expansion-plan.md):
#
#   ci-required.yml          PR/push/merge_group gate (this file)
#     ├── reusable-docs-governance.yml        docs + golden-principles + ops governance
#     ├── release-workflow-contract            release-desktop dispatch hardening gate (#1795/#1806)
#     ├── reusable-backend-architecture.yml    architecture boundary tests
#     ├── reusable-backend-unit.yml            domain / application / CLI unit tests (Ubuntu + Windows)
#     ├── reusable-api-integration.yml         API integration tests (Ubuntu + Windows)
#     ├── reusable-migration-validation.yml    EF Core migration chain validation (TST-61)
#     ├── reusable-frontend-unit.yml           dev launcher + lint + typecheck + build + unit tests (Ubuntu + Windows)
#     ├── reusable-paper-color-audit.yml       PAPER-12 hex-literal regression gate (#1008)
#     ├── reusable-container-images.yml        compose validation + image build + artifact export
#     ├── reusable-gitleaks.yml                secret detection (PR scan, fail-on-detect) (#1132)
#     ├── reusable-dependency-security-signals.yml  vulnerable-dependency gate (high+, enforced) (#1132)
#     ├── reusable-sast-scanning.yml           Semgrep SAST gate (enforced) (#1132)
#     └── reusable-e2e-smoke.yml               Playwright smoke (depends on all above)
#
#   smart-ci-shadow.yml      Smart CI control plane in OBSERVATION mode (ADR-0066, CI-02 #2326)
#     ├── Smart CI / Plan                     base-ref planner on pull_request_target (read-only, no head code)
#     └── Smart CI / Required Gate            stable context; shadow until CI-03 #2327 registers it — changes NO job selection here
#   smart-ci-self-test.yml   Smart CI / Planner Self-Test — head-side planner/gate/pin tests on pull_request (R4 control lane)
#
#   ci-extended.yml          optional PR lane (label/path/manual dispatch)
#     ├── actionlint workflow lint
#     ├── dependency-review (PR only)
#     ├── reusable-dependency-security-signals.yml (label: security)
#     ├── reusable-openapi-guardrail.yml
#     ├── reusable-backend-solution.yml (label: testing, performance)
#     ├── reusable-e2e-smoke.yml (label: testing)
#     ├── reusable-e2e-cross-browser.yml (label: testing)
#     ├── reusable-demo-director-smoke.yml (label: automation)
#     ├── reusable-load-concurrency-harness.yml (label: testing)
#     ├── reusable-performance-regression-gate.yml (label: performance) — k6 thresholds + bundle size (#872)
#     ├── reusable-container-integration.yml (label: testing) — Testcontainers PostgreSQL
#     └── reusable-gitleaks.yml (non-blocking secrets detection, #871)
#
#   ci-nightly.yml           scheduled regression (03:25 UTC daily)
#     ├── reusable-openapi-guardrail.yml
#     ├── reusable-backend-solution.yml
#     ├── reusable-e2e-smoke.yml
#     ├── reusable-e2e-cross-browser.yml
#     ├── reusable-load-concurrency-harness.yml
#     └── reusable-container-images.yml
#
#   nightly-quality.yml      scheduled quality signals (03:55 UTC daily)
#     ├── backend coverage (domain + application)
#     ├── frontend coverage
#     └── reusable-dependency-security-signals.yml
#
#   ci-release.yml           release lane (tag/release/manual)
#     ├── release build verification (backend + frontend)
#     ├── reusable-sbom-provenance.yml  (CycloneDX SBOM + SLSA provenance, #103)
#     ├── reusable-gitleaks.yml (blocking secrets detection, #871)
#     └── reusable-container-images.yml
#
#   release-security.yml     release security deep scan (tag/release/manual)
#     ├── dependency inventory + vulnerability scan + enforcement
#     ├── reusable-sbom-provenance.yml  (CycloneDX SBOM + SLSA provenance, #103)
#     └── reusable-container-images.yml
#
#   pages-frontend.yml       GitHub Pages deploy (main push, frontend paths)
#
# Design principles:
#   - ci-required.yml is the merge gate: fast, deterministic, no opt-out
#   - Reusable workflows use workflow_call for composition by multiple callers
#   - ci-extended.yml runs heavier checks on label/path/manual triggers
#   - Nightly workflows shift expensive suites off the PR critical path
#   - Release workflows emit dependency + provenance artifacts
#   - Least-privilege permissions per job; no global elevation
#   - Third-party actions pinned to immutable references where feasible
# =============================================================================

name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  merge_group:

permissions:
  contents: read
  # The required-lane gitleaks job runs in PR scan-mode, which reads the PR commit context. (#1132 review)
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-governance:
    name: Docs Governance
    uses: ./.github/workflows/reusable-docs-governance.yml
    with:
      node-version: 24.13.1

  # A live release dispatch cannot be rehearsed on a PR, so the release-desktop
  # dispatch hardening (#1795) is held by an executable contract instead: the tag
  # grammar gate is run for real against injection-shaped inputs, and the
  # workflow's provenance/credential invariants are asserted structurally.
  # Inline (not a reusable call) — it needs nothing beyond the top-level
  # `contents: read`, and a reusable callee may not declare more than its caller
  # grants (GitHub fails such a call at plan time with startup_failure).
  release-workflow-contract:
    name: Release Workflow Contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.13.1

      - name: Validate release-desktop dispatch hardening contract
        run: node --test scripts/ci/release-desktop-dispatch.test.mjs

  backend-architecture:
    name: Backend Architecture
    uses: ./.github/workflows/reusable-backend-architecture.yml
    with:
      dotnet-version: 8.0.x

  backend-unit:
    name: Backend Unit
    uses: ./.github/workflows/reusable-backend-unit.yml
    with:
      dotnet-version: 8.0.x

  api-integration:
    name: API Integration
    uses: ./.github/workflows/reusable-api-integration.yml
    with:
      dotnet-version: 8.0.x

  migration-validation:
    name: Migration Validation
    uses: ./.github/workflows/reusable-migration-validation.yml
    with:
      dotnet-version: 8.0.x

  frontend-unit:
    name: Frontend Unit
    uses: ./.github/workflows/reusable-frontend-unit.yml
    with:
      node-version: 24.13.1

  paper-color-audit:
    name: Paper Color Audit
    uses: ./.github/workflows/reusable-paper-color-audit.yml

  container-images:
    name: Container Images
    uses: ./.github/workflows/reusable-container-images.yml

  # ── Security gate (#1132): secret/dependency/SAST scans in the required PR lane ──
  # Previously these ran only in label-gated ci-extended / nightly / release lanes, so a PR
  # introducing a hardcoded secret was not blocked and dependency/SAST signals were invisible
  # on the PR critical path. They now run on every PR here.
  #
  # PHASED ENFORCEMENT (ADR-0035): hard-blocking is rolled out only where the baseline is clean:
  #   - secret-scan  : ENFORCING — PR-diff scoped (gitleaks pr mode), so pre-existing fixtures
  #                    don't trip it; it blocks only newly-introduced secrets.
  #   - bundle-size  : ENFORCING — inside the Frontend Unit job (current bundle 994 KB < 1200 KB).
  #   - dependency   : advisory (enforce-findings: false). The pre-existing Critical transitive
  #                    (NuGet.CommandLine via Microsoft.Recognizers.Text) was eliminated by #1215
  #                    (the Recognizers packages were removed as dead code); re-evaluate flipping
  #                    to enforcing now that that baseline advisory is gone. Tracked: #1175, #1174.
  #   - SAST         : advisory (enforce-findings: false) — Semgrep now scans (setuptools<81 crash
  #                    fix) and surfaces a pre-existing finding baseline to triage first. Tracked: #1175.
  #
  # BREAK-GLASS (when enforcing): secrets → .gitleaks.toml / .gitleaksignore; SAST → .semgrepignore
  # / inline `# nosemgrep`; dependency → remediate or temporarily flip enforce-findings here (a
  # one-line, reviewable, tracked change). Durable per-advisory dependency allowlist: #1174.
  secret-scan:
    name: Secret Scan
    # gitleaks PR mode is only valid on pull_request events; guard so push / merge_group
    # (which the gitleaks-action v3 rejects with exit 1) do not fail the required lane / merge queue.
    if: ${{ github.event_name == 'pull_request' }}
    uses: ./.github/workflows/reusable-gitleaks.yml
    with:
      scan-mode: pr
      fail-on-findings: true

  dependency-security:
    name: Dependency Security
    uses: ./.github/workflows/reusable-dependency-security-signals.yml
    with:
      dotnet-version: 8.0.x
      node-version: 24.13.1
      frontend-audit-level: high
      # When flipped to enforcing, block on SHIPPED (production) deps only — frontend dev-tooling
      # vulnerabilities do not reach users and stay visible (non-blocking) in the nightly lane.
      frontend-omit-dev: true
      # Advisory until the pre-existing baseline is remediated (#1175). Flip to true to enforce.
      enforce-findings: false
      workflow-context: ci-required

  sast-scan:
    name: SAST Scan
    uses: ./.github/workflows/reusable-sast-scanning.yml
    with:
      node-version: 24.13.1
      # Advisory until the pre-existing Semgrep baseline is triaged (#1175). Flip to true to enforce.
      enforce-findings: false
      workflow-context: ci-required

  e2e-smoke:
    name: E2E Smoke
    needs:
      - docs-governance
      - backend-architecture
      - backend-unit
      - api-integration
      - migration-validation
      - frontend-unit
    uses: ./.github/workflows/reusable-e2e-smoke.yml
    with:
      dotnet-version: 8.0.x
      node-version: 24.13.1
