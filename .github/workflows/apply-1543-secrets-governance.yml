name: Apply issue 1543 secrets governance

on:
  push:
    branches:
      - test/1543-secrets-evidence-verdict

permissions:
  contents: write

concurrency:
  group: apply-1543-secrets-governance
  cancel-in-progress: true

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: test/1543-secrets-evidence-verdict
          fetch-depth: 0

      - name: Patch required docs governance contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64

          replacements = [('ZXhwb3J0IGNvbnN0IENJX1BPTElDWV9QQVRIID0gJ2NpL3BvbGljeS52MS5qc29uJwpleHBvcnQgY29uc3QgQ0lfQ09OVFJPTF9SVUxFX1BBVEggPSAnLmNsYXVkZS9ydWxlcy9jaS1jb250cm9sLm1kJwo=', ''), ('ZnVuY3Rpb24gZXhwZWN0Q29udGFpbnMoc291cmNlLCB0b2tlbiwgbGFiZWwpIHsKICBpZiAoIXNvdXJjZS5pbmNsdWRlcyh0b2tlbikpIHsKICAgIGVycm9ycy5wdXNoKGAke2xhYmVsfSBpcyBtaXNzaW5nIHJlcXVpcmVkIHRva2VuOiAke3Rva2VufWApCiAgfQp9Cg==', ''), ('YXN5bmMgZnVuY3Rpb24gbWFpbigpIHsK', ''), ('ICBhd2FpdCB2YWxpZGF0ZUNvbnRyb2xQYXRoTWlycm9yKCkKCiAgaWYgKGVycm9ycy5sZW5ndGggPiAwKSB7Cg==', 'ICBhd2FpdCB2YWxpZGF0ZUNvbnRyb2xQYXRoTWlycm9yKCkKICBhd2FpdCB2YWxpZGF0ZVByZU1lcmdlU2VjcmV0c1NraWxsKCkKCiAgaWYgKGVycm9ycy5sZW5ndGggPiAwKSB7Cg==')]
          validator_path = Path('scripts/check-docs-governance.mjs')
          validator = validator_path.read_text(encoding='utf-8')
          for old64, new64 in replacements:
              old=base64.b64decode(old64).decode()
              new=base64.b64decode(new64).decode()
              count=validator.count(old)
              if count != 1: raise SystemExit(f'expected one validator anchor, found {count}')
              validator=validator.replace(old,new,1)
          validator_path.write_text(validator, encoding='utf-8')

          old=base64.b64decode('ICBDSV9DT05UUk9MX1JVTEVfUEFUSCwKICBDSV9QT0xJQ1lfUEFUSCwKICBjb2xsZWN0Q29udHJvbFBhdGhNaXJyb3JFcnJvcnMsCg==').decode()
          new=base64.b64decode('ICBDSV9DT05UUk9MX1JVTEVfUEFUSCwKICBDSV9QT0xJQ1lfUEFUSCwKICBQUkVfTUVSR0VfR0FURV9TS0lMTF9QQVRILAogIFBSRV9NRVJHRV9TRUNSRVRfQ0hFQ0tfTkFNRSwKICBQUkVfTUVSR0VfU0VDUkVUU19IRUxQRVJfUEFUSCwKICBjb2xsZWN0Q29udHJvbFBhdGhNaXJyb3JFcnJvcnMsCiAgY29sbGVjdFByZU1lcmdlU2VjcmV0c1NraWxsRXJyb3JzLAo=').decode()
          addition=base64.b64decode('').decode()
          test_path=Path('scripts/check-docs-governance.test.mjs')
          tests=test_path.read_text(encoding='utf-8')
          count=tests.count(old)
          if count != 1: raise SystemExit(f'expected one test import anchor, found {count}')
          tests=tests.replace(old,new,1)
          if 'rejects an unconditional pre-merge secrets CLEAN template' in tests: raise SystemExit('tests already patched')
          test_path.write_text(tests.rstrip()+addition+'\n',encoding='utf-8')

          workflow=Path('.github/workflows/apply-1543-secrets-governance.yml')
          if workflow.exists(): workflow.unlink()
          PY

      - name: Verify focused governance regressions
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/github/check-pre-merge-secrets-evidence.mjs
          node --check scripts/check-docs-governance.pre-merge-secrets.test.mjs
          node --test scripts/check-docs-governance.pre-merge-secrets.test.mjs
          node --test scripts/check-docs-governance.test.mjs
          node scripts/check-docs-governance.mjs
          git diff --check

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/check-docs-governance.mjs \
            scripts/check-docs-governance.test.mjs \
            .github/workflows/apply-1543-secrets-governance.yml
          git commit -m 'test: enforce exact-head secrets evidence governance'
          git push origin 'HEAD:test/1543-secrets-evidence-verdict'
