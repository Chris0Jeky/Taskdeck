# =============================================================================
# Mutation Testing — manual-dispatch lane for mutation score tracking.
# NOT a PR gate. Runs on manual dispatch only (weekly schedule removed 2026-08-19,
# ADR-0052). Reports uploaded as artifacts for triage, not enforcement.
# =============================================================================

name: Mutation Testing

on:
  # Schedule removed 2026-08-19 (ARCHIVE-07 / #1275, ADR-0052 CI estate right-sizing):
  # the mutation score is a non-blocking calibration signal, not a merge gate, and the
  # backend lane carries a 180-minute ceiling. Run it on demand via workflow_dispatch
  # instead of on a weekly cron. The #1500 repair (pinned Stryker.NET 4.16.0 + preflight)
  # remains intact and provable on manual dispatch.
  workflow_dispatch:
    inputs:
      backend_only:
        description: 'Run backend mutation testing only'
        required: false
        type: boolean
        default: false
      frontend_only:
        description: 'Run frontend mutation testing only'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-mutation:
    name: Backend Mutation (Stryker.NET)
    if: ${{ !inputs.frontend_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restore Stryker.NET tool
        run: dotnet tool restore

      - name: Validate Stryker.NET configuration
        shell: pwsh
        run: ./scripts/ci/Test-StrykerConfig.ps1 -SelfTest

      - name: Restore solution
        run: dotnet restore backend/Taskdeck.sln

      - name: Run Stryker.NET
        working-directory: backend/tests/Taskdeck.Domain.Tests
        run: dotnet tool run dotnet-stryker -- --config-file ../../stryker-config.json --output ../../StrykerOutput

      - name: Upload Stryker report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stryker-net-report
          path: backend/StrykerOutput/**/reports/
          if-no-files-found: error
          retention-days: 30

  frontend-mutation:
    name: Frontend Mutation (Stryker JS)
    if: ${{ !inputs.backend_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.13.1
          cache: npm
          cache-dependency-path: frontend/taskdeck-web/package-lock.json

      - name: Install dependencies
        working-directory: frontend/taskdeck-web
        run: npm ci

      - name: Run Stryker
        working-directory: frontend/taskdeck-web
        run: npx stryker run

      - name: Upload Stryker report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stryker-js-report
          path: frontend/taskdeck-web/reports/
          retention-days: 30

  summary:
    name: Mutation Testing Summary
    if: always()
    needs: [backend-mutation, frontend-mutation]
    runs-on: ubuntu-latest
    steps:
      - name: Report status
        env:
          BACKEND_RESULT: ${{ needs.backend-mutation.result || 'skipped' }}
          FRONTEND_RESULT: ${{ needs.frontend-mutation.result || 'skipped' }}
        run: |
          {
            echo "## Mutation Testing Results"
            echo ""
            echo "| Lane | Status |"
            echo "|------|--------|"
            echo "| Backend (Stryker.NET) | ${BACKEND_RESULT} |"
            echo "| Frontend (Stryker JS) | ${FRONTEND_RESULT} |"
            echo ""
            echo "Download HTML/JSON reports from the **Artifacts** section above."
            echo ""
            echo "See [Mutation Testing Policy](docs/testing/MUTATION_TESTING_POLICY.md) for threshold strategy and triage guidance."
          } >> "$GITHUB_STEP_SUMMARY"
