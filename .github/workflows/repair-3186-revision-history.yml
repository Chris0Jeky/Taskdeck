name: Repair PR 3186 revision-history applicator

on:
  push:
    branches:
      - fix/2579-revision-history-residuals

permissions:
  contents: write

concurrency:
  group: repair-3186-revision-history-${{ github.ref }}
  cancel-in-progress: true

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact triggering head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify exact triggering head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.13.1"
          cache: npm
          cache-dependency-path: frontend/taskdeck-web/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend/taskdeck-web
        run: npm ci

      - name: Prove the residual regressions are red
        working-directory: frontend/taskdeck-web
        shell: bash
        run: |
          set +e
          npx vitest run src/tests/composables/useProposalRevisionsResiduals.spec.ts > /tmp/issue-2579-red.log 2>&1
          status=$?
          set -e
          cat /tmp/issue-2579-red.log
          if [ "$status" -eq 0 ]; then
            echo 'Expected the #2579 residual contract to fail before implementation.' >&2
            exit 1
          fi
          grep -Eq 'keeps metadata unknown|does not show a failed-history toast|evicts the least-recently-used' /tmp/issue-2579-red.log

      - name: Apply the reviewed bounded authority patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          workflow_path = Path('.github/workflows/apply-3186-revision-history.yml')
          workflow_text = workflow_path.read_text(encoding='utf-8').replace('\r\n', '\n')
          start_marker = "          python3 <<'PY'\n"
          end_marker = "          PY\n"
          start = workflow_text.find(start_marker)
          if start < 0:
              raise SystemExit('legacy applicator Python start marker was not found')
          start += len(start_marker)
          end = workflow_text.find(end_marker, start)
          if end < 0:
              raise SystemExit('legacy applicator Python end marker was not found')

          encoded_lines = workflow_text[start:end].splitlines()
          if any(line and not line.startswith('          ') for line in encoded_lines):
              raise SystemExit('legacy applicator Python block has unexpected indentation')
          patch_source = '\n'.join(line[10:] if line else '' for line in encoded_lines) + '\n'
          exec(compile(patch_source, str(workflow_path), 'exec'), {})

          for path in (
              Path('.github/workflows/apply-3186-revision-history.yml'),
              Path('.github/workflows/repair-3186-revision-history.yml'),
          ):
              if not path.exists():
                  raise SystemExit(f'expected applicator path is missing: {path}')
              path.unlink()
          PY

      - name: Verify focused and existing revision state machines
        working-directory: frontend/taskdeck-web
        shell: bash
        run: |
          set -euo pipefail
          npx vitest run src/tests/composables/useProposalRevisionsResiduals.spec.ts src/tests/composables/useProposalRevisions.spec.ts
          npm run typecheck
          git -C ../.. diff --check

      - name: Publish one exact-parent implementation commit
        shell: bash
        run: |
          set -euo pipefail
          branch='fix/2579-revision-history-residuals'
          trigger_head="$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$trigger_head"

          remote_head="$(git ls-remote --heads origin "refs/heads/$branch" | awk '{print $1}')"
          test -n "$remote_head"
          test "$remote_head" = "$trigger_head"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/taskdeck-web/src/composables/useProposalRevisions.ts \
            frontend/taskdeck-web/src/tests/composables/useProposalRevisionsResiduals.spec.ts \
            .github/workflows/apply-3186-revision-history.yml \
            .github/workflows/repair-3186-revision-history.yml

          expected_names=$'.github/workflows/apply-3186-revision-history.yml\n.github/workflows/repair-3186-revision-history.yml\nfrontend/taskdeck-web/src/composables/useProposalRevisions.ts\nfrontend/taskdeck-web/src/tests/composables/useProposalRevisionsResiduals.spec.ts'
          actual_names="$(git diff --cached --name-only | sort)"
          test "$actual_names" = "$expected_names"

          tree="$(git write-tree)"
          implementation_commit="$(printf '%s\n' 'fix(review): harden revision history authority' | git commit-tree "$tree" -p "$trigger_head")"
          test "$(git rev-parse "$implementation_commit^")" = "$trigger_head"
          git push --force-with-lease="refs/heads/$branch:$trigger_head" origin "$implementation_commit:refs/heads/$branch"
