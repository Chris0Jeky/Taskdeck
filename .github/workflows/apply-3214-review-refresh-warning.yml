name: Apply 3214 review refresh warning

on:
  push:
    branches:
      - fix/3023-archive-refresh-comment-cache
    paths:
      - .github/workflows/apply-3214-review-refresh-warning.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/3023-archive-refresh-comment-cache
          fetch-depth: 0

      - name: Apply guarded review-contract patch
        run: python3 scripts/ci/apply-3214-review-refresh-warning.py

      - name: Commit review fix contracts
        shell: bash
        run: |
          git rm scripts/ci/apply-3214-review-refresh-warning.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/taskdeck-web/src/tests/components/CardModal.spec.ts
          git commit -m "test(frontend): pin archive refresh failure disclosure"
          git push origin HEAD:fix/3023-archive-refresh-comment-cache
