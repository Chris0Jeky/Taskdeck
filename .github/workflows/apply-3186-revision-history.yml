name: Apply PR 3186 revision-history hardening

'on':
  push:
    branches:
      - fix/2579-revision-history-residuals
    paths:
      - .github/workflows/apply-3186-revision-history.yml

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.repository == 'Chris0Jeky/Taskdeck' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/2579-revision-history-residuals
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.13.1
          cache: npm
          cache-dependency-path: frontend/taskdeck-web/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend/taskdeck-web
        run: npm ci

      - name: Prove the residual regressions are red
        working-directory: frontend/taskdeck-web
        shell: bash
        run: |
          set -euo pipefail
          if npx vitest run src/tests/composables/useProposalRevisionsResiduals.spec.ts; then
            echo 'Expected the #2579 residual contract to fail before implementation.' >&2
            exit 1
          fi

      - name: Apply bounded authority-aware history state
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path('frontend/taskdeck-web/src/composables/useProposalRevisions.ts')
          text = path.read_text(encoding='utf-8').replace('\r\n', '\n')

          def replace_once(pattern: str, replacement: str, label: str, *, regex: bool = False) -> None:
              global text
              if regex:
                  text, count = re.subn(pattern, replacement, text, count=1, flags=re.DOTALL)
              else:
                  count = text.count(pattern)
                  if count == 1:
                      text = text.replace(pattern, replacement)
              if count != 1:
                  raise RuntimeError(f'{label}: expected one match, found {count}')

          replace_once(
              """type RevisionHistory = {
            revisions: Map<number, ProposalRevision>
            loaded: boolean
            invalid: boolean
          }""",
              """const REVISION_HISTORY_LIMIT = 64

          type RevisionHistory = {
            revisions: Map<number, ProposalRevision>
            loaded: boolean
            invalid: boolean
            disputedRevisionNumbers: Set<number>
          }""",
              'history type',
          )

          replace_once(
              """  let loadGeneration = 0
            let saveGeneration = 0
""",
              """  let loadGeneration = 0
            let saveGeneration = 0
            let saveMetadataGeneration = 0
""",
              'save metadata generation',
          )

          replace_once(
              r"  const revisionHistoryByProposal = new Map<string, RevisionHistory>\(\)\n\n  function getRevisionHistory\(proposalId: string\): RevisionHistory \{.*?\n  \}\n\n  function isUsableRevision",
              """  const revisionHistoryByProposal = new Map<string, RevisionHistory>()

            function touchRevisionHistory(proposalId: string, history: RevisionHistory) {
              revisionHistoryByProposal.delete(proposalId)
              revisionHistoryByProposal.set(proposalId, history)
              while (revisionHistoryByProposal.size > REVISION_HISTORY_LIMIT) {
                const oldestProposalId = revisionHistoryByProposal.keys().next().value
                if (oldestProposalId === undefined) break
                revisionHistoryByProposal.delete(oldestProposalId)
              }
            }

            function getRevisionHistory(proposalId: string): RevisionHistory {
              const existing = revisionHistoryByProposal.get(proposalId)
              if (existing) {
                touchRevisionHistory(proposalId, existing)
                return existing
              }
              const created: RevisionHistory = {
                revisions: new Map(),
                loaded: false,
                invalid: false,
                disputedRevisionNumbers: new Set(),
              }
              touchRevisionHistory(proposalId, created)
              return created
            }

            function isUsableRevision""",
              'bounded history cache',
              regex=True,
          )

          replace_once(
              r"  function mergeRevision\(.*?\n  \}\n\n  /\*\*",
              """  function recordRevisionInconsistency(
              history: RevisionHistory,
              revision: ProposalRevision,
            ) {
              history.invalid = true
              if (Number.isInteger(revision.revisionNumber) && revision.revisionNumber >= 1) {
                history.disputedRevisionNumbers.add(revision.revisionNumber)
              }
            }

            function mergeRevision(
              history: RevisionHistory,
              proposalId: string,
              revision: ProposalRevision,
            ) {
              if (!isUsableRevision(revision, proposalId)) {
                recordRevisionInconsistency(history, revision)
                return
              }

              const existing = history.revisions.get(revision.revisionNumber)
              if (existing && existing.id !== revision.id) {
                recordRevisionInconsistency(history, revision)
                return
              }
              history.revisions.set(revision.revisionNumber, revision)
            }

            /**""",
              'revision inconsistency helper',
              regex=True,
          )

          replace_once(
              r"  function mergeLoadedRevisions\(proposalId: string, revisions: ProposalRevision\[\]\) \{.*?\n  \}\n\n  function rememberPersistedRevision",
              """  function mergeLoadedRevisions(proposalId: string, revisions: ProposalRevision[]) {
              const history = getRevisionHistory(proposalId)
              const loaded = new Map<number, ProposalRevision>()
              let highestLoaded = 0
              for (const revision of revisions) {
                if (!isUsableRevision(revision, proposalId)) {
                  recordRevisionInconsistency(history, revision)
                  history.loaded = true
                  return
                }
                const conflicting = loaded.get(revision.revisionNumber)
                if (conflicting && conflicting.id !== revision.id) {
                  recordRevisionInconsistency(history, revision)
                  history.loaded = true
                  return
                }
                loaded.set(revision.revisionNumber, revision)
                if (revision.revisionNumber > highestLoaded) highestLoaded = revision.revisionNumber
              }

              const isCompleteResponse = loaded.size === highestLoaded
              const coversEveryDisputedNumber = [...history.disputedRevisionNumbers].every(
                (revisionNumber) => loaded.has(revisionNumber),
              )
              if (isCompleteResponse && coversEveryDisputedNumber) {
                history.invalid = false
                history.disputedRevisionNumbers.clear()
              }
              for (const [revisionNumber, revision] of loaded) {
                history.revisions.set(revisionNumber, revision)
              }
              history.loaded = true
            }

            function rememberPersistedRevision""",
              'loaded revision authority gate',
              regex=True,
          )

          replace_once(
              """    const history = revisionHistoryByProposal.get(proposalId)
              if (!history || history.invalid) return null

              const revisionNumbers = [...history.revisions.keys()].sort((a, b) => a - b)
""",
              """    const history = revisionHistoryByProposal.get(proposalId)
              if (!history || history.invalid) return null
              touchRevisionHistory(proposalId, history)

              const revisionNumbers = [...history.revisions.keys()].sort((a, b) => a - b)
""",
              'history read touch',
          )

          replace_once(
              r"  function publishPersistedRevisionMetadata\(proposalId: string\): boolean \{.*?\n  \}\n\n  /\*\*",
              """  function publishPersistedRevisionMetadata(proposalId: string): boolean {
              if (activeProposal.value?.id !== proposalId) return false
              const metadata = getCompleteRevisionMetadata(proposalId)
              if (!metadata) {
                revisionCount.value = 0
                latestRevision.value = null
                revisionsLoaded.value = false
                return false
              }
              revisionCount.value = metadata.count
              latestRevision.value = metadata.latest
              revisionsLoaded.value = true
              saveMetadataGeneration += 1
              return true
            }

            /**""",
              'published-save metadata generation',
              regex=True,
          )

          replace_once(
              r"  async function loadRevisionState\(proposalId: string, options\?: \{ silent\?: boolean \}\) \{.*?\n  \}\n\n  // Keyed on the proposal",
              """  async function loadRevisionState(proposalId: string, options?: { silent?: boolean }) {
              const gen = ++loadGeneration
              const saveMetadataGenerationAtStart = saveMetadataGeneration
              try {
                const revisions = await proposalRevisionsApi.getRevisions(proposalId)
                if (gen !== loadGeneration || activeProposal.value?.id !== proposalId) return
                mergeLoadedRevisions(proposalId, revisions)
                const metadata = getCompleteRevisionMetadata(proposalId)
                if (!metadata) {
                  revisionCount.value = 0
                  latestRevision.value = null
                  revisionsLoaded.value = false
                  return
                }
                revisionCount.value = metadata.count
                latestRevision.value = metadata.latest
                revisionsLoaded.value = true
              } catch (e: unknown) {
                if (gen !== loadGeneration || activeProposal.value?.id !== proposalId) return
                // A failed read stays actionable unless this exact request was
                // overtaken by a successful save that already published complete
                // metadata. In that one case the failure is stale noise, not a
                // reason to make the reviewer distrust the proven save.
                const savePublishedMetadataWhileLoading =
                  saveMetadataGeneration > saveMetadataGenerationAtStart && revisionsLoaded.value
                if (!revisionsLoaded.value) {
                  revisionCount.value = 0
                  latestRevision.value = null
                }
                if (!options?.silent && !savePublishedMetadataWhileLoading) {
                  toast.error(getErrorDisplay(e, 'Failed to load revision history').message)
                }
              }
            }

            // Keyed on the proposal""",
              'request-scoped stale load handling',
              regex=True,
          )

          for fragment in [
              'const REVISION_HISTORY_LIMIT = 64',
              'disputedRevisionNumbers: Set<number>',
              'let saveMetadataGeneration = 0',
              'const coversEveryDisputedNumber',
              'const savePublishedMetadataWhileLoading',
          ]:
              if fragment not in text:
                  raise RuntimeError(f'Missing post-patch fragment: {fragment}')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify focused revision state machine
        working-directory: frontend/taskdeck-web
        shell: bash
        run: |
          set -euo pipefail
          npx vitest run src/tests/composables/useProposalRevisionsResiduals.spec.ts src/tests/composables/useProposalRevisions.spec.ts
          npm run type-check

      - name: Publish implementation
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/apply-3186-revision-history.yml
          git add frontend/taskdeck-web/src/composables/useProposalRevisions.ts
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(review): harden revision history authority"
          git push origin HEAD:fix/2579-revision-history-residuals
