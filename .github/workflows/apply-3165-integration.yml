name: Apply issue 3165 integration

on:
  push:
    branches:
      - fix/3165-dev-up-teardown-budget

permissions:
  contents: write

concurrency:
  group: apply-3165-integration
  cancel-in-progress: true

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/3165-dev-up-teardown-budget
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.2.0
        with:
          node-version: 24.13.1

      - name: Verify cleanup helper regressions
        run: node --test scripts/ci/dev-up-fixture-cleanup.test.mjs

      - name: Integrate cleanup helper into launcher fixtures
        run: python scripts/ci/apply-3165.py

      - name: Verify integrated helper paths
        run: |
          node --test scripts/ci/dev-up-fixture-cleanup.test.mjs
          node --test --test-timeout=30000 --test-name-pattern='^(launchers encode|Node helper:)' scripts/ci/dev-up.test.mjs

      - name: Verify diff hygiene
        run: |
          git diff --check
          test "$(git diff --name-only | tr -d '\r')" = "scripts/ci/dev-up.test.mjs"

      - name: Commit integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/ci/dev-up.test.mjs
          git commit -m 'fix(ci): bound dev-up fixture teardown'
          git push origin 'HEAD:fix/3165-dev-up-teardown-budget'
