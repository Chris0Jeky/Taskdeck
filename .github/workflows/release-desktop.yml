# =============================================================================
# Release Desktop — cross-platform self-contained executable builds
# =============================================================================
#
# Triggers on version tags (v*). Builds self-contained single-file executables
# for win-x64, linux-x64, osx-x64, osx-arm64 and publishes them as a GitHub
# Release with SHA256 checksums and auto-generated release notes.
#
# Tracked by: #535 (PKG-03)
# =============================================================================

name: Release Desktop

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to build and PUBLISH (e.g. v0.2.0). Leave BLANK when dispatching from a BRANCH for a rehearsal: builds, smoke-tests the runner-native platforms, uploads artifacts, publishes nothing. Dispatching from a TAG ref publishes that tag even with this left blank."
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
  DOTNET_VERSION: "8.0.x"
  NODE_VERSION: "24.13.1"
  PUBLISH_PROJECT: backend/src/Taskdeck.Api/Taskdeck.Api.csproj

jobs:
  # ---------------------------------------------------------------------------
  # Build frontend assets (shared by all platform builds)
  # ---------------------------------------------------------------------------
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/taskdeck-web/package-lock.json

      - name: Install dependencies
        working-directory: frontend/taskdeck-web
        run: npm ci

      - name: Build production bundle
        working-directory: frontend/taskdeck-web
        run: npx vite build

      - name: Upload frontend dist
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/taskdeck-web/dist/
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Build self-contained executables per platform
  # ---------------------------------------------------------------------------
  build-backend:
    name: Build ${{ matrix.rid }}
    needs: build-frontend
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
            archive_ext: zip
          - rid: linux-x64
            os: ubuntu-latest
            archive_ext: tar.gz
          - rid: osx-x64
            os: macos-latest
            archive_ext: tar.gz
          - rid: osx-arm64
            os: macos-latest
            archive_ext: tar.gz
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: true
          cache-dependency-path: |
            backend/Taskdeck.sln
            backend/Directory.Packages.props
            backend/**/*.csproj

      - name: Download frontend dist
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: frontend-dist

      - name: Restore backend
        run: dotnet restore backend/Taskdeck.sln -r ${{ matrix.rid }}

      - name: Publish self-contained executable
        run: >
          dotnet publish ${{ env.PUBLISH_PROJECT }}
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:PublishTrimmed=false
          -o publish/${{ matrix.rid }}
          --no-restore

      - name: Copy frontend dist into publish output
        shell: bash
        run: |
          mkdir -p publish/${{ matrix.rid }}/wwwroot
          cp -r frontend-dist/* publish/${{ matrix.rid }}/wwwroot/

      - name: Verify frontend assets present
        shell: bash
        run: |
          if [ ! -f "publish/${{ matrix.rid }}/wwwroot/index.html" ]; then
            echo "::error::Frontend dist missing index.html — build may have failed silently"
            exit 1
          fi
          echo "Frontend assets verified ($(find publish/${{ matrix.rid }}/wwwroot -type f | wc -l) files)"

      # -----------------------------------------------------------------------
      # Post-publish smoke test (#1123 AC2)
      #
      # Proves the just-published self-contained executable actually boots and
      # serves the product before we archive and ship it:
      #   1. GET /health/ready returns success  -> EF migrations applied, DB
      #      reachable, workers heartbeating (PipelineConfiguration runs the
      #      SerializedMigrator at startup; HealthController.ReadyCheck gates on
      #      DB + queue + workers).
      #   2. GET /                returns the SPA index.html -> same-origin
      #      wwwroot serving works (UseDefaultFiles + UseStaticFiles).
      # The process is always killed (trap ... EXIT) so it never leaks, and any
      # failure (no boot, never ready, / not HTML) fails the release job.
      #
      # Runner-native RIDs only: the GitHub macos-latest runner is arm64, so the
      # osx-x64 binary is cross-arch and may not launch there. It is SKIPPED via
      # the `if:` gate below; osx-arm64 is the macOS RID exercised instead.
      # win-x64 (windows-latest) and linux-x64 (ubuntu-latest) are native.
      #
      # shell: bash so one script covers Windows + Linux + macOS (bash ships on
      # the Windows runner). curl + Node + SHA-256 tooling are available on all three runners.
      #
      # This is deliberately a zero-secret/config desktop launch. GitHub's ambient
      # headless markers are removed for the child process, and LOCALAPPDATA/HOME/
      # XDG_DATA_HOME are isolated. The first launch creates durable config + DB;
      # the publish output is then relocated and relaunched against the same app-data
      # root. Stable config digest + DB path prove continuity across the move, while
      # both executable directories initially remain free of appsettings.local.json.
      # A final phase stages that same config as a legacy executable-local source,
      # removes only the isolated durable copy, and proves migration preserves its
      # exact bytes, connector key, DB path, and retained source.
      - name: Smoke test published executable
        if: matrix.rid != 'osx-x64'  # cross-arch on the arm64 macOS runner — not launchable there
        shell: bash
        run: |
          set -euo pipefail

          PORT=5099
          URL="http://127.0.0.1:${PORT}"

          canonicalize_db_path() {
            local raw_path="$1"
            local resolved
            resolved="$(node -e 'process.stdout.write(require("path").resolve(process.argv[1]));' "$raw_path")"
            if [ "${RUNNER_OS}" = "Windows" ]; then
              cygpath -u -a "$resolved"
            else
              printf '%s' "$resolved"
            fi
          }

          assert_sqlite_database() {
            local db_path="$1"
            local phase="$2"
            case "$db_path" in
              "${SMOKE_PROFILE_DIR}"/*) ;;
              *)
                echo "::error::${phase} database resolved outside the isolated smoke profile: ${db_path}"
                exit 1
                ;;
            esac
            if [ ! -s "$db_path" ]; then
              echo "::error::${phase} database is missing or empty: ${db_path}"
              exit 1
            fi
            local sqlite_header
            sqlite_header="$(od -An -tx1 -N16 "$db_path" | tr -d '[:space:]')"
            if [ "$sqlite_header" != "53514c69746520666f726d6174203300" ]; then
              echo "::error::${phase} database does not have a SQLite 3 header: ${db_path}"
              exit 1
            fi
          }

          assert_publish_dirs_clean() {
            local publish_dir
            local stray
            for publish_dir in "$@"; do
              stray="$(find "$publish_dir" -type f -name 'taskdeck.db*' -print)"
              if [ -n "$stray" ]; then
                echo "::error::Published executable directory contains database files: ${publish_dir}"
                printf '%s\n' "$stray"
                exit 1
              fi
            done
          }

          PUBLISH_DIR="$(canonicalize_db_path "$(pwd)/publish/${{ matrix.rid }}")"

          # The published assembly name is Taskdeck.Api (no AssemblyName override);
          # the apphost gets a .exe suffix on Windows only.
          if [ "${RUNNER_OS}" = "Windows" ]; then
            EXE="${PUBLISH_DIR}/Taskdeck.Api.exe"
          else
            EXE="${PUBLISH_DIR}/Taskdeck.Api"
          fi

          if [ ! -f "$EXE" ]; then
            echo "::error::Published executable not found at $EXE"
            ls -la "$PUBLISH_DIR" || true
            exit 1
          fi
          chmod +x "$EXE" 2>/dev/null || true

          # Isolated app-data/profile roots. The launched process has GitHub's CI
          # markers removed, so Production follows the real desktop policy.
          SMOKE_DATA_DIR="$(mktemp -d 2>/dev/null || mktemp -d -t taskdeck-smoke)"
          mkdir -p "${SMOKE_DATA_DIR}/profile/localappdata" "${SMOKE_DATA_DIR}/profile/home" "${SMOKE_DATA_DIR}/profile/xdg-data"
          SMOKE_PROFILE_DIR="$(canonicalize_db_path "${SMOKE_DATA_DIR}/profile")"
          if [ "${RUNNER_OS}" = "Windows" ]; then
            APP_LOCALAPPDATA="$(cygpath -w "${SMOKE_PROFILE_DIR}/localappdata")"
            APP_HOME="$(cygpath -w "${SMOKE_PROFILE_DIR}/home")"
            APP_XDG_DATA_HOME="$(cygpath -w "${SMOKE_PROFILE_DIR}/xdg-data")"
          else
            APP_LOCALAPPDATA="${SMOKE_PROFILE_DIR}/localappdata"
            APP_HOME="${SMOKE_PROFILE_DIR}/home"
            APP_XDG_DATA_HOME="${SMOKE_PROFILE_DIR}/xdg-data"
          fi

          APP_PID=""
          wait_for_app_exit() {
            local pid="$1"
            for _ in {1..40}; do
              if [ "${RUNNER_OS}" = "Windows" ]; then
                if ! tasklist //FI "IMAGENAME eq Taskdeck.Api.exe" //NH 2>/dev/null \
                    | grep -qi 'Taskdeck.Api.exe'; then
                  return 0
                fi
              elif ! kill -0 "${pid}" 2>/dev/null; then
                return 0
              fi
              sleep 0.25
            done
            return 1
          }

          stop_app() {
            if [ -z "${APP_PID}" ]; then
              return 0
            fi

            local pid="${APP_PID}"
            kill "${pid}" 2>/dev/null || true
            if [ "${RUNNER_OS}" = "Windows" ]; then
              # MSYS->Win32 PID mapping can miss; request termination by apphost name too.
              taskkill //IM Taskdeck.Api.exe 2>/dev/null || true
            fi

            if ! wait_for_app_exit "${pid}"; then
              if [ "${RUNNER_OS}" = "Windows" ]; then
                taskkill //F //IM Taskdeck.Api.exe 2>/dev/null || true
              else
                kill -9 "${pid}" 2>/dev/null || true
              fi
              if ! wait_for_app_exit "${pid}"; then
                echo "::error::Taskdeck process ${pid} did not exit after forced termination"
                return 1
              fi
            fi

            # The bounded checks proved the process exited; this wait only reaps the completed child.
            wait "${pid}" 2>/dev/null || true
            APP_PID=""
          }
          cleanup() {
            stop_app
            rm -rf "${SMOKE_DATA_DIR}" 2>/dev/null || true
          }
          trap cleanup EXIT

          EXE_NAME="$(basename "$EXE")"
          LOG="${SMOKE_DATA_DIR}/app-first.log"
          echo "Launching ${EXE_NAME} (cwd=${PUBLISH_DIR}) on ${URL} with isolated app data"
          # Run with the publish dir as the working directory so ASP.NET Core resolves the
          # content root there and serves wwwroot/index.html + appsettings.json — exactly as
          # an end user runs the extracted exe (the content root defaults to the CWD, not the
          # exe folder). The DB + log use absolute temp paths, so the publish dir (archived in
          # the next step) stays clean. `exec` replaces the subshell with the apphost so $! is
          # the real process PID for a clean kill.
          (
            cd "$PUBLISH_DIR"
            exec env -u CI -u TF_BUILD -u GITHUB_ACTIONS -u TASKDECK_HEADLESS \
              ASPNETCORE_ENVIRONMENT="Production" \
              DOTNET_ENVIRONMENT="Production" \
              ASPNETCORE_URLS="${URL}" \
              LOCALAPPDATA="${APP_LOCALAPPDATA}" \
              HOME="${APP_HOME}" \
              XDG_DATA_HOME="${APP_XDG_DATA_HOME}" \
              FirstRun__AutoOpenBrowser="false" \
              "./${EXE_NAME}"
          ) > "$LOG" 2>&1 &
          APP_PID=$!
          echo "Started PID ${APP_PID}"

          # Poll /health/ready (DB migrated + reachable, workers heartbeating).
          # -f makes curl non-zero on any non-2xx (e.g. a 503 NotReady), so the
          # loop only breaks once the app reports fully Ready. Bounded to ~60s.
          READY=0
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null --max-time 5 "${URL}/health/ready"; then
              READY=1
              echo "health/ready returned success after ~${i}s"
              break
            fi
            # Fast-fail if the process already died (skip on Windows where the
            # MSYS->Win32 PID mapping makes kill -0 unreliable; fall through to
            # the timeout instead of a false negative).
            if [ "${RUNNER_OS}" != "Windows" ] && ! kill -0 "${APP_PID}" 2>/dev/null; then
              echo "::error::Taskdeck process exited before /health/ready became ready"
              echo "--- app log (tail) ---"; tail -n 60 "$LOG" || true
              exit 1
            fi
            sleep 1
          done

          if [ "${READY}" -ne 1 ]; then
            echo "::error::/health/ready did not return success within 60s"
            echo "--- app log (tail) ---"; tail -n 60 "$LOG" || true
            exit 1
          fi

          # GET / must serve the SPA shell (same-origin index.html from wwwroot, HTTP 200).
          ROOT_BODY="${SMOKE_DATA_DIR}/root.html"
          ROOT_CODE="$(curl -s -o "$ROOT_BODY" -w '%{http_code}' --max-time 10 "${URL}/" || echo 000)"
          if [ "$ROOT_CODE" = "200" ] && grep -qiE '<div id="app"|<!doctype html' "$ROOT_BODY"; then
            echo "GET / served the SPA index.html (HTTP 200) — smoke test passed for ${{ matrix.rid }}"
          else
            echo "::error::GET / did not serve the SPA index.html (HTTP ${ROOT_CODE})"
            # Diagnostics: separate "the SPA is not served at all" from "only the bare root / fails"
            # (e.g. the root path 401ing under the global auth fallback policy) so the failure is actionable.
            echo "  diag: GET /index.html      -> $(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "${URL}/index.html")"
            echo "  diag: GET /board (SPA nav) -> $(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "${URL}/board")"
            echo "--- first 500 chars of GET / body ---"; head -c 500 "$ROOT_BODY" 2>/dev/null || true; echo
            echo "--- app log (tail) ---"; tail -n 60 "$LOG" || true
            exit 1
          fi

          LOCAL_CONFIG_COUNT="$(find "$SMOKE_PROFILE_DIR" -type f -name appsettings.local.json | wc -l | tr -d '[:space:]')"
          if [ "$LOCAL_CONFIG_COUNT" -ne 1 ]; then
            echo "::error::Expected one durable appsettings.local.json under the isolated profile; found ${LOCAL_CONFIG_COUNT}"
            find "$SMOKE_PROFILE_DIR" -maxdepth 6 -type f -print || true
            tail -n 60 "$LOG" || true
            exit 1
          fi
          DURABLE_CONFIG="$(find "$SMOKE_PROFILE_DIR" -type f -name appsettings.local.json -print | head -n 1)"
          if command -v sha256sum >/dev/null 2>&1; then
            CONFIG_DIGEST_ONE="$(sha256sum "$DURABLE_CONFIG" | awk '{print $1}')"
          else
            CONFIG_DIGEST_ONE="$(shasum -a 256 "$DURABLE_CONFIG" | awk '{print $1}')"
          fi
          DB_PATH_ONE="$(node -e 'const fs=require("fs");const c=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));const s=c?.ConnectionStrings?.DefaultConnection??"";if(!s.startsWith("Data Source="))process.exit(2);process.stdout.write(s.slice("Data Source=".length));' "$DURABLE_CONFIG")"
          DB_PATH_ONE="$(canonicalize_db_path "$DB_PATH_ONE")"
          CONNECTOR_KEY_ONE="$(node -e 'const fs=require("fs");const c=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));const k=c?.Connectors?.EncryptionKey??"";if(!k)process.exit(2);process.stdout.write(k);' "$DURABLE_CONFIG")"
          echo "First launch durable config digest: ${CONFIG_DIGEST_ONE}"
          echo "First launch resolved DB path: ${DB_PATH_ONE}"
          assert_sqlite_database "$DB_PATH_ONE" "First launch"
          assert_publish_dirs_clean "$PUBLISH_DIR"
          if [ -e "${PUBLISH_DIR}/appsettings.local.json" ]; then
            echo "::error::First launch wrote executable-local appsettings.local.json"
            exit 1
          fi

          stop_app

          RELOCATED_DIR="${SMOKE_DATA_DIR}/relocated-publish"
          mkdir -p "$RELOCATED_DIR"
          cp -R "${PUBLISH_DIR}/." "$RELOCATED_DIR/"
          EXE="${RELOCATED_DIR}/${EXE_NAME}"
          chmod +x "$EXE" 2>/dev/null || true

          LOG="${SMOKE_DATA_DIR}/app-relocated.log"
          echo "Relaunching ${EXE_NAME} from ${RELOCATED_DIR} against the same isolated app data"
          (
            cd "$RELOCATED_DIR"
            exec env -u CI -u TF_BUILD -u GITHUB_ACTIONS -u TASKDECK_HEADLESS \
              ASPNETCORE_ENVIRONMENT="Production" \
              DOTNET_ENVIRONMENT="Production" \
              ASPNETCORE_URLS="${URL}" \
              LOCALAPPDATA="${APP_LOCALAPPDATA}" \
              HOME="${APP_HOME}" \
              XDG_DATA_HOME="${APP_XDG_DATA_HOME}" \
              FirstRun__AutoOpenBrowser="false" \
              "./${EXE_NAME}"
          ) > "$LOG" 2>&1 &
          APP_PID=$!

          READY=0
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null --max-time 5 "${URL}/health/ready"; then
              READY=1
              echo "Relocated health/ready returned success after ~${i}s"
              break
            fi
            if [ "${RUNNER_OS}" != "Windows" ] && ! kill -0 "${APP_PID}" 2>/dev/null; then
              echo "::error::Relocated Taskdeck process exited before /health/ready became ready"
              tail -n 60 "$LOG" || true
              exit 1
            fi
            sleep 1
          done
          if [ "${READY}" -ne 1 ]; then
            echo "::error::Relocated /health/ready did not return success within 60s"
            tail -n 60 "$LOG" || true
            exit 1
          fi

          ROOT_BODY="${SMOKE_DATA_DIR}/root-relocated.html"
          ROOT_CODE="$(curl -s -o "$ROOT_BODY" -w '%{http_code}' --max-time 10 "${URL}/" || echo 000)"
          if [ "$ROOT_CODE" != "200" ] || ! grep -qiE '<div id="app"|<!doctype html' "$ROOT_BODY"; then
            echo "::error::Relocated GET / did not serve the SPA index.html (HTTP ${ROOT_CODE})"
            tail -n 60 "$LOG" || true
            exit 1
          fi

          if command -v sha256sum >/dev/null 2>&1; then
            CONFIG_DIGEST_TWO="$(sha256sum "$DURABLE_CONFIG" | awk '{print $1}')"
          else
            CONFIG_DIGEST_TWO="$(shasum -a 256 "$DURABLE_CONFIG" | awk '{print $1}')"
          fi
          DB_PATH_TWO="$(node -e 'const fs=require("fs");const c=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));const s=c?.ConnectionStrings?.DefaultConnection??"";if(!s.startsWith("Data Source="))process.exit(2);process.stdout.write(s.slice("Data Source=".length));' "$DURABLE_CONFIG")"
          DB_PATH_TWO="$(canonicalize_db_path "$DB_PATH_TWO")"
          echo "Relocated launch durable config digest: ${CONFIG_DIGEST_TWO}"
          echo "Relocated launch resolved DB path: ${DB_PATH_TWO}"
          assert_sqlite_database "$DB_PATH_TWO" "Relocated launch"
          assert_publish_dirs_clean "$PUBLISH_DIR" "$RELOCATED_DIR"
          if [ "$CONFIG_DIGEST_ONE" != "$CONFIG_DIGEST_TWO" ]; then
            echo "::error::Durable config changed after relocating the published executable"
            exit 1
          fi
          if [ "$DB_PATH_ONE" != "$DB_PATH_TWO" ]; then
            echo "::error::Resolved database path changed after relocating the published executable"
            exit 1
          fi
          if [ -e "${RELOCATED_DIR}/appsettings.local.json" ]; then
            echo "::error::Relocated launch wrote executable-local appsettings.local.json"
            exit 1
          fi
          echo "Zero-config relocation smoke passed for ${{ matrix.rid }}"

          stop_app

          # Exercise the actual upgrade path using the first launch's generated config and database.
          # The durable file is inside the isolated profile; guard that exact scope before removing it.
          LEGACY_CONFIG="${RELOCATED_DIR}/appsettings.local.json"
          cp "$DURABLE_CONFIG" "$LEGACY_CONFIG"
          case "$DURABLE_CONFIG" in
            "${SMOKE_PROFILE_DIR}"/*) ;;
            *)
              echo "::error::Refusing to remove durable config outside the isolated smoke profile"
              exit 1
              ;;
          esac
          rm -f "$DURABLE_CONFIG"
          if [ -e "$DURABLE_CONFIG" ] || [ ! -f "$LEGACY_CONFIG" ]; then
            echo "::error::Could not stage the isolated executable-local migration source"
            exit 1
          fi

          LOG="${SMOKE_DATA_DIR}/app-migration.log"
          echo "Relaunching ${EXE_NAME} to migrate the staged executable-local config"
          (
            cd "$RELOCATED_DIR"
            exec env -u CI -u TF_BUILD -u GITHUB_ACTIONS -u TASKDECK_HEADLESS \
              ASPNETCORE_ENVIRONMENT="Production" \
              DOTNET_ENVIRONMENT="Production" \
              ASPNETCORE_URLS="${URL}" \
              LOCALAPPDATA="${APP_LOCALAPPDATA}" \
              HOME="${APP_HOME}" \
              XDG_DATA_HOME="${APP_XDG_DATA_HOME}" \
              FirstRun__AutoOpenBrowser="false" \
              "./${EXE_NAME}"
          ) > "$LOG" 2>&1 &
          APP_PID=$!

          READY=0
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null --max-time 5 "${URL}/health/ready"; then
              READY=1
              echo "Migrated health/ready returned success after ~${i}s"
              break
            fi
            if [ "${RUNNER_OS}" != "Windows" ] && ! kill -0 "${APP_PID}" 2>/dev/null; then
              echo "::error::Migrated Taskdeck process exited before /health/ready became ready"
              tail -n 60 "$LOG" || true
              exit 1
            fi
            sleep 1
          done
          if [ "${READY}" -ne 1 ]; then
            echo "::error::Migrated /health/ready did not return success within 60s"
            tail -n 60 "$LOG" || true
            exit 1
          fi

          LOCAL_CONFIG_COUNT="$(find "$SMOKE_PROFILE_DIR" -type f -name appsettings.local.json | wc -l | tr -d '[:space:]')"
          if [ "$LOCAL_CONFIG_COUNT" -ne 1 ]; then
            echo "::error::Migration did not recreate exactly one durable local config; found ${LOCAL_CONFIG_COUNT}"
            exit 1
          fi
          DURABLE_CONFIG_THREE="$(find "$SMOKE_PROFILE_DIR" -type f -name appsettings.local.json -print | head -n 1)"
          if [ "$DURABLE_CONFIG_THREE" != "$DURABLE_CONFIG" ]; then
            echo "::error::Migration recreated the durable config at an unexpected path"
            exit 1
          fi
          if command -v sha256sum >/dev/null 2>&1; then
            CONFIG_DIGEST_THREE="$(sha256sum "$DURABLE_CONFIG_THREE" | awk '{print $1}')"
            LEGACY_DIGEST="$(sha256sum "$LEGACY_CONFIG" | awk '{print $1}')"
          else
            CONFIG_DIGEST_THREE="$(shasum -a 256 "$DURABLE_CONFIG_THREE" | awk '{print $1}')"
            LEGACY_DIGEST="$(shasum -a 256 "$LEGACY_CONFIG" | awk '{print $1}')"
          fi
          DB_PATH_THREE="$(node -e 'const fs=require("fs");const c=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));const s=c?.ConnectionStrings?.DefaultConnection??"";if(!s.startsWith("Data Source="))process.exit(2);process.stdout.write(s.slice("Data Source=".length));' "$DURABLE_CONFIG_THREE")"
          DB_PATH_THREE="$(canonicalize_db_path "$DB_PATH_THREE")"
          CONNECTOR_KEY_THREE="$(node -e 'const fs=require("fs");const c=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));const k=c?.Connectors?.EncryptionKey??"";if(!k)process.exit(2);process.stdout.write(k);' "$DURABLE_CONFIG_THREE")"
          assert_sqlite_database "$DB_PATH_THREE" "Migration launch"
          assert_publish_dirs_clean "$PUBLISH_DIR" "$RELOCATED_DIR"
          if [ "$CONFIG_DIGEST_ONE" != "$CONFIG_DIGEST_THREE" ] || [ "$LEGACY_DIGEST" != "$CONFIG_DIGEST_ONE" ]; then
            echo "::error::Migration did not preserve the exact generated local-config bytes"
            exit 1
          fi
          if [ "$CONNECTOR_KEY_ONE" != "$CONNECTOR_KEY_THREE" ]; then
            echo "::error::Migration changed the generated connector encryption key"
            exit 1
          fi
          if [ "$DB_PATH_ONE" != "$DB_PATH_THREE" ]; then
            echo "::error::Migration changed the resolved database path"
            exit 1
          fi
          if [ ! -f "$LEGACY_CONFIG" ]; then
            echo "::error::Legacy executable-local config was not retained after migration"
            exit 1
          fi
          echo "Executable-local migration smoke passed for ${{ matrix.rid }}"

      # A bare workflow_dispatch (no tag input, run from a branch) is the REHEARSAL path:
      # it must build, smoke-test and package without publishing anything. Previously the
      # `${GITHUB_REF#refs/tags/}` strip silently no-op'd on `refs/heads/main`, so TAG became
      # "refs/heads/main" and the slashes broke packaging — meaning the pipeline could only
      # ever be exercised by pushing a real tag (`#1123`).
      - name: Determine version tag
        id: version
        shell: bash
        run: |
          TAG="${{ inputs.tag || '' }}"
          if [ -z "$TAG" ] && [ "${GITHUB_REF#refs/tags/}" != "$GITHUB_REF" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          if [ -z "$TAG" ]; then
            TAG="v0.0.0-dryrun+${GITHUB_SHA:0:7}"
            echo "No tag ref or tag input — rehearsal build, versioned $TAG (no release will be published)."
          fi
          case "$TAG" in
            */*|*' '*)
              echo "::error::Refusing version tag '$TAG' — it would produce an invalid artifact path."
              exit 1
              ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Package artifact (zip — Windows)
        if: matrix.archive_ext == 'zip'
        shell: pwsh
        run: |
          Compress-Archive -Path "publish/${{ matrix.rid }}/*" `
            -DestinationPath "taskdeck-${{ steps.version.outputs.tag }}-${{ matrix.rid }}.zip"

      - name: Package artifact (tar.gz — Linux/macOS)
        if: matrix.archive_ext == 'tar.gz'
        run: |
          tar -czf "taskdeck-${{ steps.version.outputs.tag }}-${{ matrix.rid }}.tar.gz" \
            -C publish/${{ matrix.rid }} .

      - name: Generate SHA256 checksum
        shell: bash
        run: |
          ARCHIVE="taskdeck-${{ steps.version.outputs.tag }}-${{ matrix.rid }}.${{ matrix.archive_ext }}"
          if command -v sha256sum &>/dev/null; then
            sha256sum "$ARCHIVE" > "${ARCHIVE}.sha256"
          else
            shasum -a 256 "$ARCHIVE" > "${ARCHIVE}.sha256"
          fi

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.rid }}
          path: |
            taskdeck-${{ steps.version.outputs.tag }}-${{ matrix.rid }}.${{ matrix.archive_ext }}
            taskdeck-${{ steps.version.outputs.tag }}-${{ matrix.rid }}.${{ matrix.archive_ext }}.sha256
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Create GitHub Release with all platform artifacts
  # ---------------------------------------------------------------------------
  create-release:
    name: Create GitHub Release
    needs: build-backend
    # Publish ONLY for a real release: a tag push, or a dispatch that names an existing tag.
    # A bare dispatch is a rehearsal and must stop after artifacts — without this guard it
    # reached `gh release create` and failed there, which is not a safe place to rely on.
    if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download all release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: artifacts/

      - name: Verify checksums
        working-directory: artifacts
        run: |
          echo "=== Release artifacts ==="
          ls -la
          echo ""
          echo "=== SHA256 checksums ==="
          cat ./*.sha256
          echo ""
          echo "=== Verifying checksums ==="
          sha256sum -c ./*.sha256

      - name: Determine version tag
        id: version
        run: |
          TAG="${{ inputs.tag || '' }}"
          if [ -z "$TAG" ] && [ "${GITHUB_REF#refs/tags/}" != "$GITHUB_REF" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          if [ -z "$TAG" ]; then
            echo "::error::No release tag resolved; this job must not run for a rehearsal build."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            artifacts/* \
            --title "Taskdeck ${{ steps.version.outputs.tag }}" \
            --generate-notes \
            --verify-tag
