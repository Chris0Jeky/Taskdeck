# =============================================================================
# Release Desktop — Windows x64 self-contained executable builds
# =============================================================================
#
# Triggers on version tags (v*). The public 0.1.x train builds one
# self-contained win-x64 executable on windows-latest and publishes its ZIP as
# a GitHub Release with a SHA256 checksum and auto-generated release notes.
#
# Dispatch-path invariants (#1795) — regression-tested by
# `scripts/ci/release-desktop-dispatch.test.mjs`:
#   * the untrusted `inputs.tag` reaches Bash only through a step `env:` var and
#     must clear `scripts/ci/validate-release-tag.sh` before ANY use;
#   * `resolve-source` resolves one (tag, commit) pair and every downstream
#     checkout is pinned to that commit and fails closed on a HEAD mismatch;
#   * no checkout persists Git credentials — release writes go through `gh`.
#
# Publish is resumable (#1806): draft -> per-asset `--clobber` upload with
# retries -> flip to published.
#
# A tag carrying a semver prerelease segment (v1.2.3-rc.1) is published as a
# GitHub PRERELEASE (#2217), so a release candidate never takes the Latest badge
# that README and the packaged quick start point users at.
#
# Tracked by: #535 (PKG-03), #1795, #1806, #1878, #2217
# =============================================================================

name: Release Desktop

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to build and PUBLISH (e.g. v0.1.1). Leave BLANK when dispatching from a BRANCH for a rehearsal: builds and smoke-tests the Windows x64 archive, uploads artifacts, and publishes nothing. Dispatching from a TAG ref publishes that tag even with this left blank."
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
  DOTNET_VERSION: "8.0.x"
  NODE_VERSION: "24.13.1"
  PUBLISH_PROJECT: backend/src/Taskdeck.Api/Taskdeck.Api.csproj

jobs:
  # ---------------------------------------------------------------------------
  # Resolve ONE release source (tag + commit) before anything is built (#1795)
  #
  # Every downstream job builds from `outputs.sha` and fails closed if its own
  # checkout lands anywhere else, so the bytes published under a tag provably
  # come from that tag's own commit. Before this job existed, `inputs.tag` named
  # the release while the artifact checkouts used the event's default ref: a
  # dispatch from branch B naming tag T published B's bytes as T.
  #
  # The untrusted dispatch input reaches Bash ONLY through a step `env:` var and
  # clears `scripts/ci/validate-release-tag.sh` before it is used in any path,
  # ref, output or `gh release` argument.
  # ---------------------------------------------------------------------------
  resolve-source:
    name: Resolve Release Source
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      sha: ${{ steps.resolve.outputs.sha }}
      publish: ${{ steps.resolve.outputs.publish }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
    steps:
      # Only the tag validator is needed here; nothing in this job writes to Git.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Resolve release tag and source commit
        id: resolve
        shell: bash
        env:
          # UNTRUSTED. Passed through the environment and assigned inside Bash —
          # never interpolated into shell source, where a crafted value could
          # close the assignment or trigger command substitution before the
          # grammar check runs. The job that consumes it holds `contents: write`.
          RAW_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          raw_tag="${RAW_TAG:-}"
          publish="false"
          prerelease="false"
          tag=""
          sha=""

          # --- 1. Decide the tag, refusing anything outside the grammar -------
          if [ -n "${raw_tag}" ]; then
            tag="$(bash scripts/ci/validate-release-tag.sh "${raw_tag}")"
            publish="true"
            printf 'Dispatch named release tag %s.\n' "${tag}"
          elif [ "${GITHUB_REF#refs/tags/}" != "${GITHUB_REF}" ]; then
            tag="$(bash scripts/ci/validate-release-tag.sh "${GITHUB_REF#refs/tags/}")"
            publish="true"
            printf 'Tag push for release tag %s.\n' "${tag}"
          fi

          # --- 2. Resolve the tag to its OWN commit --------------------------
          if [ "${publish}" = "true" ]; then
            # `git/ref/tags/<tag>` matches exactly and 404s (fail closed) when the
            # tag does not exist, so a branch or raw SHA cannot masquerade as a
            # tag even if it somehow cleared the grammar. Annotated tags are
            # dereferenced through the tag object to the commit.
            # ONE read of the ref, parsed once for both fields: two separate
            # calls could straddle a force-moved tag and pair the type from
            # before the move with the SHA from after it.
            ref_fields="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" \
              --jq '[.object.type, .object.sha] | @tsv')"
            IFS=$'\t' read -r object_type object_sha <<< "${ref_fields}"
            case "${object_type}" in
              commit)
                sha="${object_sha}"
                ;;
              tag)
                sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${object_sha}" --jq '.object.sha')"
                ;;
              *)
                printf '::error::Tag %s points at an unsupported object type %s.\n' "${tag}" "${object_type}"
                exit 1
                ;;
            esac
            # GITHUB_SHA is the tag OBJECT for an annotated tag push, so it is
            # logged for context only — the tag's own commit is authoritative.
            if [ "${sha}" != "${GITHUB_SHA}" ]; then
              printf 'Note: GITHUB_SHA (%s) differs from the tag commit (%s); building the tag commit.\n' \
                "${GITHUB_SHA}" "${sha}"
            fi
          else
            sha="${GITHUB_SHA}"
            if [[ ! ${sha} =~ ^[0-9a-f]{40}$ ]]; then
              printf '::error::GITHUB_SHA %q is not a 40-character commit SHA.\n' "${sha}"
              exit 1
            fi
            tag="v0.0.0-dryrun+${sha:0:7}"
            printf 'No tag ref or tag input — rehearsal build, versioned %s (no release will be published).\n' "${tag}"
          fi

          # --- 3. Fail closed on anything that is not a clean commit SHA -----
          if [[ ! ${sha} =~ ^[0-9a-f]{40}$ ]]; then
            printf '::error::Resolved release commit %q is not a 40-character commit SHA.\n' "${sha}"
            exit 1
          fi
          # Re-validate the final tag, which also covers the generated rehearsal name.
          tag="$(bash scripts/ci/validate-release-tag.sh "${tag}")"

          # --- 4. Decide the publish semantics from that same tag ------------
          # Read off the VALIDATED tag string, so the release's label and the
          # bytes published under it can never disagree about which tag they
          # describe. The grammar in scripts/ci/validate-release-tag.sh spells
          # "-" only as the prerelease separator: build-metadata identifiers are
          # [0-9A-Za-z] joined by ".", never a hyphen. A "-" anywhere in a
          # validated tag therefore means a prerelease segment and nothing else.
          case "${tag}" in
            *-*) prerelease="true" ;;
            *)   prerelease="false" ;;
          esac

          {
            printf 'tag=%s\n' "${tag}"
            printf 'sha=%s\n' "${sha}"
            printf 'publish=%s\n' "${publish}"
            printf 'prerelease=%s\n' "${prerelease}"
          } >> "${GITHUB_OUTPUT}"

          # The Markdown code-span delimiter is held in a variable and passed as a
          # printf argument: a literal backtick inside a single-quoted format
          # string trips ShellCheck SC2016, which the Workflow Lint job treats as
          # a failure. The rendered summary is byte-identical either way.
          bt="\`"
          {
            printf '### Release source\n\n'
            printf '| field | value |\n| --- | --- |\n'
            printf '| tag | %s%s%s |\n' "${bt}" "${tag}" "${bt}"
            printf '| commit | %s%s%s |\n' "${bt}" "${sha}" "${bt}"
            printf '| publishes a release | %s%s%s |\n' "${bt}" "${publish}" "${bt}"
            printf '| published as a prerelease | %s%s%s |\n' "${bt}" "${prerelease}" "${bt}"
          } >> "${GITHUB_STEP_SUMMARY}"

  # ---------------------------------------------------------------------------
  # Build frontend assets for the desktop archive
  # ---------------------------------------------------------------------------
  build-frontend:
    name: Build Frontend
    needs: resolve-source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-source.outputs.sha }}
          persist-credentials: false

      - name: Verify checkout matches the resolved release commit
        shell: bash
        env:
          EXPECTED_SHA: ${{ needs.resolve-source.outputs.sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          if [ "${actual_sha}" != "${EXPECTED_SHA}" ]; then
            printf '::error::Checkout HEAD %s does not match the resolved release commit %s.\n' \
              "${actual_sha}" "${EXPECTED_SHA}"
            exit 1
          fi
          printf 'Release source commit verified: %s\n' "${actual_sha}"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/taskdeck-web/package-lock.json

      - name: Install dependencies
        working-directory: frontend/taskdeck-web
        run: npm ci

      - name: Build production bundle
        working-directory: frontend/taskdeck-web
        env:
          VITE_API_BASE_URL: /api
        run: npx vite build

      - name: Upload frontend dist
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/taskdeck-web/dist/
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Build the supported Windows x64 self-contained executable
  # ---------------------------------------------------------------------------
  build-backend:
    name: Build ${{ matrix.rid }}
    needs: [resolve-source, build-frontend]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
            archive_ext: zip
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-source.outputs.sha }}
          persist-credentials: false

      - name: Verify checkout matches the resolved release commit
        shell: bash
        env:
          EXPECTED_SHA: ${{ needs.resolve-source.outputs.sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          if [ "${actual_sha}" != "${EXPECTED_SHA}" ]; then
            printf '::error::Checkout HEAD %s does not match the resolved release commit %s.\n' \
              "${actual_sha}" "${EXPECTED_SHA}"
            exit 1
          fi
          printf 'Release source commit verified: %s\n' "${actual_sha}"

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: true
          cache-dependency-path: |
            backend/Taskdeck.sln
            backend/Directory.Packages.props
            backend/**/*.csproj

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/taskdeck-web/package-lock.json

      - name: Install packaged acceptance browser
        working-directory: frontend/taskdeck-web
        run: |
          npm ci
          npx playwright install chromium

      - name: Download frontend dist
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: frontend-dist

      - name: Restore backend
        run: dotnet restore backend/Taskdeck.sln -r ${{ matrix.rid }}

      # Product version stamped into the binaries (#1804).
      #
      # The tag comes from `resolve-source` (#1795), NOT from `inputs.tag`: that job is the
      # single place the untrusted dispatch input is grammar-checked, and it is the same
      # (tag, commit) pair this job's checkout is pinned to. Re-deriving from `inputs.tag`
      # here would both re-open the injection seam and let the stamped version disagree with
      # the commit actually being built. A rehearsal dispatch gets resolve-source's generated
      # `v0.0.0-dryrun+<sha7>`, so an unreleased artifact stays recognisable.
      #
      # Two suffixes are stripped:
      #   * the leading "v"      — MSBuild versions are bare.
      #   * any "+<build>" meta  — `ProductVersion.Normalize` drops build metadata before
      #     reporting, so keeping it here would stamp a value the running binary can never
      #     echo back, and the container smoke test would compare mismatched strings.
      # The plain-token check below therefore refuses "+" as a redundancy check on that
      # stripping. The release-tag GRAMMAR does admit "+<build>"
      # (scripts/ci/validate-release-tag.sh), so a "+" surviving to that point means the
      # strip above failed rather than that the tag was invalid.
      #
      # Deliberately separate from the later "Determine version tag" step, which resolves the
      # ARTIFACT FILENAME tag and runs after publish.
      - name: Resolve product version
        id: product-version
        shell: bash
        env:
          # Already grammar-checked by scripts/ci/validate-release-tag.sh in resolve-source;
          # passed through the environment anyway so this step reads the same for a reviewer
          # as every other tag consumer in this workflow.
          RELEASE_TAG: ${{ needs.resolve-source.outputs.tag }}
        run: |
          set -euo pipefail

          tag="${RELEASE_TAG:-}"
          if [ -z "${tag}" ]; then
            printf '::error::resolve-source produced no release tag.\n'
            exit 1
          fi

          version="${tag#v}"
          version="${version%%+*}"

          # The value is passed to MSBuild as a property; refuse anything that is not a plain
          # version token rather than letting it reach the build command. No "+" — see above.
          if ! printf '%s' "${version}" | grep -Eq '^[0-9A-Za-z][0-9A-Za-z.-]*$'; then
            printf '::error::Refusing product version %q — not a plain version token.\n' "${version}"
            exit 1
          fi

          printf 'version=%s\n' "${version}" >> "${GITHUB_OUTPUT}"
          printf 'Stamping product version %s (from release tag %s).\n' "${version}" "${tag}"

      - name: Publish self-contained executable
        run: >
          dotnet publish ${{ env.PUBLISH_PROJECT }}
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          -p:Version=${{ steps.product-version.outputs.version }}
          -p:TaskdeckDesktopPackage=true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:PublishTrimmed=false
          -o publish/${{ matrix.rid }}
          --no-restore

      - name: Stage Windows archive contents
        shell: bash
        run: |
          set -euo pipefail
          stage="publish/${{ matrix.rid }}"
          mkdir -p "${stage}/wwwroot" "${stage}/LICENSES"
          cp -r frontend-dist/* "${stage}/wwwroot/"
          cp docs/releases/WINDOWS_QUICK_START.md "${stage}/QUICK_START.md"
          cp docs/MCP_SERVER.md "${stage}/MCP_SERVER.md"
          cp mcp.example.json "${stage}/mcp.example.json"
          cp mcp-docker.example.json "${stage}/mcp-docker.example.json"
          cp LICENSE "${stage}/LICENSE"
          cp RELICENSING.md "${stage}/RELICENSING.md"
          cp LICENSES/MIT.txt "${stage}/LICENSES/MIT.txt"
          cp LICENSES/Apache-2.0-material-symbols-font-200.txt \
            "${stage}/LICENSES/Apache-2.0-material-symbols-font-200.txt"

          # Swagger can consume XML docs in source/developer builds, but release users do not
          # need build-host symbols, IIS scaffolding, or Development configuration.
          find "${stage}" -type f \( \
            -iname 'appsettings.Development.json' -o \
            -iname '*.pdb' -o \
            -iname '*.xml' -o \
            -iname 'web.config' \
          \) -delete

      - name: Verify frontend assets present
        shell: bash
        run: |
          if [ ! -f "publish/${{ matrix.rid }}/wwwroot/index.html" ]; then
            echo "::error::Frontend dist missing index.html — build may have failed silently"
            exit 1
          fi
          echo "Frontend assets verified ($(find publish/${{ matrix.rid }}/wwwroot -type f | wc -l) files)"

      - name: Verify distribution licences present
        shell: bash
        run: |
          LICENCE="publish/${{ matrix.rid }}/LICENSE"
          MIT_NOTICE="publish/${{ matrix.rid }}/LICENSES/MIT.txt"
          MATERIAL_SYMBOLS_LICENSE="publish/${{ matrix.rid }}/LICENSES/Apache-2.0-material-symbols-font-200.txt"
          if [ ! -f "$LICENCE" ] || ! grep -q "GNU GENERAL PUBLIC LICENSE" "$LICENCE"; then
            echo "::error::GPLv3 licence missing from the desktop distribution"
            exit 1
          fi
          if [ ! -f "$MIT_NOTICE" ] || ! grep -q "MIT License" "$MIT_NOTICE"; then
            echo "::error::Historical MIT notice missing from the desktop distribution"
            exit 1
          fi
          if [ ! -f "$MATERIAL_SYMBOLS_LICENSE" ] || ! grep -q "Apache License" "$MATERIAL_SYMBOLS_LICENSE"; then
            echo "::error::Material Symbols Apache-2.0 licence missing from the desktop distribution"
            exit 1
          fi
          if ! cmp -s LICENSES/Apache-2.0-material-symbols-font-200.txt "$MATERIAL_SYMBOLS_LICENSE"; then
            echo "::error::Material Symbols licence does not match the reviewed source copy"
            exit 1
          fi
          test -f "publish/${{ matrix.rid }}/RELICENSING.md"
          echo "GPLv3, transition, and Material Symbols notices verified in the desktop distribution"

      - name: Verify Windows archive content contract
        shell: bash
        run: |
          set -euo pipefail
          stage="publish/${{ matrix.rid }}"
          required=(
            'Taskdeck.Api.exe'
            'appsettings.json'
            'QUICK_START.md'
            'MCP_SERVER.md'
            'mcp.example.json'
            'mcp-docker.example.json'
            'wwwroot/index.html'
            'LICENSE'
            'RELICENSING.md'
            'LICENSES/MIT.txt'
            'LICENSES/Apache-2.0-material-symbols-font-200.txt'
          )
          for relative_path in "${required[@]}"; do
            if [ ! -f "${stage}/${relative_path}" ]; then
              printf '::error::Windows archive is missing required file %s.\n' "${relative_path}"
              exit 1
            fi
          done

          if ! cmp -s docs/releases/WINDOWS_QUICK_START.md "${stage}/QUICK_START.md"; then
            printf '::error::Archive QUICK_START.md does not match the reviewed source guide.\n'
            exit 1
          fi
          if ! cmp -s docs/MCP_SERVER.md "${stage}/MCP_SERVER.md"; then
            printf '::error::Archive MCP_SERVER.md does not match the reviewed source guide.\n'
            exit 1
          fi
          if ! cmp -s mcp.example.json "${stage}/mcp.example.json"; then
            printf '::error::Archive mcp.example.json does not match the reviewed desktop example.\n'
            exit 1
          fi
          if ! cmp -s mcp-docker.example.json "${stage}/mcp-docker.example.json"; then
            printf '::error::Archive mcp-docker.example.json does not match the reviewed Docker example.\n'
            exit 1
          fi

          forbidden="$(find "${stage}" -type f \( \
            -iname 'appsettings.Development.json' -o \
            -iname '*.pdb' -o \
            -iname '*.xml' -o \
            -iname 'web.config' \
          \) -print)"
          if [ -n "${forbidden}" ]; then
            printf '::error::Windows archive contains forbidden development/build artifacts:\n%s\n' \
              "${forbidden}"
            exit 1
          fi
          printf 'Windows archive content contract verified (%s required files).\n' "${#required[@]}"

      # The version tag is resolved ONCE in `resolve-source` (grammar-validated
      # there) and reaches these steps through `env:`, never as raw shell source.
      # A bare workflow_dispatch (no tag input, run from a branch) is the REHEARSAL
      # path: it builds, validates and packages as `v0.0.0-dryrun+<sha7>` and
      # publishes nothing (`#1123`).
      - name: Package artifact (zip — Windows x64)
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.resolve-source.outputs.tag }}
          RELEASE_RID: ${{ matrix.rid }}
        run: |
          Compress-Archive -Path "publish/${env:RELEASE_RID}/*" `
            -DestinationPath "taskdeck-${env:RELEASE_TAG}-${env:RELEASE_RID}.zip"

      - name: Generate SHA256 checksum
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.resolve-source.outputs.tag }}
          RELEASE_RID: ${{ matrix.rid }}
          ARCHIVE_EXT: ${{ matrix.archive_ext }}
        run: |
          set -euo pipefail
          ARCHIVE="taskdeck-${RELEASE_TAG}-${RELEASE_RID}.${ARCHIVE_EXT}"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$ARCHIVE" > "${ARCHIVE}.sha256"
          else
            shasum -a 256 "$ARCHIVE" > "${ARCHIVE}.sha256"
          fi

      - name: Test untouched Windows desktop ZIP
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.resolve-source.outputs.tag }}
          RELEASE_RID: ${{ matrix.rid }}
          ARCHIVE_EXT: ${{ matrix.archive_ext }}
          TASKDECK_RELEASE_OPENAI_API_KEY: ${{ secrets.TASKDECK_RELEASE_OPENAI_API_KEY }}
        run: |
          $archive = "taskdeck-${env:RELEASE_TAG}-${env:RELEASE_RID}.${env:ARCHIVE_EXT}"
          $evidence = Join-Path $env:RUNNER_TEMP "taskdeck-desktop-acceptance-${env:RELEASE_RID}.json"
          ./scripts/ci/Test-WindowsDesktopArchive.ps1 `
            -ArchivePath $archive `
            -ChecksumPath "${archive}.sha256" `
            -EvidencePath $evidence `
            -FrontendDirectory "frontend/taskdeck-web" `
            -LiveOpenAIIfConfigured

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.rid }}
          path: |
            taskdeck-${{ needs.resolve-source.outputs.tag }}-${{ matrix.rid }}.${{ matrix.archive_ext }}
            taskdeck-${{ needs.resolve-source.outputs.tag }}-${{ matrix.rid }}.${{ matrix.archive_ext }}.sha256
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Create GitHub Release with the Windows x64 artifact
  # ---------------------------------------------------------------------------
  create-release:
    name: Create GitHub Release
    needs: [resolve-source, build-backend]
    # Publish ONLY for a real release: a tag push, or a dispatch that names an existing tag.
    # A bare dispatch is a rehearsal and must stop after artifacts — without this guard it
    # reached `gh release create` and failed there, which is not a safe place to rely on.
    # `publish` is decided in resolve-source, alongside the grammar check.
    if: needs.resolve-source.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # Pinned to the resolved release commit, and credentials are NOT persisted:
      # every write here goes through `gh` with an explicit GH_TOKEN.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-source.outputs.sha }}
          persist-credentials: false

      - name: Verify checkout matches the resolved release commit
        shell: bash
        env:
          EXPECTED_SHA: ${{ needs.resolve-source.outputs.sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          if [ "${actual_sha}" != "${EXPECTED_SHA}" ]; then
            printf '::error::Checkout HEAD %s does not match the resolved release commit %s.\n' \
              "${actual_sha}" "${EXPECTED_SHA}"
            exit 1
          fi
          printf 'Release source commit verified: %s\n' "${actual_sha}"

      # NOT artifacts/ — the repo tracks an artifacts/ directory (artifacts/openapi), so the
      # checkout above already populates it; downloading into it merged repo content into the
      # release glob and `gh release create artifacts/*` failed on the directory ("read
      # artifacts/openapi: is a directory", v0.1.0 run 32211340173). Rehearsals skip this job,
      # so only a real tag push could surface it.
      - name: Download all release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets/

      - name: Verify checksums
        shell: bash
        working-directory: release-assets
        run: |
          set -euo pipefail
          echo "=== Release artifacts ==="
          ls -la
          echo ""
          echo "=== SHA256 checksums ==="
          cat ./*.sha256
          echo ""
          echo "=== Verifying checksums ==="
          sha256sum -c ./*.sha256

      # Release evidence: the resolved commit ships WITH the assets, so anyone
      # holding a downloaded archive can tie it back to one commit and one run.
      - name: Write release provenance asset
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.resolve-source.outputs.tag }}
          RELEASE_SHA: ${{ needs.resolve-source.outputs.sha }}
        run: |
          set -euo pipefail
          provenance="release-assets/taskdeck-${RELEASE_TAG}-provenance.txt"
          {
            printf 'Taskdeck release provenance\n'
            printf 'tag: %s\n' "${RELEASE_TAG}"
            printf 'commit: %s\n' "${RELEASE_SHA}"
            printf 'repository: %s\n' "${GITHUB_REPOSITORY}"
            printf 'workflow: %s\n' "${GITHUB_WORKFLOW}"
            printf 'run: %s/%s/actions/runs/%s\n' "${GITHUB_SERVER_URL}" "${GITHUB_REPOSITORY}" "${GITHUB_RUN_ID}"
            printf 'run attempt: %s\n' "${GITHUB_RUN_ATTEMPT}"
          } > "${provenance}"
          cat "${provenance}"
          cat "${provenance}" >> "${GITHUB_STEP_SUMMARY}"

      # Re-check server-side, immediately before publishing, that the tag still
      # points at the commit that was actually built. A tag moved mid-run must
      # not silently publish stale bytes.
      - name: Verify the release tag still points at the built commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.resolve-source.outputs.tag }}
          RELEASE_SHA: ${{ needs.resolve-source.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${RELEASE_TAG}" --jq '.sha')"
          if [ "${current_sha}" != "${RELEASE_SHA}" ]; then
            printf '::error::Tag %s now resolves to %s but the artifacts were built from %s. Refusing to publish.\n' \
              "${RELEASE_TAG}" "${current_sha}" "${RELEASE_SHA}"
            exit 1
          fi
          printf 'Tag %s still resolves to the built commit %s.\n' "${RELEASE_TAG}" "${current_sha}"

      # -----------------------------------------------------------------------
      # Resumable publish (#1806)
      #
      # `gh release create <tag> <assets...>` is all-or-nothing: the v0.1.0 run
      # created release 372777600, died mid-upload and rolled the release back,
      # leaving nothing and forcing a manual completion from the run artifacts.
      # The publish is therefore split into three idempotent phases:
      #   1. create a DRAFT (or adopt whatever a previous attempt left behind),
      #   2. upload each asset with `--clobber` and bounded retries,
      #   3. flip the draft to published only once every asset is up.
      # A re-run at any point resumes instead of restarting, and a failure never
      # leaves a published release with missing assets.
      # -----------------------------------------------------------------------
      - name: Create or adopt draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.resolve-source.outputs.tag }}
          RELEASE_PRERELEASE: ${{ needs.resolve-source.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          # Adoption MUST see drafts: a previous failed attempt leaves exactly a
          # draft behind, and that is the case this step exists for. The REST
          # `releases/tags/{tag}` lookup does NOT return drafts, so detection goes
          # through the release LISTING (which does, for a token with push access)
          # rather than depending on any client-side draft fallback.
          release_rows="$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate \
            --jq '.[] | [.tag_name, (.id | tostring), (.draft | tostring)] | @tsv')"
          existing_row="$(printf '%s\n' "${release_rows}" \
            | awk -F'\t' -v tag="${RELEASE_TAG}" '$1 == tag { print; exit }')"
          if [ -n "${existing_row}" ]; then
            IFS=$'\t' read -r _ release_id release_is_draft <<< "${existing_row}"
            printf 'Release %s already exists (id %s, draft=%s) — adopting it; assets are re-uploaded with --clobber.\n' \
              "${RELEASE_TAG}" "${release_id}" "${release_is_draft}"
          else
            # A prerelease tag is flagged from creation, not only at publish, so
            # the draft is never briefly a full release. The array is EMPTY for a
            # stable tag, where it expands to zero words and this call stays
            # byte-identical to the pre-#2217 one.
            prerelease_flag=()
            if [ "${RELEASE_PRERELEASE}" = "true" ]; then
              prerelease_flag=(--prerelease)
            fi
            gh release create "${RELEASE_TAG}" \
              --draft \
              "${prerelease_flag[@]}" \
              --title "Taskdeck ${RELEASE_TAG}" \
              --generate-notes \
              --verify-tag
            printf 'Draft release %s created (prerelease=%s).\n' "${RELEASE_TAG}" "${RELEASE_PRERELEASE}"
          fi

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.resolve-source.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(release-assets/*)
          if [ "${#assets[@]}" -eq 0 ]; then
            printf '::error::No release assets found under release-assets/.\n'
            exit 1
          fi
          for asset in "${assets[@]}"; do
            # Directories are the v0.1.0 failure mode ("is a directory"); refuse
            # them loudly rather than letting gh fail deep inside the upload.
            if [ ! -f "${asset}" ]; then
              printf '::error::Refusing to upload %s — not a regular file.\n' "${asset}"
              exit 1
            fi
          done
          for asset in "${assets[@]}"; do
            uploaded=0
            for attempt in 1 2 3; do
              if gh release upload "${RELEASE_TAG}" "${asset}" --clobber; then
                uploaded=1
                printf 'Uploaded %s (attempt %s).\n' "${asset}" "${attempt}"
                break
              fi
              printf '::warning::Upload of %s failed (attempt %s/3).\n' "${asset}" "${attempt}"
              if [ "${attempt}" -lt 3 ]; then
                sleep "$((attempt * 10))"
              fi
            done
            if [ "${uploaded}" -ne 1 ]; then
              printf '::error::Failed to upload %s after 3 attempts; the release stays a draft.\n' "${asset}"
              exit 1
            fi
          done
          printf 'All %s release assets uploaded.\n' "${#assets[@]}"

      # Publishing DOES move the Latest badge, which the previous comment here denied:
      # GitHub shows the most recent non-draft, non-prerelease release at
      # /releases/latest (gh's own `--latest` default is "automatic based on date and
      # version"), and README plus the packaged quick start send users to that URL.
      #
      # `--prerelease` therefore travels in the SAME edit that clears the draft flag, so
      # a release candidate is never momentarily a full release (#2217). Re-asserting it
      # here also covers the adoption path above, where the draft left behind by an
      # earlier attempt may predate this flag. A stable tag is unchanged: the array is
      # empty and the call is exactly `gh release edit <tag> --draft=false`.
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.resolve-source.outputs.tag }}
          RELEASE_PRERELEASE: ${{ needs.resolve-source.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          prerelease_flag=()
          if [ "${RELEASE_PRERELEASE}" = "true" ]; then
            prerelease_flag=(--prerelease)
          fi
          gh release edit "${RELEASE_TAG}" --draft=false "${prerelease_flag[@]}"
          printf 'Published release %s (prerelease=%s).\n' "${RELEASE_TAG}" "${RELEASE_PRERELEASE}"
