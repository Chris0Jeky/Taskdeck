# =============================================================================
# Release Desktop — cross-platform self-contained executable builds
# =============================================================================
#
# Triggers on version tags (v*). Builds self-contained single-file executables
# for win-x64, linux-x64, osx-x64, osx-arm64 and publishes them as a GitHub
# Release with SHA256 checksums and auto-generated release notes.
#
# Dispatch-path invariants (#1795) — regression-tested by
# `scripts/ci/release-desktop-dispatch.test.mjs`:
#   * the untrusted `inputs.tag` reaches Bash only through a step `env:` var and
#     must clear `scripts/ci/validate-release-tag.sh` before ANY use;
#   * `resolve-source` resolves one (tag, commit) pair and every downstream
#     checkout is pinned to that commit and fails closed on a HEAD mismatch;
#   * no checkout persists Git credentials — release writes go through `gh`.
#
# Publish is resumable (#1806): draft -> per-asset `--clobber` upload with
# retries -> flip to published.
#
# Tracked by: #535 (PKG-03), #1795, #1806
# =============================================================================

name: Release Desktop

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to build and PUBLISH (e.g. v0.2.0). Leave BLANK when dispatching from a BRANCH for a rehearsal: builds, smoke-tests the runner-native platforms, uploads artifacts, publishes nothing. Dispatching from a TAG ref publishes that tag even with this left blank."
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
  DOTNET_VERSION: "8.0.x"
  NODE_VERSION: "24.13.1"
  PUBLISH_PROJECT: backend/src/Taskdeck.Api/Taskdeck.Api.csproj

jobs:
  # ---------------------------------------------------------------------------
  # Resolve ONE release source (tag + commit) before anything is built (#1795)
  #
  # Every downstream job builds from `outputs.sha` and fails closed if its own
  # checkout lands anywhere else, so the bytes published under a tag provably
  # come from that tag's own commit. Before this job existed, `inputs.tag` named
  # the release while the artifact checkouts used the event's default ref: a
  # dispatch from branch B naming tag T published B's bytes as T.
  #
  # The untrusted dispatch input reaches Bash ONLY through a step `env:` var and
  # clears `scripts/ci/validate-release-tag.sh` before it is used in any path,
  # ref, output or `gh release` argument.
  # ---------------------------------------------------------------------------
  resolve-source:
    name: Resolve Release Source
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      sha: ${{ steps.resolve.outputs.sha }}
      publish: ${{ steps.resolve.outputs.publish }}
    steps:
      # Only the tag validator is needed here; nothing in this job writes to Git.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Resolve release tag and source commit
        id: resolve
        shell: bash
        env:
          # UNTRUSTED. Passed through the environment and assigned inside Bash —
          # never interpolated into shell source, where a crafted value could
          # close the assignment or trigger command substitution before the
          # grammar check runs. The job that consumes it holds `contents: write`.
          RAW_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          raw_tag="${RAW_TAG:-}"
          publish="false"
          tag=""
          sha=""

          # --- 1. Decide the tag, refusing anything outside the grammar -------
          if [ -n "${raw_tag}" ]; then
            tag="$(bash scripts/ci/validate-release-tag.sh "${raw_tag}")"
            publish="true"
            printf 'Dispatch named release tag %s.\n' "${tag}"
          elif [ "${GITHUB_REF#refs/tags/}" != "${GITHUB_REF}" ]; then
            tag="$(bash scripts/ci/validate-release-tag.sh "${GITHUB_REF#refs/tags/}")"
            publish="true"
            printf 'Tag push for release tag %s.\n' "${tag}"
          fi

          # --- 2. Resolve the tag to its OWN commit --------------------------
          if [ "${publish}" = "true" ]; then
            # `git/ref/tags/<tag>` matches exactly and 404s (fail closed) when the
            # tag does not exist, so a branch or raw SHA cannot masquerade as a
            # tag even if it somehow cleared the grammar. Annotated tags are
            # dereferenced through the tag object to the commit.
            object_type="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" --jq '.object.type')"
            object_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" --jq '.object.sha')"
            case "${object_type}" in
              commit)
                sha="${object_sha}"
                ;;
              tag)
                sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${object_sha}" --jq '.object.sha')"
                ;;
              *)
                printf '::error::Tag %s points at an unsupported object type %s.\n' "${tag}" "${object_type}"
                exit 1
                ;;
            esac
            # GITHUB_SHA is the tag OBJECT for an annotated tag push, so it is
            # logged for context only — the tag's own commit is authoritative.
            if [ "${sha}" != "${GITHUB_SHA}" ]; then
              printf 'Note: GITHUB_SHA (%s) differs from the tag commit (%s); building the tag commit.\n' \
                "${GITHUB_SHA}" "${sha}"
            fi
          else
            sha="${GITHUB_SHA}"
            if [[ ! ${sha} =~ ^[0-9a-f]{40}$ ]]; then
              printf '::error::GITHUB_SHA %q is not a 40-character commit SHA.\n' "${sha}"
              exit 1
            fi
            tag="v0.0.0-dryrun+${sha:0:7}"
            printf 'No tag ref or tag input — rehearsal build, versioned %s (no release will be published).\n' "${tag}"
          fi

          # --- 3. Fail closed on anything that is not a clean commit SHA -----
          if [[ ! ${sha} =~ ^[0-9a-f]{40}$ ]]; then
            printf '::error::Resolved release commit %q is not a 40-character commit SHA.\n' "${sha}"
            exit 1
          fi
          # Re-validate the final tag, which also covers the generated rehearsal name.
          tag="$(bash scripts/ci/validate-release-tag.sh "${tag}")"

          {
            printf 'tag=%s\n' "${tag}"
            printf 'sha=%s\n' "${sha}"
            printf 'publish=%s\n' "${publish}"
          } >> "${GITHUB_OUTPUT}"

          {
            printf '### Release source\n\n'
            printf '| field | value |\n| --- | --- |\n'
            printf '| tag | `%s` |\n' "${tag}"
            printf '| commit | `%s` |\n' "${sha}"
            printf '| publishes a release | `%s` |\n' "${publish}"
          } >> "${GITHUB_STEP_SUMMARY}"

  # ---------------------------------------------------------------------------
  # Build frontend assets (shared by all platform builds)
  # ---------------------------------------------------------------------------
  build-frontend:
    name: Build Frontend
    needs: resolve-source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-source.outputs.sha }}
          persist-credentials: false

      - name: Verify checkout matches the resolved release commit
        shell: bash
        env:
          EXPECTED_SHA: ${{ needs.resolve-source.outputs.sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          if [ "${actual_sha}" != "${EXPECTED_SHA}" ]; then
            printf '::error::Checkout HEAD %s does not match the resolved release commit %s.\n' \
              "${actual_sha}" "${EXPECTED_SHA}"
            exit 1
          fi
          printf 'Release source commit verified: %s\n' "${actual_sha}"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/taskdeck-web/package-lock.json

      - name: Install dependencies
        working-directory: frontend/taskdeck-web
        run: npm ci

      - name: Build production bundle
        working-directory: frontend/taskdeck-web
        run: npx vite build

      - name: Upload frontend dist
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/taskdeck-web/dist/
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Build self-contained executables per platform
  # ---------------------------------------------------------------------------
  build-backend:
    name: Build ${{ matrix.rid }}
    needs: [resolve-source, build-frontend]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
            archive_ext: zip
          - rid: linux-x64
            os: ubuntu-latest
            archive_ext: tar.gz
          - rid: osx-x64
            os: macos-latest
            archive_ext: tar.gz
          - rid: osx-arm64
            os: macos-latest
            archive_ext: tar.gz
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-source.outputs.sha }}
          persist-credentials: false

      - name: Verify checkout matches the resolved release commit
        shell: bash
        env:
          EXPECTED_SHA: ${{ needs.resolve-source.outputs.sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          if [ "${actual_sha}" != "${EXPECTED_SHA}" ]; then
            printf '::error::Checkout HEAD %s does not match the resolved release commit %s.\n' \
              "${actual_sha}" "${EXPECTED_SHA}"
            exit 1
          fi
          printf 'Release source commit verified: %s\n' "${actual_sha}"

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: true
          cache-dependency-path: |
            backend/Taskdeck.sln
            backend/Directory.Packages.props
            backend/**/*.csproj

      - name: Download frontend dist
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: frontend-dist

      - name: Restore backend
        run: dotnet restore backend/Taskdeck.sln -r ${{ matrix.rid }}

      - name: Publish self-contained executable
        run: >
          dotnet publish ${{ env.PUBLISH_PROJECT }}
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:PublishTrimmed=false
          -o publish/${{ matrix.rid }}
          --no-restore

      - name: Copy frontend dist into publish output
        shell: bash
        run: |
          mkdir -p publish/${{ matrix.rid }}/wwwroot
          cp -r frontend-dist/* publish/${{ matrix.rid }}/wwwroot/
          cp LICENSE publish/${{ matrix.rid }}/LICENSE
          cp RELICENSING.md publish/${{ matrix.rid }}/RELICENSING.md
          mkdir -p publish/${{ matrix.rid }}/LICENSES
          cp LICENSES/MIT.txt publish/${{ matrix.rid }}/LICENSES/MIT.txt

      - name: Verify frontend assets present
        shell: bash
        run: |
          if [ ! -f "publish/${{ matrix.rid }}/wwwroot/index.html" ]; then
            echo "::error::Frontend dist missing index.html — build may have failed silently"
            exit 1
          fi
          echo "Frontend assets verified ($(find publish/${{ matrix.rid }}/wwwroot -type f | wc -l) files)"

      - name: Verify GPL licence present
        shell: bash
        run: |
          LICENCE="publish/${{ matrix.rid }}/LICENSE"
          MIT_NOTICE="publish/${{ matrix.rid }}/LICENSES/MIT.txt"
          if [ ! -f "$LICENCE" ] || ! grep -q "GNU GENERAL PUBLIC LICENSE" "$LICENCE"; then
            echo "::error::GPLv3 licence missing from the desktop distribution"
            exit 1
          fi
          if [ ! -f "$MIT_NOTICE" ] || ! grep -q "MIT License" "$MIT_NOTICE"; then
            echo "::error::Historical MIT notice missing from the desktop distribution"
            exit 1
          fi
          test -f "publish/${{ matrix.rid }}/RELICENSING.md"
          echo "GPLv3 licence and transition notices verified in the desktop distribution"

      # -----------------------------------------------------------------------
      # Post-publish smoke test (#1123 AC2)
      #
      # Proves the just-published self-contained executable actually boots and
      # serves the product before we archive and ship it:
      #   1. GET /health/ready returns success  -> EF migrations applied, DB
      #      reachable, workers heartbeating (PipelineConfiguration runs the
      #      SerializedMigrator at startup; HealthController.ReadyCheck gates on
      #      DB + queue + workers).
      #   2. GET /                returns the SPA index.html -> same-origin
      #      wwwroot serving works (UseDefaultFiles + UseStaticFiles).
      # The process is always killed (trap ... EXIT) so it never leaks, and any
      # failure (no boot, never ready, / not HTML) fails the release job.
      #
      # Runner-native RIDs only: the GitHub macos-latest runner is arm64, so the
      # osx-x64 binary is cross-arch and may not launch there. It is SKIPPED via
      # the `if:` gate below; osx-arm64 is the macOS RID exercised instead.
      # win-x64 (windows-latest) and linux-x64 (ubuntu-latest) are native.
      #
      # shell: bash so one script covers Windows + Linux + macOS (bash ships on
      # the Windows runner). curl + openssl are available on all three runners.
      #
      # Secrets: a downloaded desktop exe runs with ASPNETCORE_ENVIRONMENT unset,
      # which defaults to Production. First-run auto-generates the JWT secret, but
      # in Production the connector encryption key is NOT auto-generated and
      # FirstRunBootstrapper.ValidateProductionSecrets hard-fails without it. We
      # therefore pass throwaway Jwt__SecretKey and Connectors__EncryptionKey env
      # vars (generated with openssl; the connector key must base64-decode to
      # exactly 32 bytes per AesCredentialEncryptionService). Supplying the JWT
      # secret also stops first-run from writing appsettings.local.json into the
      # publish dir, and the DB is pointed at a temp dir, so nothing pollutes the
      # archive built in the next step.
      - name: Smoke test published executable
        if: matrix.rid != 'osx-x64'  # cross-arch on the arm64 macOS runner — not launchable there
        shell: bash
        run: |
          set -euo pipefail

          PORT=5099
          URL="http://127.0.0.1:${PORT}"
          PUBLISH_DIR="publish/${{ matrix.rid }}"

          # The published assembly name is Taskdeck.Api (no AssemblyName override);
          # the apphost gets a .exe suffix on Windows only.
          if [ "${RUNNER_OS}" = "Windows" ]; then
            EXE="${PUBLISH_DIR}/Taskdeck.Api.exe"
          else
            EXE="${PUBLISH_DIR}/Taskdeck.Api"
          fi

          if [ ! -f "$EXE" ]; then
            echo "::error::Published executable not found at $EXE"
            ls -la "$PUBLISH_DIR" || true
            exit 1
          fi
          chmod +x "$EXE" 2>/dev/null || true

          # Isolated temp data dir so no SQLite file lands in the publish output.
          SMOKE_DATA_DIR="$(mktemp -d 2>/dev/null || mktemp -d -t taskdeck-smoke)"
          # .NET needs a native path for the connection string on Windows; the
          # MSYS path from mktemp (/tmp/...) is meaningless to the Win32 process.
          if [ "${RUNNER_OS}" = "Windows" ]; then
            DB_DIR="$(cygpath -w "${SMOKE_DATA_DIR}")"
          else
            DB_DIR="${SMOKE_DATA_DIR}"
          fi

          # Throwaway secrets (never reused, discarded with the temp dir).
          SMOKE_JWT_SECRET="$(openssl rand -base64 48 | tr -d '\n')"
          SMOKE_CONNECTOR_KEY="$(openssl rand -base64 32 | tr -d '\n')"

          APP_PID=""
          LOG="${SMOKE_DATA_DIR}/app.log"
          cleanup() {
            if [ -n "${APP_PID}" ]; then
              kill "${APP_PID}" 2>/dev/null || true
            fi
            if [ "${RUNNER_OS}" = "Windows" ]; then
              # MSYS->Win32 PID mapping can miss; make sure the apphost is gone.
              taskkill //F //IM Taskdeck.Api.exe 2>/dev/null || true
            fi
            rm -rf "${SMOKE_DATA_DIR}" 2>/dev/null || true
          }
          trap cleanup EXIT

          EXE_NAME="$(basename "$EXE")"
          echo "Launching ${EXE_NAME} (cwd=${PUBLISH_DIR}) on ${URL} (data dir: ${SMOKE_DATA_DIR})"
          # Run with the publish dir as the working directory so ASP.NET Core resolves the
          # content root there and serves wwwroot/index.html + appsettings.json — exactly as
          # an end user runs the extracted exe (the content root defaults to the CWD, not the
          # exe folder). The DB + log use absolute temp paths, so the publish dir (archived in
          # the next step) stays clean. `exec` replaces the subshell with the apphost so $! is
          # the real process PID for a clean kill.
          (
            cd "$PUBLISH_DIR"
            ASPNETCORE_URLS="${URL}" \
            ConnectionStrings__DefaultConnection="Data Source=${DB_DIR}/taskdeck-smoke.db" \
            Jwt__SecretKey="${SMOKE_JWT_SECRET}" \
            Connectors__EncryptionKey="${SMOKE_CONNECTOR_KEY}" \
            FirstRun__AutoOpenBrowser="false" \
            exec "./${EXE_NAME}"
          ) > "$LOG" 2>&1 &
          APP_PID=$!
          echo "Started PID ${APP_PID}"

          # Poll /health/ready (DB migrated + reachable, workers heartbeating).
          # -f makes curl non-zero on any non-2xx (e.g. a 503 NotReady), so the
          # loop only breaks once the app reports fully Ready. Bounded to ~60s.
          READY=0
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null --max-time 5 "${URL}/health/ready"; then
              READY=1
              echo "health/ready returned success after ~${i}s"
              break
            fi
            # Fast-fail if the process already died (skip on Windows where the
            # MSYS->Win32 PID mapping makes kill -0 unreliable; fall through to
            # the timeout instead of a false negative).
            if [ "${RUNNER_OS}" != "Windows" ] && ! kill -0 "${APP_PID}" 2>/dev/null; then
              echo "::error::Taskdeck process exited before /health/ready became ready"
              echo "--- app log (tail) ---"; tail -n 60 "$LOG" || true
              exit 1
            fi
            sleep 1
          done

          if [ "${READY}" -ne 1 ]; then
            echo "::error::/health/ready did not return success within 60s"
            echo "--- app log (tail) ---"; tail -n 60 "$LOG" || true
            exit 1
          fi

          # GET / must serve the SPA shell (same-origin index.html from wwwroot, HTTP 200).
          ROOT_BODY="${SMOKE_DATA_DIR}/root.html"
          ROOT_CODE="$(curl -s -o "$ROOT_BODY" -w '%{http_code}' --max-time 10 "${URL}/" || echo 000)"
          if [ "$ROOT_CODE" = "200" ] && grep -qiE '<div id="app"|<!doctype html' "$ROOT_BODY"; then
            echo "GET / served the SPA index.html (HTTP 200) — smoke test passed for ${{ matrix.rid }}"
          else
            echo "::error::GET / did not serve the SPA index.html (HTTP ${ROOT_CODE})"
            # Diagnostics: separate "the SPA is not served at all" from "only the bare root / fails"
            # (e.g. the root path 401ing under the global auth fallback policy) so the failure is actionable.
            echo "  diag: GET /index.html      -> $(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "${URL}/index.html")"
            echo "  diag: GET /board (SPA nav) -> $(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "${URL}/board")"
            echo "--- first 500 chars of GET / body ---"; head -c 500 "$ROOT_BODY" 2>/dev/null || true; echo
            echo "--- app log (tail) ---"; tail -n 60 "$LOG" || true
            exit 1
          fi

      # The version tag is resolved ONCE in `resolve-source` (grammar-validated
      # there) and reaches these steps through `env:`, never as raw shell source.
      # A bare workflow_dispatch (no tag input, run from a branch) is the REHEARSAL
      # path: it builds, smoke-tests and packages as `v0.0.0-dryrun+<sha7>` and
      # publishes nothing (`#1123`).
      - name: Package artifact (zip — Windows)
        if: matrix.archive_ext == 'zip'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.resolve-source.outputs.tag }}
          RELEASE_RID: ${{ matrix.rid }}
        run: |
          Compress-Archive -Path "publish/${env:RELEASE_RID}/*" `
            -DestinationPath "taskdeck-${env:RELEASE_TAG}-${env:RELEASE_RID}.zip"

      - name: Package artifact (tar.gz — Linux/macOS)
        if: matrix.archive_ext == 'tar.gz'
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.resolve-source.outputs.tag }}
          RELEASE_RID: ${{ matrix.rid }}
        run: |
          set -euo pipefail
          tar -czf "taskdeck-${RELEASE_TAG}-${RELEASE_RID}.tar.gz" \
            -C "publish/${RELEASE_RID}" .

      - name: Generate SHA256 checksum
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.resolve-source.outputs.tag }}
          RELEASE_RID: ${{ matrix.rid }}
          ARCHIVE_EXT: ${{ matrix.archive_ext }}
        run: |
          set -euo pipefail
          ARCHIVE="taskdeck-${RELEASE_TAG}-${RELEASE_RID}.${ARCHIVE_EXT}"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$ARCHIVE" > "${ARCHIVE}.sha256"
          else
            shasum -a 256 "$ARCHIVE" > "${ARCHIVE}.sha256"
          fi

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.rid }}
          path: |
            taskdeck-${{ needs.resolve-source.outputs.tag }}-${{ matrix.rid }}.${{ matrix.archive_ext }}
            taskdeck-${{ needs.resolve-source.outputs.tag }}-${{ matrix.rid }}.${{ matrix.archive_ext }}.sha256
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Create GitHub Release with all platform artifacts
  # ---------------------------------------------------------------------------
  create-release:
    name: Create GitHub Release
    needs: [resolve-source, build-backend]
    # Publish ONLY for a real release: a tag push, or a dispatch that names an existing tag.
    # A bare dispatch is a rehearsal and must stop after artifacts — without this guard it
    # reached `gh release create` and failed there, which is not a safe place to rely on.
    # `publish` is decided in resolve-source, alongside the grammar check.
    if: needs.resolve-source.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # Pinned to the resolved release commit, and credentials are NOT persisted:
      # every write here goes through `gh` with an explicit GH_TOKEN.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-source.outputs.sha }}
          persist-credentials: false

      - name: Verify checkout matches the resolved release commit
        shell: bash
        env:
          EXPECTED_SHA: ${{ needs.resolve-source.outputs.sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          if [ "${actual_sha}" != "${EXPECTED_SHA}" ]; then
            printf '::error::Checkout HEAD %s does not match the resolved release commit %s.\n' \
              "${actual_sha}" "${EXPECTED_SHA}"
            exit 1
          fi
          printf 'Release source commit verified: %s\n' "${actual_sha}"

      # NOT artifacts/ — the repo tracks an artifacts/ directory (artifacts/openapi), so the
      # checkout above already populates it; downloading into it merged repo content into the
      # release glob and `gh release create artifacts/*` failed on the directory ("read
      # artifacts/openapi: is a directory", v0.1.0 run 32211340173). Rehearsals skip this job,
      # so only a real tag push could surface it.
      - name: Download all release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets/

      - name: Verify checksums
        shell: bash
        working-directory: release-assets
        run: |
          set -euo pipefail
          echo "=== Release artifacts ==="
          ls -la
          echo ""
          echo "=== SHA256 checksums ==="
          cat ./*.sha256
          echo ""
          echo "=== Verifying checksums ==="
          sha256sum -c ./*.sha256

      # Release evidence: the resolved commit ships WITH the assets, so anyone
      # holding a downloaded archive can tie it back to one commit and one run.
      - name: Write release provenance asset
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.resolve-source.outputs.tag }}
          RELEASE_SHA: ${{ needs.resolve-source.outputs.sha }}
        run: |
          set -euo pipefail
          provenance="release-assets/taskdeck-${RELEASE_TAG}-provenance.txt"
          {
            printf 'Taskdeck release provenance\n'
            printf 'tag: %s\n' "${RELEASE_TAG}"
            printf 'commit: %s\n' "${RELEASE_SHA}"
            printf 'repository: %s\n' "${GITHUB_REPOSITORY}"
            printf 'workflow: %s\n' "${GITHUB_WORKFLOW}"
            printf 'run: %s/%s/actions/runs/%s\n' "${GITHUB_SERVER_URL}" "${GITHUB_REPOSITORY}" "${GITHUB_RUN_ID}"
            printf 'run attempt: %s\n' "${GITHUB_RUN_ATTEMPT}"
          } > "${provenance}"
          cat "${provenance}"
          cat "${provenance}" >> "${GITHUB_STEP_SUMMARY}"

      # Re-check server-side, immediately before publishing, that the tag still
      # points at the commit that was actually built. A tag moved mid-run must
      # not silently publish stale bytes.
      - name: Verify the release tag still points at the built commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.resolve-source.outputs.tag }}
          RELEASE_SHA: ${{ needs.resolve-source.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${RELEASE_TAG}" --jq '.sha')"
          if [ "${current_sha}" != "${RELEASE_SHA}" ]; then
            printf '::error::Tag %s now resolves to %s but the artifacts were built from %s. Refusing to publish.\n' \
              "${RELEASE_TAG}" "${current_sha}" "${RELEASE_SHA}"
            exit 1
          fi
          printf 'Tag %s still resolves to the built commit %s.\n' "${RELEASE_TAG}" "${current_sha}"

      # -----------------------------------------------------------------------
      # Resumable publish (#1806)
      #
      # `gh release create <tag> <assets...>` is all-or-nothing: the v0.1.0 run
      # created release 372777600, died mid-upload and rolled the release back,
      # leaving nothing and forcing a manual completion from the run artifacts.
      # The publish is therefore split into three idempotent phases:
      #   1. create a DRAFT (or adopt whatever a previous attempt left behind),
      #   2. upload each asset with `--clobber` and bounded retries,
      #   3. flip the draft to published only once every asset is up.
      # A re-run at any point resumes instead of restarting, and a failure never
      # leaves a published release with missing assets.
      # -----------------------------------------------------------------------
      - name: Create or adopt draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.resolve-source.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            printf 'Release %s already exists — adopting it; assets are re-uploaded with --clobber.\n' "${RELEASE_TAG}"
          else
            gh release create "${RELEASE_TAG}" \
              --draft \
              --title "Taskdeck ${RELEASE_TAG}" \
              --generate-notes \
              --verify-tag
            printf 'Draft release %s created.\n' "${RELEASE_TAG}"
          fi

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.resolve-source.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(release-assets/*)
          if [ "${#assets[@]}" -eq 0 ]; then
            printf '::error::No release assets found under release-assets/.\n'
            exit 1
          fi
          for asset in "${assets[@]}"; do
            # Directories are the v0.1.0 failure mode ("is a directory"); refuse
            # them loudly rather than letting gh fail deep inside the upload.
            if [ ! -f "${asset}" ]; then
              printf '::error::Refusing to upload %s — not a regular file.\n' "${asset}"
              exit 1
            fi
          done
          for asset in "${assets[@]}"; do
            uploaded=0
            for attempt in 1 2 3; do
              if gh release upload "${RELEASE_TAG}" "${asset}" --clobber; then
                uploaded=1
                printf 'Uploaded %s (attempt %s).\n' "${asset}" "${attempt}"
                break
              fi
              printf '::warning::Upload of %s failed (attempt %s/3); retrying.\n' "${asset}" "${attempt}"
              sleep "$((attempt * 10))"
            done
            if [ "${uploaded}" -ne 1 ]; then
              printf '::error::Failed to upload %s after 3 attempts; the release stays a draft.\n' "${asset}"
              exit 1
            fi
          done
          printf 'All %s release assets uploaded.\n' "${#assets[@]}"

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.resolve-source.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh release edit "${RELEASE_TAG}" --draft=false
          printf 'Published release %s.\n' "${RELEASE_TAG}"
