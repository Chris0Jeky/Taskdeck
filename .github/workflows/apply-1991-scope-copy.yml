name: Apply issue 1991 scoped Inbox copy

on:
  push:
    branches:
      - fix/1991-board-scoped-inbox-counts

permissions:
  contents: write

concurrency:
  group: apply-1991-scope-copy
  cancel-in-progress: true

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/1991-board-scoped-inbox-counts
          fetch-depth: 0

      - name: Qualify board-scoped Inbox counts
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              Path('frontend/taskdeck-web/src/views/paper/PaperInboxView.vue'): [(
                  "                : $t(\n                    'inbox.eyebrow',\n                    { pending: pendingTriageCount, total: capturedCount },\n                    capturedCount,\n                  )",
                  "                : $t(\n                    activeBoardId ? 'inbox.eyebrowScoped' : 'inbox.eyebrow',\n                    {\n                      board: activeBoardName,\n                      pending: pendingTriageCount,\n                      total: capturedCount,\n                    },\n                    capturedCount,\n                  )",
              )],
              Path('frontend/taskdeck-web/src/locales/en/inbox.ts'): [(
                  "  eyebrow:\n    'Inbox · capture surface · {pending} awaiting triage · {total} captured | Inbox · capture surface · {pending} awaiting triage · {total} captured',",
                  "  eyebrow:\n    'Inbox · capture surface · {pending} awaiting triage · {total} captured | Inbox · capture surface · {pending} awaiting triage · {total} captured',\n  eyebrowScoped:\n    'Inbox · {board} · {pending} awaiting triage · {total} captured on this board | Inbox · {board} · {pending} awaiting triage · {total} captured on this board',",
              )],
              Path('frontend/taskdeck-web/src/locales/it/inbox.ts'): [(
                  "  eyebrow:\n    'Inbox · superficie di cattura · {pending} da smistare · {total} catturato | Inbox · superficie di cattura · {pending} da smistare · {total} catturati',",
                  "  eyebrow:\n    'Inbox · superficie di cattura · {pending} da smistare · {total} catturato | Inbox · superficie di cattura · {pending} da smistare · {total} catturati',\n  eyebrowScoped:\n    'Inbox · {board} · {pending} da smistare · {total} catturato in questa bacheca | Inbox · {board} · {pending} da smistare · {total} catturati in questa bacheca',",
              )],
              Path('frontend/taskdeck-web/src/locales/es/inbox.ts'): [(
                  "  eyebrow:\n    'Inbox · superficie de captura · {pending} por clasificar · {total} capturada | Inbox · superficie de captura · {pending} por clasificar · {total} capturadas',",
                  "  eyebrow:\n    'Inbox · superficie de captura · {pending} por clasificar · {total} capturada | Inbox · superficie de captura · {pending} por clasificar · {total} capturadas',\n  eyebrowScoped:\n    'Inbox · {board} · {pending} por clasificar · {total} capturada en este tablero | Inbox · {board} · {pending} por clasificar · {total} capturadas en este tablero',",
              )],
          }

          for path, path_replacements in replacements.items():
              text = path.read_text(encoding='utf-8')
              for old, new in path_replacements:
                  count = text.count(old)
                  if count != 1:
                      raise RuntimeError(f'Expected one anchor in {path}, found {count}')
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')

      - name: Commit scoped wording and remove helper
        run: |
          git diff --check
          git rm .github/workflows/apply-1991-scope-copy.yml
          test "$(git diff HEAD --name-only | sort | tr '\n' ' ')" = ".github/workflows/apply-1991-scope-copy.yml frontend/taskdeck-web/src/locales/en/inbox.ts frontend/taskdeck-web/src/locales/es/inbox.ts frontend/taskdeck-web/src/locales/it/inbox.ts frontend/taskdeck-web/src/views/paper/PaperInboxView.vue "
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/taskdeck-web/src/views/paper/PaperInboxView.vue \
            frontend/taskdeck-web/src/locales/en/inbox.ts \
            frontend/taskdeck-web/src/locales/it/inbox.ts \
            frontend/taskdeck-web/src/locales/es/inbox.ts
          git commit -m 'fix: label board-scoped Inbox counts'
          git push origin 'HEAD:fix/1991-board-scoped-inbox-counts'
