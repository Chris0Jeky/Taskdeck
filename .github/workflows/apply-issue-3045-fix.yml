name: Apply issue 3045 fix

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/testing-3045-pwsh7-inventory'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply exact reserved-variable rename
        shell: python
        run: |
          from pathlib import Path

          path = Path("scripts/github/Invoke-TaskdeckReadOnlyInventory.ps1")
          text = path.read_text(encoding="utf-8")
          replacements = {
              "$isWindows = [System.Environment]::OSVersion.Platform -eq [System.PlatformID]::Win32NT":
                  "$runningOnWindows = [System.Environment]::OSVersion.Platform -eq [System.PlatformID]::Win32NT",
              '(-not $isWindows -or $extension -eq ".exe")':
                  '(-not $runningOnWindows -or $extension -eq ".exe")',
          }

          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one occurrence of {old!r}, found {count}")
              text = text.replace(old, new)

          path.write_text(text, encoding="utf-8", newline="\n")

      - name: Commit exact fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/github/Invoke-TaskdeckReadOnlyInventory.ps1
          git diff --cached --check
          git commit -m "fix(scripts): avoid reserved PowerShell 7 variable"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
