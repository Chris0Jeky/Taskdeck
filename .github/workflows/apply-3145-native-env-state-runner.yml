name: Apply issue 3145 native environment state repair

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/3145-pwsh7-environment-null'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply and verify the bounded repair
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          harness = Path('.github/workflows/apply-3145-native-env-state.yml').read_text(encoding='utf-8').splitlines()
          start = next(index for index, line in enumerate(harness) if line.strip() == "python3 - <<'PY'") + 1
          end = next(index for index in range(start, len(harness)) if harness[index].strip() == 'PY')
          Path('/tmp/apply-3145.py').write_text(dedent('\n'.join(harness[start:end])) + '\n', encoding='utf-8')
          PY

          python3 /tmp/apply-3145.py
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/github/Invoke-TaskdeckReadOnlyInventory.ps1')
          text = path.read_text(encoding='utf-8')
          needle = '              Add-Type -TypeDefinition @"'
          replacement = '              $null = Add-Type -TypeDefinition @"'
          if text.count(needle) != 1:
              raise SystemExit('native environment type initializer boundary is not unique')
          path.write_text(text.replace(needle, replacement), encoding='utf-8', newline='\n')
          PY

          git diff --check
          pwsh -NoLogo -NoProfile -NonInteractive -File scripts/github/Invoke-TaskdeckReadOnlyInventory.ps1 -SelfTest

      - name: Commit the verified implementation and remove bootstrap files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/github/Invoke-TaskdeckReadOnlyInventory.ps1
          git rm .github/workflows/apply-3145-native-env-state.yml
          git rm .github/workflows/apply-3145-native-env-state-runner.yml
          git diff --cached --check
          git commit -m "fix(inventory): preserve exact native environment state"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
