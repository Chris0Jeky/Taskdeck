name: Apply PR 3155 escaped-run context repair

on:
  push:
    branches:
      - fix/3119-doc-link-parser-residuals

permissions:
  contents: write

concurrency:
  group: apply-3155-escaped-run-context-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - name: Checkout exact triggering head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify exact triggering head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.13.1"

      - name: Add the public-parser regression
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/check-doc-links.residuals.test.mjs')
          source = path.read_text(encoding='utf-8').replace('\r\n', '\n')
          anchor = "test(\n  'adversarial unmatched delimiter and label input stays within a bounded scan time',"
          if source.count(anchor) != 1:
              raise SystemExit(f'expected one adversarial-test anchor, found {source.count(anchor)}')
          regression = r"""test('escaped backtick runs after an unmatched opener cannot mask a visible link', () => {
            withFixture(
              {
                'docs/index.md': 'Before ```unmatched \\` [visible](./missing.md) \\` end\n',
              },
              (root) => {
                assert.deepEqual(compact(findMaskingDiagnostics(root)), [
                  {
                    file: 'docs/index.md',
                    line: 1,
                    target: '```',
                    reason: 'unbalanced inline code span',
                  },
                ])
                assert.deepEqual(compact(findBrokenLinks(root)), [
                  {
                    file: 'docs/index.md',
                    line: 1,
                    target: './missing.md',
                    reason: 'missing',
                  },
                ])
              },
            )
          })

          """
          regression = '\n'.join(line[10:] if line.startswith('          ') else line for line in regression.splitlines())
          path.write_text(source.replace(anchor, regression + anchor, 1), encoding='utf-8', newline='\n')
          PY
          git diff --check

      - name: Prove the regression is red
        shell: bash
        run: |
          set +e
          node --test --test-name-pattern="escaped backtick runs after an unmatched opener" scripts/check-doc-links.residuals.test.mjs > /tmp/pr-3155-red.log 2>&1
          status=$?
          set -e
          cat /tmp/pr-3155-red.log
          if [ "$status" -eq 0 ]; then
            echo 'Expected the escaped-run context regression to fail before the parser repair.' >&2
            exit 1
          fi
          grep -F './missing.md' /tmp/pr-3155-red.log

      - name: Keep escaped runs literal unless they close an active equal-length span
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/check-doc-links.mjs')
          source = path.read_text(encoding='utf-8').replace('\r\n', '\n')
          old = """function collectBacktickRuns(text, start, end) {
            const runs = []
            let cursor = start
            let openLength = null

            while (cursor < end) {
              const candidate = text.indexOf('`', cursor)
              if (candidate === -1 || candidate >= end) break
              if (isEscaped(text, candidate) && openLength === null) {
                cursor = candidate + 1
                continue
              }

              const length = backtickRunLength(text, candidate)
              runs.push({ start: candidate, length })
              if (openLength === null) openLength = length
              else if (openLength === length) openLength = null
              cursor = candidate + length
            }

            return runs
          }
          """
          old = '\n'.join(line[10:] if line.startswith('          ') else line for line in old.splitlines()) + '\n'
          new = """function collectBacktickRuns(text, start, end) {
            const runs = []
            let cursor = start

            while (cursor < end) {
              const candidate = text.indexOf('`', cursor)
              if (candidate === -1 || candidate >= end) break

              const length = backtickRunLength(text, candidate)
              runs.push({
                start: candidate,
                length,
                escaped: isEscaped(text, candidate),
              })
              cursor = candidate + length
            }

            return runs
          }
          """
          new = '\n'.join(line[10:] if line.startswith('          ') else line for line in new.splitlines()) + '\n'
          if source.count(old) != 1:
              raise SystemExit(f'expected one collectBacktickRuns implementation, found {source.count(old)}')
          source = source.replace(old, new, 1)

          old_loop = """  while (index < runs.length) {
              const opening = runs[index]
              const closingIndex = nextSameLength[index]
          """
          old_loop = '\n'.join(line[10:] if line.startswith('          ') else line for line in old_loop.splitlines())
          new_loop = """  while (index < runs.length) {
              const opening = runs[index]
              // Outside a code span, a backslash-escaped run is literal and cannot open one.
              // Once an unescaped opener exists, nextSameLength may still select an escaped-looking
              // equal-length run as its closer because backslashes are literal inside code spans.
              if (opening.escaped) {
                index += 1
                continue
              }

              const closingIndex = nextSameLength[index]
          """
          new_loop = '\n'.join(line[10:] if line.startswith('          ') else line for line in new_loop.splitlines())
          if source.count(old_loop) != 1:
              raise SystemExit(f'expected one inline-code pairing loop, found {source.count(old_loop)}')
          path.write_text(source.replace(old_loop, new_loop, 1), encoding='utf-8', newline='\n')
          PY

      - name: Verify focused and complete link-checker contracts
        shell: bash
        run: |
          set -euo pipefail
          node --test scripts/check-doc-links.residuals.test.mjs scripts/check-doc-links.test.mjs scripts/check-doc-links.html-quoted-attributes.test.mjs
          node scripts/check-doc-links.mjs
          git diff --check

      - name: Publish the exact-parent repair and remove this applicator
        shell: bash
        run: |
          set -euo pipefail
          branch='fix/3119-doc-link-parser-residuals'
          trigger_head="$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$trigger_head"
          remote_head="$(git ls-remote --heads origin "refs/heads/$branch" | awk '{print $1}')"
          test -n "$remote_head"
          test "$remote_head" = "$trigger_head"

          git rm .github/workflows/apply-3155-escaped-run-context.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/check-doc-links.mjs scripts/check-doc-links.residuals.test.mjs
          git diff --cached --check

          expected_names=$'.github/workflows/apply-3155-escaped-run-context.yml\nscripts/check-doc-links.mjs\nscripts/check-doc-links.residuals.test.mjs'
          actual_names="$(git diff --cached --name-only | sort)"
          test "$actual_names" = "$expected_names"

          tree="$(git write-tree)"
          repair_commit="$(printf '%s\n' 'fix(docs): keep escaped backticks outside unmatched spans' | git commit-tree "$tree" -p "$trigger_head")"
          test "$(git rev-parse "$repair_commit^")" = "$trigger_head"
          git push --force-with-lease="refs/heads/$branch:$trigger_head" origin "$repair_commit:refs/heads/$branch"
