name: Apply PR 3173 archived comment retry repair

'on':
  push:
    branches:
      - fix/2129-honest-comment-load-state
    paths:
      - .github/workflows/pr3173-archived-comment-retry.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/2129-honest-comment-load-state
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.1
          cache: npm
          cache-dependency-path: frontend/taskdeck-web/package-lock.json

      - name: Move the comment surface outside the write-disabled fieldset
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('frontend/taskdeck-web/src/components/board/CardModal.vue')
          lines = path.read_text(encoding='utf-8').splitlines()
          comments_start = next(i for i, line in enumerate(lines) if line.strip() == '<CardModalComments')
          metadata_start = next(i for i, line in enumerate(lines[comments_start + 1:], comments_start + 1) if line.strip() == '<CardModalMetadata')
          fieldset_close = next(i for i, line in enumerate(lines[metadata_start + 1:], metadata_start + 1) if line.strip() == '</fieldset>')

          comments = lines[comments_start:metadata_start]
          if any('writes-disabled=' in line for line in comments):
              raise SystemExit('CardModalComments already has the explicit write guard')
          get_replies = next(i for i, line in enumerate(comments) if ':get-replies-fn=' in line)
          comments.insert(get_replies + 1, '            :writes-disabled="cardIsArchived || isSaving || editorWritesBlocked"')
          metadata = lines[metadata_start:fieldset_close]

          replacement = [
              '        </fieldset>',
              '',
              '        <div class="space-y-4">',
              *comments,
              *metadata,
              '        </div>',
          ]
          updated = lines[:comments_start] + replacement + lines[fieldset_close + 1:]
          path.write_text('\n'.join(updated) + '\n', encoding='utf-8')
          PY

      - name: Verify the focused comment-load and type contracts
        working-directory: frontend/taskdeck-web
        run: |
          npm ci
          npx vitest run src/tests/components/CardModalCommentLoadState.spec.ts
          npm run type-check

      - name: Publish the layout repair and remove this helper
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/pr3173-archived-comment-retry.yml
          git add frontend/taskdeck-web/src/components/board/CardModal.vue
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(comments): keep archived read retry operable"
          git push origin HEAD:fix/2129-honest-comment-load-state
