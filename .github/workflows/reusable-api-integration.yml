name: Reusable API Integration

on:
  workflow_call:
    inputs:
      dotnet-version:
        description: .NET SDK version used for API integration tests
        required: false
        default: "8.0.x"
        type: string

permissions:
  contents: read

env:
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  api-integration:
    name: API Integration (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet-version }}
          cache: true
          cache-dependency-path: |
            backend/Taskdeck.sln
            backend/**/*.csproj

      - name: Restore backend
        run: dotnet restore backend/Taskdeck.sln

      - name: Run API integration tests
        run: dotnet test backend/tests/Taskdeck.Api.Tests/Taskdeck.Api.Tests.csproj --configuration Release --no-restore --logger "trx;LogFileName=api-integration.trx" --results-directory "backend/TestResults/api-integration/${{ matrix.os }}"

      - name: Upload API integration test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: api-integration-trx-${{ matrix.os }}
          path: backend/TestResults/api-integration/${{ matrix.os }}
          if-no-files-found: ignore
