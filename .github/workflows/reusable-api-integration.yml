name: Reusable API Integration

on:
  workflow_call:
    inputs:
      dotnet-version:
        description: .NET SDK version used for API integration tests
        required: false
        default: "8.0.x"
        type: string

permissions:
  contents: read

env:
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  api-integration:
    name: API Integration (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ inputs.dotnet-version }}
          cache: true
          cache-dependency-path: |
            backend/Taskdeck.sln
            backend/**/*.csproj
            backend/Directory.Packages.props

      - name: Restore backend
        run: dotnet restore backend/Taskdeck.sln

      - name: Run API integration tests
        id: api-integration-tests
        run: dotnet test backend/tests/Taskdeck.Api.Tests/Taskdeck.Api.Tests.csproj --configuration Release --no-restore --logger "trx;LogFileName=api-integration.trx" --results-directory "backend/TestResults/api-integration/${{ matrix.os }}"

      - name: Summarize API integration timing
        if: always()
        run: python scripts/ci/summarize_trx_timing.py --trx "backend/TestResults/api-integration/${{ matrix.os }}/api-integration.trx" --output "backend/TestResults/api-integration/${{ matrix.os }}/api-integration-timing.json"

      - name: Upload API integration timing summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-integration-timing-${{ matrix.os }}
          path: backend/TestResults/api-integration/${{ matrix.os }}/api-integration-timing.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload API integration test results
        if: ${{ always() && steps.api-integration-tests.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: api-integration-trx-${{ matrix.os }}
          path: backend/TestResults/api-integration/${{ matrix.os }}/*.trx
          if-no-files-found: ignore
