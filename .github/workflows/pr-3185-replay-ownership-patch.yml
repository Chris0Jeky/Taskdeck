name: Apply PR 3185 replay ownership patch

on:
  push:
    branches:
      - fix/2127-capture-replay-metadata-ownership
    paths:
      - .github/workflows/pr-3185-replay-ownership-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/2127-capture-replay-metadata-ownership
          fetch-depth: 0

      - name: Apply bounded replay ownership repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source_path = Path('backend/src/Taskdeck.Application/Services/CaptureTriageService.cs')
          source = source_path.read_text(encoding='utf-8')
          replacement_path = Path('.github/patches/pr-3185-reconciliation-block.txt')
          replacement = replacement_path.read_text(encoding='utf-8')
          replacement = replacement.replace(
              '? Result.Success(originalOperations)',
              '? Result.Success<IReadOnlyList<ProposalOperationDto>>(originalOperations)')
          replacement = replacement.replace(
              'return Result.Success(originalOperations);',
              'return Result.Success<IReadOnlyList<ProposalOperationDto>>(originalOperations);')
          start_marker = '    /// <summary>\n    /// Repairs the narrow proposal-persisted / capture-provenance-not-stamped crash window.'
          end_marker = '    private static string SerializeRevisionPayload(IReadOnlyList<ProposalOperationDto> operations) =>\n'
          start = source.find(start_marker)
          end = source.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('Could not locate the bounded capture replay reconciliation block.')
          source_path.write_text(source[:start] + replacement + source[end:], encoding='utf-8', newline='\n')
          replacement_path.unlink()
          Path('.github/workflows/pr-3185-replay-ownership-patch.yml').unlink()
          PY

      - name: Verify focused replay and capture triage tests
        shell: bash
        run: |
          dotnet test backend/tests/Taskdeck.Application.Tests/Taskdeck.Application.Tests.csproj -c Release -m:1 --filter "FullyQualifiedName~CaptureTriageReplayMetadataOwnershipTests|FullyQualifiedName~CaptureTriageServiceTests"

      - name: Commit bounded repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/Taskdeck.Application/Services/CaptureTriageService.cs backend/tests/Taskdeck.Application.Tests/Services/CaptureTriageReplayMetadataOwnershipTests.cs .github/patches/pr-3185-reconciliation-block.txt .github/workflows/pr-3185-replay-ownership-patch.yml
          git diff --cached --check
          git commit -m "fix(capture): preserve reviewer metadata during replay"
          git push origin HEAD:fix/2127-capture-replay-metadata-ownership
