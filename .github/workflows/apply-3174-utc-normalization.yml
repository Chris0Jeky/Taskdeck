name: Apply PR 3174 UTC normalization

on:
  push:
    branches:
      - fix/1422-llm-usage-utc-normalization

permissions:
  contents: write

concurrency:
  group: apply-pr-3174-utc-normalization
  cancel-in-progress: true

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/1422-llm-usage-utc-normalization
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: |
            backend/Taskdeck.sln
            backend/**/*.csproj
            backend/Directory.Packages.props

      - name: Normalize SQLite timestamp bounds and writes
        shell: python
        run: |
          from pathlib import Path

          path = Path('backend/src/Taskdeck.Infrastructure/Repositories/LlmUsageRecordRepository.cs')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  'return await GetRequestCountSqliteAsync(userId, surface, from, to, cancellationToken);',
                  'return await GetRequestCountSqliteAsync(\n'
                  '                userId, surface, from.ToUniversalTime(), to.ToUniversalTime(), cancellationToken);',
              ),
              (
                  'return await GetTotalTokensSqliteAsync(userId, surface, from, to, cancellationToken);',
                  'return await GetTotalTokensSqliteAsync(\n'
                  '                userId, surface, from.ToUniversalTime(), to.ToUniversalTime(), cancellationToken);',
              ),
              (
                  'return await GetUsageSummarySqliteAsync(userId, surface, from, to, cancellationToken);',
                  'return await GetUsageSummarySqliteAsync(\n'
                  '                userId, surface, from.ToUniversalTime(), to.ToUniversalTime(), cancellationToken);',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one reporting bind to replace, found {count}: {old}')
              text = text.replace(old, new)

          anchor = '        var surfaceValue = (int)surface;\n'
          normalized = (
              '        // SQLite persists DateTimeOffset values as TEXT, so equivalent instants with\n'
              '        // different offsets must be normalized before lexical comparisons and writes.\n'
              '        hourStart = hourStart.ToUniversalTime();\n'
              '        now = now.ToUniversalTime();\n'
              '        dayStart = dayStart.ToUniversalTime();\n'
              '        dayEnd = dayEnd.ToUniversalTime();\n'
              '        expiresAt = expiresAt.ToUniversalTime();\n\n'
              + anchor
          )
          count = text.count(anchor)
          if count != 1:
              raise SystemExit(f'Expected exactly one SQLite reservation anchor, found {count}.')
          text = text.replace(anchor, normalized)
          path.write_text(text, encoding='utf-8')

      - name: Restore focused test project
        run: dotnet restore backend/tests/Taskdeck.Api.Tests/Taskdeck.Api.Tests.csproj

      - name: Verify UTC normalization regressions
        run: >-
          dotnet test backend/tests/Taskdeck.Api.Tests/Taskdeck.Api.Tests.csproj
          --configuration Release
          --no-restore
          -m:1
          --filter FullyQualifiedName~LlmUsageRecordUtcNormalizationIntegrationTests

      - name: Publish implementation
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git rm .github/workflows/apply-3174-utc-normalization.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/src/Taskdeck.Infrastructure/Repositories/LlmUsageRecordRepository.cs
          git commit -m 'fix: normalize LLM usage SQLite timestamps'
          git push origin HEAD:fix/1422-llm-usage-utc-normalization
