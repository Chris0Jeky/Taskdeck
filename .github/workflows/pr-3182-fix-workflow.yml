name: Repair PR 3182 patch workflow

on:
  push:
    branches:
      - fix/2181-headless-data-contract
    paths:
      - .github/workflows/pr-3182-fix-workflow.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/2181-headless-data-contract
          fetch-depth: 0

      - name: Pin checkout and remove repair workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/pr-3182-headless-contract-patch.yml')
          text = path.read_text(encoding='utf-8')
          old = 'uses: actions/checkout@v4'
          new = 'uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1'
          if text.count(old) != 1:
              raise SystemExit(f'Expected one unpinned checkout reference, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          rm .github/workflows/pr-3182-fix-workflow.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "ci: pin PR 3182 patch workflow"
          git push origin HEAD:fix/2181-headless-data-contract
