name: PR 3183 strict calendar wire repair

on:
  push:
    branches:
      - fix/1141-display-date-contract
    paths:
      - .github/workflows/pr3183-strict-calendar-wire-repair.yml

permissions:
  contents: write

concurrency:
  group: pr-3183-strict-calendar-wire-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/1141-display-date-contract
          fetch-depth: 0

      - name: Verify repair seed
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "3b3fd83ec9201389b3198744b6df3d346a679fb9"

      - name: Add strict wire regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('frontend/taskdeck-web/src/tests/utils/displayDate.spec.ts')
          text = path.read_text()
          old = """    '2024-13-01T00:00:00+00:00',
              'not-a-date',
          """
          new = """    '2024-13-01T00:00:00+00:00',
              '2024-02-30t00:00:00Z',
              '2024-02-30 00:00:00Z',
              '2024-02-29T00:00:00',
              '2024-02-29T24:00:00Z',
              '2024-02-29T00:60:00Z',
              '2024-02-29T00:00:00+14:01',
              '2024-02-29T00:00:00+15:00',
              'not-a-date',
          """
          if text.count(old) != 1:
              raise SystemExit('invalid calendar matrix seam did not match exactly once')
          path.write_text(text.replace(old, new))
          PY

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.13.1
          cache: npm
          cache-dependency-path: frontend/taskdeck-web/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend/taskdeck-web
        run: npm ci

      - name: Prove malformed wire regression is red
        shell: bash
        working-directory: frontend/taskdeck-web
        run: |
          set -euo pipefail
          set +e
          npx vitest --run src/tests/utils/displayDate.spec.ts \
            -t "returns null for invalid calendar input" \
            --maxWorkers=2 > /tmp/pr3183-red.log 2>&1
          status=$?
          set -e
          cat /tmp/pr3183-red.log
          test "$status" -ne 0
          grep -F "2024-02-30t00:00:00Z" /tmp/pr3183-red.log

      - name: Apply strict DateTimeOffset grammar
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('frontend/taskdeck-web/src/utils/displayDate.ts')
          text = path.read_text()
          old_constant = "const ISO_CALENDAR_PREFIX = /^(\\d{4}-\\d{2}-\\d{2})T/\n"
          new_constant = (
              "const ISO_DATE_TIME_OFFSET = /^(\\d{4}-\\d{2}-\\d{2})T"
              "(?:[01]\\d|2[0-3]):[0-5]\\d:[0-5]\\d"
              "(?:\\.\\d{1,7})?(?:Z|[+-](?:(?:0\\d|1[0-3]):[0-5]\\d|14:00))$/\n"
          )
          if text.count(old_constant) != 1:
              raise SystemExit('ISO calendar prefix constant did not match exactly once')
          text = text.replace(old_constant, new_constant)

          old_block = """  // V8 normalizes impossible ISO components (for example, February 30) into a
            // different valid instant. Validate the wire form's stated calendar day
            // before Date parsing so the adapter preserves its invalid-input contract.
            const isoCalendarPrefix = ISO_CALENDAR_PREFIX.exec(normalized)?.[1]
            if (isoCalendarPrefix && !isCalendarDateKey(isoCalendarPrefix)) return null

            return toCalendarDateKey(normalized)
          """
          new_block = """  // Accept only the documented DateTimeOffset compatibility form. Passing
            // arbitrary parseable strings to Date would normalize impossible dates, accept
            // offset-less local datetimes, and reintroduce timezone-dependent calendar days.
            const isoDateTimeOffset = ISO_DATE_TIME_OFFSET.exec(normalized)
            if (!isoDateTimeOffset) return null

            const statedCalendarKey = isoDateTimeOffset[1]
            if (!statedCalendarKey || !isCalendarDateKey(statedCalendarKey)) return null

            return toCalendarDateKey(normalized)
          """
          if text.count(old_block) != 1:
              raise SystemExit('calendar wire parsing block did not match exactly once')
          path.write_text(text.replace(old_block, new_block))
          PY

      - name: Verify display-date contract
        shell: bash
        working-directory: frontend/taskdeck-web
        run: |
          set -euo pipefail
          npx vitest --run src/tests/utils/displayDate.spec.ts --maxWorkers=2
          npm run typecheck
          npm run lint

      - name: Commit repair and remove helper
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/pr3183-strict-calendar-wire-repair.yml
          git add -A
          git diff --cached --check
          git config user.name "Cristian Tcaci"
          git config user.email "59696583+Chris0Jeky@users.noreply.github.com"
          git commit -s -m "fix: reject malformed calendar wire values"
          git push origin HEAD:refs/heads/fix/1141-display-date-contract
