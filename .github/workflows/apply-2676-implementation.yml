name: Apply issue 2676 implementation

on:
  push:
    branches:
      - fix/2676-fsmonitor-cleanup-residuals

permissions:
  contents: write

concurrency:
  group: apply-2676-implementation
  cancel-in-progress: true

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-slim
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/2676-fsmonitor-cleanup-residuals
          fetch-depth: 0

      - name: Add bounded post-stop removal retries
        shell: pwsh
        run: |
          $path = 'scripts/git/Test-New-CodexIssueWorktree.ps1'
          $text = [System.IO.File]::ReadAllText($path).Replace("`r`n", "`n")
          $old = @'
          function Invoke-FsmonitorFixtureStopAndRemove {
              param(
                  [Parameter(Mandatory = $true)]
                  [string]$FixtureRoot,

                  [Parameter(Mandatory = $true)]
                  [string]$CleanupRoot,

                  [Parameter(Mandatory = $true)]
                  [string]$GitExecutable,

                  [string[]]$GitExecutablePrefixArguments = @()
              )

              $stopArguments = @($GitExecutablePrefixArguments) + @(
                  "-C",
                  $FixtureRoot,
                  "fsmonitor--daemon",
                  "stop"
              )
              $stopResult = Invoke-ProcessCapture -FilePath $GitExecutable -Arguments $stopArguments -WorkingDirectory $FixtureRoot
              if ($stopResult.ExitCode -ne 0) {
                  throw "Fixture-owned fsmonitor daemon stop failed (exit $($stopResult.ExitCode)): git -C $FixtureRoot fsmonitor--daemon stop`n$($stopResult.Output)"
              }

              if (Test-Path -LiteralPath $CleanupRoot) {
                  Get-ChildItem -LiteralPath $CleanupRoot -Recurse -Force -File | ForEach-Object { $_.IsReadOnly = $false }
                  Remove-Item -LiteralPath $CleanupRoot -Recurse -Force
              }
          }
          '@
          $new = @'
          function Invoke-FsmonitorFixtureStopAndRemove {
              [CmdletBinding()]
              param(
                  [Parameter(Mandatory = $true)]
                  [string]$FixtureRoot,

                  [Parameter(Mandatory = $true)]
                  [string]$CleanupRoot,

                  [Parameter(Mandatory = $true)]
                  [string]$GitExecutable,

                  [string[]]$GitExecutablePrefixArguments = @(),

                  [scriptblock]$RemovalInvoker = {
                      param([string]$LiteralPath)
                      Remove-Item -LiteralPath $LiteralPath -Recurse -Force
                  },

                  [ValidateRange(0, 60000)]
                  [int]$RemovalTimeoutMilliseconds = 5000,

                  [ValidateRange(0, 1000)]
                  [int]$RemovalRetryDelayMilliseconds = 50
              )

              $stopArguments = @($GitExecutablePrefixArguments) + @(
                  "-C",
                  $FixtureRoot,
                  "fsmonitor--daemon",
                  "stop"
              )
              $stopResult = Invoke-ProcessCapture -FilePath $GitExecutable -Arguments $stopArguments -WorkingDirectory $FixtureRoot
              if ($stopResult.ExitCode -ne 0) {
                  throw "Fixture-owned fsmonitor daemon stop failed (exit $($stopResult.ExitCode)): git -C $FixtureRoot fsmonitor--daemon stop`n$($stopResult.Output)"
              }

              if (-not (Test-Path -LiteralPath $CleanupRoot)) {
                  return
              }

              Get-ChildItem -LiteralPath $CleanupRoot -Recurse -Force -File | ForEach-Object { $_.IsReadOnly = $false }
              $stopwatch = [System.Diagnostics.Stopwatch]::StartNew()
              while ($true) {
                  try {
                      & $RemovalInvoker $CleanupRoot
                      if (-not (Test-Path -LiteralPath $CleanupRoot)) {
                          return
                      }
                      throw [System.IO.IOException]::new("Fixture removal returned without removing '$CleanupRoot'.")
                  }
                  catch {
                      $removalFailure = $_
                      $isTransientRemovalFailure =
                          $removalFailure.Exception -is [System.IO.IOException] -or
                          $removalFailure.Exception -is [System.UnauthorizedAccessException]
                      if (-not $isTransientRemovalFailure -or $stopwatch.ElapsedMilliseconds -ge $RemovalTimeoutMilliseconds) {
                          $PSCmdlet.ThrowTerminatingError($removalFailure)
                      }
                  }

                  if ($RemovalRetryDelayMilliseconds -gt 0) {
                      Start-Sleep -Milliseconds $RemovalRetryDelayMilliseconds
                  }
              }
          }
          '@

          $count = ([regex]::Matches($text, [regex]::Escape($old))).Count
          if ($count -ne 1) {
              throw "Expected exactly one cleanup helper to replace, found $count."
          }
          $text = $text.Replace($old, $new)
          [System.IO.File]::WriteAllText($path, $text, [System.Text.UTF8Encoding]::new($false))

      - name: Verify focused cleanup regression
        shell: pwsh
        run: pwsh -NoLogo -NoProfile -NonInteractive -File scripts/git/Test-New-CodexIssueWorktree.ps1 -Case git-add-failure

      - name: Commit implementation
        shell: pwsh
        run: |
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/git/Test-New-CodexIssueWorktree.ps1
          git commit -m 'fix: retry fsmonitor fixture removal after stop'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin 'HEAD:fix/2676-fsmonitor-cleanup-residuals'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
