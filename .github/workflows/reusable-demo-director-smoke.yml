name: Reusable Demo Director Smoke

on:
  workflow_call:
    inputs:
      dotnet-version:
        description: .NET SDK version used for demo smoke backend setup
        required: false
        default: "8.0.x"
        type: string
      node-version:
        description: Node.js version used for demo smoke frontend setup
        required: false
        default: "24.13.1"
        type: string

permissions:
  contents: read

env:
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  demo-director-smoke:
    name: Demo Director Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet-version }}
          cache: true
          cache-dependency-path: |
            backend/Taskdeck.sln
            backend/**/*.csproj

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: frontend/taskdeck-web/package-lock.json

      - name: Restore backend
        run: dotnet restore backend/Taskdeck.sln

      - name: Install frontend dependencies
        working-directory: frontend/taskdeck-web
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ hashFiles('frontend/taskdeck-web/package-lock.json') }}

      - name: Install Playwright browser
        working-directory: frontend/taskdeck-web
        run: npx playwright install --with-deps chromium

      - name: Run demo director smoke
        timeout-minutes: 12
        working-directory: frontend/taskdeck-web
        env:
          CI: "true"
        run: npm run demo:director:smoke

      - name: Upload demo smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-director-smoke-artifacts
          path: frontend/taskdeck-web/demo-artifacts/ci-smoke
          if-no-files-found: ignore

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: demo-director-playwright-report
          path: frontend/taskdeck-web/playwright-report
          if-no-files-found: ignore

      - name: Upload Playwright test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: demo-director-playwright-results
          path: frontend/taskdeck-web/test-results
          if-no-files-found: ignore
