name: Apply PR 3204 readiness contract

on:
  push:
    branches:
      - fix/1900-vite-lazy-readiness-contract
    paths:
      - .github/workflows/pr-3204-contract-patch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/1900-vite-lazy-readiness-contract
          fetch-depth: 0

      - name: Apply bounded contract patch
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/pr3204_contract_patch.py
          rm .github/scripts/pr3204_contract_patch.py
          rm .github/workflows/pr-3204-contract-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "docs(frontend): define literal lazy-route readiness"
          git push origin HEAD:fix/1900-vite-lazy-readiness-contract
