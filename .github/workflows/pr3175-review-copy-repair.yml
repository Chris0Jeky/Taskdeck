name: PR 3175 qualify scoped Inbox counts

on:
  push:
    branches:
      - fix/1991-board-scoped-inbox-counts
    paths:
      - .github/workflows/pr3175-review-copy-repair.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.repository == 'Chris0Jeky/Taskdeck'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/1991-board-scoped-inbox-counts
          fetch-depth: 0

      - name: Qualify board-scoped counts as displayed rows
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              'frontend/taskdeck-web/src/locales/en/inbox.ts': (
                  "Inbox · {board} · {pending} awaiting triage · {total} captured on this board | Inbox · {board} · {pending} awaiting triage · {total} captured on this board",
                  "Inbox · {board} · Showing {pending} awaiting triage · {total} captured | Inbox · {board} · Showing {pending} awaiting triage · {total} captured",
              ),
              'frontend/taskdeck-web/src/locales/es/inbox.ts': (
                  "Inbox · {board} · {pending} por clasificar · {total} capturada en este tablero | Inbox · {board} · {pending} por clasificar · {total} capturadas en este tablero",
                  "Inbox · {board} · Mostrando {pending} por clasificar · {total} capturada | Inbox · {board} · Mostrando {pending} por clasificar · {total} capturadas",
              ),
              'frontend/taskdeck-web/src/locales/it/inbox.ts': (
                  "Inbox · {board} · {pending} da smistare · {total} catturato in questa bacheca | Inbox · {board} · {pending} da smistare · {total} catturati in questa bacheca",
                  "Inbox · {board} · Visualizzati {pending} da smistare · {total} catturato | Inbox · {board} · Visualizzati {pending} da smistare · {total} catturati",
              ),
          }

          for filename, (old, new) in replacements.items():
              path = Path(filename)
              source = path.read_text(encoding='utf-8')
              if source.count(old) != 1:
                  raise SystemExit(f'{filename}: expected exactly one old scoped message')
              path.write_text(source.replace(old, new), encoding='utf-8')

      - name: Verify focused scoped-count contract
        working-directory: frontend/taskdeck-web
        run: |
          npm ci
          npx vitest run src/tests/views/paper/PaperInboxScopedEyebrow.spec.ts

      - name: Publish repair and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/pr3175-review-copy-repair.yml
          git add frontend/taskdeck-web/src/locales/en/inbox.ts \
            frontend/taskdeck-web/src/locales/es/inbox.ts \
            frontend/taskdeck-web/src/locales/it/inbox.ts
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(inbox): qualify board-scoped loaded counts"
          git push origin HEAD:fix/1991-board-scoped-inbox-counts
