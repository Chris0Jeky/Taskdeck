name: Apply PR 3209 local chat quota repair

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: apply-3209-local-chat-quota-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: true

jobs:
  repair:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/1431-skip-local-chat-quota-reservation'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
      TRIGGER_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout exact pull request branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Verify exact triggering head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TRIGGER_HEAD"

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x

      - name: Restore focused test project
        run: dotnet restore backend/tests/Taskdeck.Application.Tests/Taskdeck.Application.Tests.csproj

      - name: Prove the local checklist regression is red
        shell: bash
        run: |
          set +e
          dotnet test backend/tests/Taskdeck.Application.Tests/Taskdeck.Application.Tests.csproj \
            -c Release -m:1 --no-restore \
            --filter FullyQualifiedName~ChatServiceLocalQuotaBypassTests \
            > /tmp/pr-3209-red.log 2>&1
          status=$?
          set -e
          cat /tmp/pr-3209-red.log
          if [ "$status" -eq 0 ]; then
            echo 'Expected the local checklist quota regression to fail before the ChatService repair.' >&2
            exit 1
          fi
          grep -F 'ChatServiceLocalQuotaBypassTests.SendMessageAsync_ChecklistBootstrapWithoutBoard_DoesNotReserveLlmQuota' /tmp/pr-3209-red.log
          grep -F 'ILlmQuotaService.ReserveAsync' /tmp/pr-3209-red.log

      - name: Reserve only when the request can reach an LLM
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          service_path = Path('backend/src/Taskdeck.Application/Services/ChatService.cs')
          service = service_path.read_text(encoding='utf-8').replace('\r\n', '\n')

          quota_block = (
              '            if (_quotaService != null)\n'
              '            {\n'
              '                var reservation = await _quotaService.ReserveAsync(userId, Domain.Enums.LlmSurface.Chat, ct);\n'
              '                if (!reservation.Allowed)\n'
              '                    return Result.Failure<ChatMessageDto>(ErrorCodes.LlmQuotaExceeded, reservation.DeniedReason ?? "LLM quota exceeded");\n'
              '                quotaReservationId = reservation.ReservationId;\n'
              '                quotaEstimatedTokens = reservation.EstimatedTokens;\n'
              '            }\n'
              '\n'
          )
          if service.count(quota_block) != 1:
              raise SystemExit(f'expected one buffered-chat quota block, found {service.count(quota_block)}')
          service = service.replace(quota_block, '', 1)

          old_comment = '            // Quota and kill switch gate — block before any LLM call\n'
          new_comment = '            // Preserve the kill-switch boundary even for deterministic local chat actions.\n'
          if service.count(old_comment) != 1:
              raise SystemExit(f'expected one chat gate comment, found {service.count(old_comment)}')
          service = service.replace(old_comment, new_comment, 1)

          else_marker = (
              '            else\n'
              '            {\n'
              '                var usedToolCalling = false;\n'
          )
          replacement = (
              '            else\n'
              '            {\n'
              '                // Only requests that can reach a provider consume an LLM quota slot.\n'
              + quota_block.replace('            ', '                ', 1)
              + '                var usedToolCalling = false;\n'
          )
          if service.count(else_marker) != 1:
              raise SystemExit(f'expected one checklist-to-LLM else boundary, found {service.count(else_marker)}')
          service = service.replace(else_marker, replacement, 1)
          service_path.write_text(service, encoding='utf-8', newline='\n')

          tests_path = Path('backend/tests/Taskdeck.Application.Tests/Services/ChatServiceTests.cs')
          tests = tests_path.read_text(encoding='utf-8').replace('\r\n', '\n')
          old_test = '''    [Fact]
              public async Task SendMessageAsync_ShouldReleaseReservation_WhenChecklistBootstrapMakesNoLlmCall()
              {
                  // #1427 re-review: the checklist-bootstrap branch bypasses the LLM entirely, so the reserved
                  // slot was never billed — the finally must RELEASE it (no quota consumed by a no-LLM request).
                  var userId = Guid.NewGuid();
                  var session = new ChatSession(userId, "Bootstrap no-board quota test"); // no BoardId
          
                  _chatSessionRepoMock
                      .Setup(r => r.GetByIdWithMessagesAsync(session.Id, default))
                      .ReturnsAsync(session);
          
                  var reservationId = Guid.NewGuid();
                  var quotaMock = new Mock<ILlmQuotaService>();
                  quotaMock.Setup(q => q.ReserveAsync(userId, Domain.Enums.LlmSurface.Chat, default))
                      .ReturnsAsync(new DTOs.QuotaReservationDto(true, null, reservationId, 10000, 100));
          
                  var serviceWithQuota = new ChatService(
                      _unitOfWorkMock.Object,
                      _llmProviderMock.Object,
                      _plannerMock.Object,
                      _proposalServiceMock.Object,
                      _policyEngineMock.Object,
                      _notificationServiceMock.Object,
                      _authorizationServiceMock.Object,
                      quotaService: quotaMock.Object);
          
                  var result = await serviceWithQuota.SendMessageAsync(
                      session.Id, userId,
                      new SendChatMessageDto("- [ ] first item\\n- [ ] second item", RequestProposal: true),
                      default);
          
                  result.IsSuccess.Should().BeTrue();
                  _llmProviderMock.Verify(
                      p => p.CompleteAsync(It.IsAny<ChatCompletionRequest>(), It.IsAny<CancellationToken>()), Times.Never);
                  quotaMock.Verify(
                      q => q.ReleaseReservationAsync(reservationId, CancellationToken.None), Times.Once);
                  quotaMock.Verify(
                      q => q.CommitReservationAsync(It.IsAny<Guid>(), It.IsAny<Guid>(), It.IsAny<Domain.Enums.LlmSurface>(), It.IsAny<string>(), It.IsAny<string>(), It.IsAny<int>(), It.IsAny<int>(), It.IsAny<CancellationToken>()),
                      Times.Never);
              }
          '''
          old_test = '\n'.join(line[10:] if line.startswith('          ') else line for line in old_test.splitlines()) + '\n'
          new_test = '''    [Fact]
              public async Task SendMessageAsync_ShouldNotReserve_WhenChecklistBootstrapMakesNoLlmCall()
              {
                  // #1431 L3: the checklist-bootstrap branch is fully local. It must not transiently
                  // occupy an LLM quota slot before returning its deterministic result.
                  var userId = Guid.NewGuid();
                  var session = new ChatSession(userId, "Bootstrap no-board quota test"); // no BoardId
          
                  _chatSessionRepoMock
                      .Setup(r => r.GetByIdWithMessagesAsync(session.Id, default))
                      .ReturnsAsync(session);
          
                  var quotaMock = new Mock<ILlmQuotaService>(MockBehavior.Strict);
                  var serviceWithQuota = new ChatService(
                      _unitOfWorkMock.Object,
                      _llmProviderMock.Object,
                      _plannerMock.Object,
                      _proposalServiceMock.Object,
                      _policyEngineMock.Object,
                      _notificationServiceMock.Object,
                      _authorizationServiceMock.Object,
                      quotaService: quotaMock.Object);
          
                  var result = await serviceWithQuota.SendMessageAsync(
                      session.Id, userId,
                      new SendChatMessageDto("- [ ] first item\\n- [ ] second item", RequestProposal: true),
                      default);
          
                  result.IsSuccess.Should().BeTrue();
                  _llmProviderMock.Verify(
                      p => p.CompleteAsync(It.IsAny<ChatCompletionRequest>(), It.IsAny<CancellationToken>()), Times.Never);
                  quotaMock.VerifyNoOtherCalls();
              }
          '''
          new_test = '\n'.join(line[10:] if line.startswith('          ') else line for line in new_test.splitlines()) + '\n'
          if tests.count(old_test) != 1:
              raise SystemExit(f'expected one legacy checklist quota test, found {tests.count(old_test)}')
          tests_path.write_text(tests.replace(old_test, new_test, 1), encoding='utf-8', newline='\n')
          PY

          git diff --check

      - name: Verify local and neighbouring quota regressions
        shell: bash
        run: |
          set -euo pipefail
          dotnet test backend/tests/Taskdeck.Application.Tests/Taskdeck.Application.Tests.csproj \
            -c Release -m:1 --no-restore \
            --filter 'FullyQualifiedName~ChatServiceLocalQuotaBypassTests|FullyQualifiedName~SendMessageAsync_ShouldNotReserve_WhenChecklistBootstrapMakesNoLlmCall|FullyQualifiedName~SendMessageAsync_ShouldReleaseReservation_WhenProviderThrows|FullyQualifiedName~SendMessageAsync_ShouldReleaseReservation_WhenCompletionUsesZeroTokens'

      - name: Publish exact-parent repair and remove applicator
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TRIGGER_HEAD"
          remote_head="$(git ls-remote --heads origin "refs/heads/$PR_HEAD_REF" | awk '{print $1}')"
          test -n "$remote_head"
          test "$remote_head" = "$TRIGGER_HEAD"

          git rm .github/workflows/apply-3209-local-chat-quota.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/src/Taskdeck.Application/Services/ChatService.cs \
            backend/tests/Taskdeck.Application.Tests/Services/ChatServiceTests.cs \
            backend/tests/Taskdeck.Application.Tests/Services/ChatServiceLocalQuotaBypassTests.cs
          git diff --cached --check

          expected_names=$'.github/workflows/apply-3209-local-chat-quota.yml\nbackend/src/Taskdeck.Application/Services/ChatService.cs\nbackend/tests/Taskdeck.Application.Tests/Services/ChatServiceTests.cs'
          actual_names="$(git diff --cached --name-only | sort)"
          test "$actual_names" = "$expected_names"

          tree="$(git write-tree)"
          repair_commit="$(printf '%s\n' 'fix(chat): skip quota for local checklist bootstrap' | git commit-tree "$tree" -p "$TRIGGER_HEAD")"
          test "$(git rev-parse "$repair_commit^")" = "$TRIGGER_HEAD"
          git push --force-with-lease="refs/heads/$PR_HEAD_REF:$TRIGGER_HEAD" origin "$repair_commit:refs/heads/$PR_HEAD_REF"
