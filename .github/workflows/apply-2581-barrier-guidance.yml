name: Apply issue 2581 barrier guidance

on:
  push:
    branches:
      - fix/2581-rekey-revision-unavailable-note

permissions:
  contents: write

concurrency:
  group: apply-2581-barrier-guidance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact triggering head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify exact triggering head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.13.1"
          cache: npm
          cache-dependency-path: frontend/taskdeck-web/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend/taskdeck-web
        run: npm ci

      - name: Prove the poll-driven regression is red
        working-directory: frontend/taskdeck-web
        shell: bash
        run: |
          set +e
          npm test -- src/tests/views/paper/review/PaperReviewView.spec.ts -t "keeps unavailable review guidance with its barrier across revision identity polls" > /tmp/issue-2581-red.log 2>&1
          status=$?
          set -e
          cat /tmp/issue-2581-red.log
          if [ "$status" -eq 0 ]; then
            echo 'Expected the identity-poll regression to fail before the epoch-bound implementation.' >&2
            exit 1
          fi
          grep -F 'the unavailable note must survive same-proposal revision identity polling' /tmp/issue-2581-red.log

      - name: Bind unavailable guidance to the active barrier epoch
        shell: bash
        env:
          PATCH_PAYLOAD: 
        run: |
          python3 - <<'PY'
          import base64
          import os
          import zlib

          source = zlib.decompress(base64.b64decode(os.environ['PATCH_PAYLOAD'])).decode('utf-8')
          exec(compile(source, 'apply-2581-barrier-guidance.py', 'exec'), {})
          PY

      - name: Verify focused regression and type contract
        working-directory: frontend/taskdeck-web
        shell: bash
        run: |
          set -euo pipefail
          npm test -- src/tests/views/paper/review/PaperReviewView.spec.ts -t "keeps unavailable review guidance with its barrier across revision identity polls"
          npm run typecheck
          git -C ../.. diff --check

      - name: Publish one exact-parent implementation commit
        shell: bash
        run: |
          set -euo pipefail
          branch='fix/2581-rekey-revision-unavailable-note'
          trigger_head="$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$trigger_head"

          remote_head="$(git ls-remote --heads origin "refs/heads/$branch" | awk '{print $1}')"
          test -n "$remote_head"
          test "$remote_head" = "$trigger_head"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A

          expected_names=$'.github/workflows/apply-2581-barrier-guidance.yml\nfrontend/taskdeck-web/src/tests/views/paper/review/PaperReviewView.spec.ts\nfrontend/taskdeck-web/src/views/paper/PaperReviewView.vue'
          actual_names="$(git diff --cached --name-only | sort)"
          test "$actual_names" = "$expected_names"

          tree="$(git write-tree)"
          implementation_commit="$(printf '%s\n' 'fix: bind revision refresh guidance to barrier epochs' | git commit-tree "$tree" -p "$trigger_head")"
          test "$(git rev-parse "$implementation_commit^")" = "$trigger_head"
          git push --force-with-lease="refs/heads/$branch:$trigger_head" origin "$implementation_commit:refs/heads/$branch"
