name: Apply PR 3189 deferred create-event patch

on:
  push:
    branches:
      - fix/3073-defer-proposal-create-events
    paths:
      - .github/workflows/pr-3189-branch-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/3073-defer-proposal-create-events
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: backend/packages.lock.json

      - name: Restore application tests
        run: dotnet restore backend/tests/Taskdeck.Application.Tests/Taskdeck.Application.Tests.csproj

      - name: Prove the create-event regression is red before repair
        shell: bash
        run: |
          set +e
          dotnet test backend/tests/Taskdeck.Application.Tests/Taskdeck.Application.Tests.csproj \
            -c Release --no-restore -m:1 \
            --filter "FullyQualifiedName~OperationHandlerCreateNotificationTests" \
            2>&1 | tee "$RUNNER_TEMP/pr-3189-red.log"
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -eq 0 ]; then
            echo "Expected the red-first create notification regression to fail before repair." >&2
            exit 1
          fi
          grep -q "OperationHandlerCreateNotificationTests" "$RUNNER_TEMP/pr-3189-red.log"

      - name: Apply bounded notification-sink repair
        run: python scripts/ci/pr3189_patch.py

      - name: Verify focused proposal execution behavior
        run: >-
          dotnet test backend/tests/Taskdeck.Application.Tests/Taskdeck.Application.Tests.csproj
          -c Release --no-restore -m:1
          --filter "FullyQualifiedName~OperationHandlerCreateNotificationTests|FullyQualifiedName~OperationHandlerRegistryTests|FullyQualifiedName~AutomationExecutorServiceTests"

      - name: Commit bounded repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/Taskdeck.Application/Services/CardService.cs \
            backend/src/Taskdeck.Application/Services/Pipeline/OperationHandlerRegistry.cs \
            .github/workflows/pr-3189-branch-patch.yml \
            scripts/ci/pr3189_patch.py
          git diff --cached --check
          git commit -m "fix(backend): defer proposal card-created events"
          git push origin HEAD:fix/3073-defer-proposal-create-events
