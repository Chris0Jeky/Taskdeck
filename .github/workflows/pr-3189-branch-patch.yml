name: Apply PR 3189 deferred create-event patch

on:
  push:
    branches:
      - fix/3073-defer-proposal-create-events
    paths:
      - .github/workflows/pr-3189-branch-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/3073-defer-proposal-create-events
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: backend/packages.lock.json

      - name: Restore application tests
        run: dotnet restore backend/tests/Taskdeck.Application.Tests/Taskdeck.Application.Tests.csproj

      - name: Prove the create-event regression is red before repair
        shell: bash
        run: |
          set +e
          dotnet test backend/tests/Taskdeck.Application.Tests/Taskdeck.Application.Tests.csproj \
            -c Release --no-restore -m:1 \
            --filter "FullyQualifiedName~OperationHandlerCreateNotificationTests" \
            2>&1 | tee "$RUNNER_TEMP/pr-3189-red.log"
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -eq 0 ]; then
            echo "Expected the red-first create notification regression to fail before repair." >&2
            exit 1
          fi
          grep -q "OperationHandlerCreateNotificationTests" "$RUNNER_TEMP/pr-3189-red.log"

      - name: Apply bounded notification-sink repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          service_path = Path('backend/src/Taskdeck.Application/Services/CardService.cs')
          service = service_path.read_text(encoding='utf-8-sig')

          old = """    public async Task<Result<CardDto>> CreateCardAsync(
        CreateCardDto dto,
        Guid? cardId,
        CancellationToken cancellationToken = default)
    {
        return await CreateCardAsync(dto, cardId, actorUserId: null, cancellationToken);
    }

    public async Task<Result<CardDto>> CreateCardAsync(
        CreateCardDto dto,
        Guid? cardId,
        Guid? actorUserId,
        CancellationToken cancellationToken = default)
    {
        try
        {
"""
          new = """    public async Task<Result<CardDto>> CreateCardAsync(
        CreateCardDto dto,
        Guid? cardId,
        CancellationToken cancellationToken = default,
        IBoardRealtimeNotifier? notificationSink = null)
    {
        return await CreateCardAsync(dto, cardId, actorUserId: null, cancellationToken, notificationSink);
    }

    public async Task<Result<CardDto>> CreateCardAsync(
        CreateCardDto dto,
        Guid? cardId,
        Guid? actorUserId,
        CancellationToken cancellationToken = default,
        IBoardRealtimeNotifier? notificationSink = null)
    {
        var notifier = notificationSink ?? _realtimeNotifier;
        try
        {
"""
          if service.count(old) != 1:
              raise SystemExit('Could not locate the card-create overload seam exactly once.')
          service = service.replace(old, new, 1)

          old = """            await _realtimeNotifier.NotifyBoardMutationAsync(
                new BoardRealtimeEvent(card.BoardId, "card", "created", card.Id, DateTimeOffset.UtcNow),
                cancellationToken);
"""
          new = """            await notifier.NotifyBoardMutationAsync(
                new BoardRealtimeEvent(card.BoardId, "card", "created", card.Id, DateTimeOffset.UtcNow),
                cancellationToken);
"""
          if service.count(old) != 1:
              raise SystemExit('Could not locate the card-created notifier seam exactly once.')
          service_path.write_text(service.replace(old, new, 1), encoding='utf-8-sig', newline='\n')

          registry_path = Path('backend/src/Taskdeck.Application/Services/Pipeline/OperationHandlerRegistry.cs')
          registry = registry_path.read_text(encoding='utf-8')

          old = """            case "create":
                return await CreateCardAsync(parameters, operation.TargetId, cancellationToken);
"""
          new = """            case "create":
                return await CreateCardAsync(parameters, operation.TargetId, cancellationToken,
                    deferredNotifications);
"""
          if registry.count(old) != 1:
              raise SystemExit('Could not locate the create dispatch seam exactly once.')
          registry = registry.replace(old, new, 1)

          old = """    private async Task<Result> CreateCardAsync(
        JsonElement parameters,
        string? targetId,
        CancellationToken cancellationToken)
"""
          new = """    private async Task<Result> CreateCardAsync(
        JsonElement parameters,
        string? targetId,
        CancellationToken cancellationToken,
        DeferredBoardRealtimeNotifier? deferredNotifications)
"""
          if registry.count(old) != 1:
              raise SystemExit('Could not locate the private create handler seam exactly once.')
          registry = registry.replace(old, new, 1)

          old = """        var result = await _cardService.CreateCardAsync(dto, cardId, cancellationToken);
"""
          new = """        var result = await _cardService.CreateCardAsync(
            dto,
            cardId,
            cancellationToken,
            notificationSink: deferredNotifications);
"""
          if registry.count(old) != 1:
              raise SystemExit('Could not locate the card service create call exactly once.')
          registry_path.write_text(registry.replace(old, new, 1), encoding='utf-8', newline='\n')

          Path('.github/workflows/pr-3189-branch-patch.yml').unlink()
          PY

      - name: Verify focused proposal execution behavior
        run: >-
          dotnet test backend/tests/Taskdeck.Application.Tests/Taskdeck.Application.Tests.csproj
          -c Release --no-restore -m:1
          --filter "FullyQualifiedName~OperationHandlerCreateNotificationTests|FullyQualifiedName~OperationHandlerRegistryTests|FullyQualifiedName~AutomationExecutorServiceTests"

      - name: Commit bounded repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/Taskdeck.Application/Services/CardService.cs \
            backend/src/Taskdeck.Application/Services/Pipeline/OperationHandlerRegistry.cs \
            .github/workflows/pr-3189-branch-patch.yml
          git diff --cached --check
          git commit -m "fix(backend): defer proposal card-created events"
          git push origin HEAD:fix/3073-defer-proposal-create-events
