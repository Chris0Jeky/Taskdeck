name: Finish PR 3190 Node contract rename

on:
  push:
    branches:
      - fix/3009-stryker-source-guard-isolation
    paths:
      - .github/workflows/pr-3190-rename-node-contract.yml

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/3009-stryker-source-guard-isolation
          fetch-depth: 0

      - name: Reconcile policy and remove Vitest-collected filename
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          policy = Path('docs/testing/MUTATION_TESTING_POLICY.md')
          text = policy.read_text(encoding='utf-8')
          old = 'scripts/stryker-source-text-guards.test.mjs'
          new = 'scripts/stryker-source-text-guards.contract.mjs'
          if text.count(old) != 1:
              raise SystemExit(f'Expected one policy reference to {old}, found {text.count(old)}')
          policy.write_text(text.replace(old, new), encoding='utf-8', newline='\n')

          contract = Path('frontend/taskdeck-web/scripts/stryker-source-text-guards.contract.mjs')
          lines = contract.read_text(encoding='utf-8').splitlines()
          contract.write_text('\n'.join(line.rstrip() for line in lines) + '\n', encoding='utf-8', newline='\n')

          Path('frontend/taskdeck-web/scripts/stryker-source-text-guards.test.mjs').unlink()
          Path('.github/workflows/pr-3190-rename-node-contract.yml').unlink()
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test(ci): keep Node contract outside Vitest discovery"
          git push origin HEAD:fix/3009-stryker-source-guard-isolation
