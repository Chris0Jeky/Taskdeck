name: Apply PR 3182 headless contract patch

on:
  push:
    branches:
      - fix/2181-headless-data-contract
    paths:
      - .github/workflows/pr-3182-headless-contract-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/2181-headless-data-contract
          fetch-depth: 0

      - name: Apply bounded implementation and documentation patch
        run: python scripts/ci/pr-3182-apply.py

      - name: Verify focused FirstRun contracts
        run: >-
          dotnet test backend/tests/Taskdeck.Api.Tests/Taskdeck.Api.Tests.csproj
          -c Release -m:1
          --filter "FullyQualifiedName~DesktopRuntimeConnectorKeyFailureTests|FullyQualifiedName~DesktopRuntimeTests"

      - name: Commit bounded repair
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/ci/pr-3182-apply.py
          rm .github/workflows/pr-3182-headless-contract-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(first-run): classify connector identity failures"
          git push origin HEAD:fix/2181-headless-data-contract
