name: Apply PR 3180 documentation-link parser hardening

on:
  push:
    branches:
      - fix/3119-doc-links-parser-residuals

permissions:
  contents: write

concurrency:
  group: apply-pr-3180-doc-links-parser
  cancel-in-progress: true

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/3119-doc-links-parser-residuals
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.2.0
        with:
          node-version: 24.13.1

      - name: Prove the new residual regressions fail before implementation
        shell: bash
        run: |
          set -euo pipefail
          if node --test scripts/check-doc-links.residuals.test.mjs > /tmp/doc-links-red.log 2>&1; then
            cat /tmp/doc-links-red.log
            echo 'Expected at least one #3119 regression to fail before implementation.' >&2
            exit 1
          fi
          cat /tmp/doc-links-red.log

      - name: Apply dependency-free parser hardening
        shell: python
        run: |
          from pathlib import Path

          path = Path('scripts/check-doc-links.mjs')
          text = path.read_text(encoding='utf-8').replace('\r\n', '\n')

          def replace_between(start_marker: str, end_marker: str, replacement: str) -> None:
              global text
              start = text.find(start_marker)
              if start < 0:
                  raise RuntimeError(f'Missing start marker: {start_marker[:80]!r}')
              end = text.find(end_marker, start)
              if end < 0:
                  raise RuntimeError(f'Missing end marker after {start_marker[:40]!r}: {end_marker[:80]!r}')
              text = text[:start] + replacement + text[end:]

          replace_between(
              'function maskHtmlComments(buffer, source) {',
              'function backtickRunLength',
              '''function maskHtmlComments(buffer, source, diagnostics) {
            let cursor = 0
            while (cursor < source.length) {
              const start = source.indexOf('<!--', cursor)
              if (start === -1) break
              // Fenced code was already masked in the shared buffer, so a comment marker
              // hidden there is illustrative text rather than Markdown structure.
              if (
                buffer[start] !== '<' ||
                buffer[start + 1] !== '!' ||
                buffer[start + 2] !== '-' ||
                buffer[start + 3] !== '-'
              ) {
                cursor = start + 4
                continue
              }

              const close = source.indexOf('-->', start + 4)
              if (close !== -1) {
                const end = close + 3
                maskRange(buffer, source, start, end)
                cursor = end
                continue
              }

              const blankLine = firstBlankLineAtOrAfter(source, start + 4)
              const end = blankLine === -1 ? source.length : blankLine + 1
              maskRange(buffer, source, start, end)
              diagnostics.push({
                line: lineNumberAt(source, start),
                target: '<!--',
                reason: 'unterminated HTML comment',
              })
              cursor = end
            }
          }

          ''',
          )

          replace_between(
              'function firstBlankLineAtOrAfter(text, start) {',
              '/**\n * Mask fenced blocks',
              '''function firstBlankLineAtOrAfter(text, start) {
            const pattern = /\\n[ \\t\\r]*\\n/g
            pattern.lastIndex = start
            return pattern.exec(text)?.index ?? -1
          }

          function indexBacktickRuns(text) {
            const runs = []
            let lineStart = 0
            let line = 1
            let paragraph = 0

            while (lineStart < text.length) {
              const newline = text.indexOf('\\n', lineStart)
              const lineEnd = newline === -1 ? text.length : newline
              let cursor = lineStart
              while (cursor < lineEnd) {
                if (text[cursor] !== '`') {
                  cursor += 1
                  continue
                }
                const length = backtickRunLength(text, cursor)
                runs.push({
                  start: cursor,
                  end: cursor + length,
                  length,
                  line,
                  paragraph,
                  escaped: isEscaped(text, cursor),
                  nextSameLength: -1,
                })
                cursor += length
              }

              const rawLine = text.slice(lineStart, lineEnd)
              const comparableLine = rawLine.endsWith('\\r') ? rawLine.slice(0, -1) : rawLine
              if (comparableLine.trim() === '') paragraph += 1
              if (newline === -1) break
              lineStart = newline + 1
              line += 1
            }

            const nextByParagraph = new Map()
            for (let index = runs.length - 1; index >= 0; index -= 1) {
              const run = runs[index]
              let nextByLength = nextByParagraph.get(run.paragraph)
              if (!nextByLength) {
                nextByLength = new Map()
                nextByParagraph.set(run.paragraph, nextByLength)
              }
              run.nextSameLength = nextByLength.get(run.length) ?? -1
              nextByLength.set(run.length, index)
            }
            return runs
          }

          ''',
          )

          replace_between(
              '  maskHtmlComments(buffer, markdown)\n  const fenceMasked = buffer.join(\'\')',
              '\n\n  return { masked: buffer.join(\'\'), diagnostics }',
              '''  maskHtmlComments(buffer, markdown, diagnostics)
            const fenceMasked = buffer.join('')
            const backtickRuns = indexBacktickRuns(fenceMasked)
            let maskedThrough = -1

            for (const run of backtickRuns) {
              if (run.start < maskedThrough || run.escaped) continue

              if (run.nextSameLength === -1) {
                diagnostics.push({
                  line: run.line,
                  target: '`'.repeat(run.length),
                  reason: 'unbalanced inline code span',
                })
                continue
              }

              const closing = backtickRuns[run.nextSameLength]
              maskRange(buffer, markdown, run.start, closing.end)
              maskedThrough = closing.end
            }''',
          )

          replace_between(
              'function findLabelEnd(markdown, start) {',
              'function skipWhitespace',
              '''function indexBalancedLabels(markdown) {
            const stack = []
            const ends = new Map()
            for (let index = 0; index < markdown.length; index += 1) {
              if (markdown[index] === '\\\\') {
                index += 1
                continue
              }
              if (markdown[index] === '[') stack.push(index)
              else if (markdown[index] === ']' && stack.length > 0) {
                ends.set(stack.pop(), index)
              }
            }
            return ends
          }

          ''',
          )

          reference_helper_marker = '\n\nfunction extractLocalTargetsFromMasked(masked) {'
          helper = '''

          function stripReferenceContainerPrefix(line, { allowIndented = false } = {}) {
            let cursor = 0
            for (;;) {
              let indentation = 0
              while (
                cursor < line.length &&
                (line[cursor] === ' ' || line[cursor] === '\\t') &&
                indentation < 3
              ) {
                cursor += 1
                indentation += 1
              }

              if (line[cursor] === '>') {
                cursor += 1
                if (line[cursor] === ' ' || line[cursor] === '\\t') cursor += 1
                continue
              }

              const listMarker = /^(?:[-+*]|\\d{1,9}[.)])[ \\t]+/.exec(line.slice(cursor))
              if (listMarker) {
                cursor += listMarker[0].length
                continue
              }

              if (allowIndented) {
                while (line[cursor] === ' ' || line[cursor] === '\\t') cursor += 1
              } else if (line[cursor] === ' ' || line[cursor] === '\\t') {
                return null
              }
              return { text: line.slice(cursor), offset: cursor }
            }
          }
          '''
          if text.count(reference_helper_marker) != 1:
              raise RuntimeError('Expected one target-extraction marker.')
          text = text.replace(reference_helper_marker, helper + reference_helper_marker)

          extraction_start = 'function extractLocalTargetsFromMasked(masked) {\n  const found = []\n  let sequence = 0\n'
          extraction_replacement = extraction_start + '  const labelEnds = indexBalancedLabels(masked)\n'
          if text.count(extraction_start) != 1:
              raise RuntimeError('Expected one target extraction prelude.')
          text = text.replace(extraction_start, extraction_replacement)
          old_label_lookup = '    const labelEnd = findLabelEnd(masked, bracketStart)'
          if text.count(old_label_lookup) != 1:
              raise RuntimeError('Expected one repeated label scan.')
          text = text.replace(
              old_label_lookup,
              '    const labelEnd = labelEnds.get(bracketStart) ?? -1',
          )

          replace_between(
              "  // A reference-style link's path lives in its definition, so validating every\n",
              '  const findTagEnd = (start) => {',
              '''  // A reference-style link's path lives in its definition, so validating every
            // local definition covers both links and images without resolving labels. Markdown
            // container prefixes are structural and do not make a definition part of a code block.
            let definitionLineStart = 0
            while (definitionLineStart <= masked.length) {
              const newline = masked.indexOf('\\n', definitionLineStart)
              const lineEnd = newline === -1 ? masked.length : newline
              const rawLine = masked.slice(definitionLineStart, lineEnd)
              const lineText = rawLine.endsWith('\\r') ? rawLine.slice(0, -1) : rawLine
              const container = stripReferenceContainerPrefix(lineText)
              if (container) {
                const definition = /^\\[(?!\\^)[^\\]\\n]+\\]:[ \\t]*(.*)$/.exec(container.text)
                if (definition) {
                  let destinationText = definition[1]
                  let destinationIndex = definitionLineStart + container.offset
                  if (destinationText.trim() === '' && newline !== -1) {
                    const nextLineStart = newline + 1
                    const nextNewline = masked.indexOf('\\n', nextLineStart)
                    const nextLineEnd = nextNewline === -1 ? masked.length : nextNewline
                    const nextRawLine = masked.slice(nextLineStart, nextLineEnd)
                    const nextLine = nextRawLine.endsWith('\\r')
                      ? nextRawLine.slice(0, -1)
                      : nextRawLine
                    const continuation = stripReferenceContainerPrefix(nextLine, {
                      allowIndented: true,
                    })
                    if (continuation && continuation.text !== '') {
                      destinationText = continuation.text
                      destinationIndex = nextLineStart + continuation.offset
                    }
                  }
                  const target = parseReferenceDestination(destinationText)
                  if (target !== null) push(target, destinationIndex)
                }
              }

              if (newline === -1) break
              definitionLineStart = newline + 1
            }

          ''',
          )

          replace_between(
              '  const findTagEnd = (start) => {',
              '\n\n  return found',
              '''  const findTagEnd = (start) => {
            let quote = null
            for (let cursor = start + 1; cursor < masked.length; cursor += 1) {
              const character = masked[cursor]
              if (quote) {
                if (character === quote) quote = null
              } else if (character === '"' || character === "'") {
                quote = character
              } else if (character === '>') {
                return cursor
              }
            }
            return -1
          }

          const findHtmlAttribute = (tag, tagNameEnd, expectedName) => {
            let cursor = tagNameEnd
            while (cursor < tag.length) {
              while (/\\s/.test(tag[cursor] ?? '')) cursor += 1
              if (cursor >= tag.length || tag[cursor] === '>') return null
              if (tag[cursor] === '/') {
                cursor += 1
                continue
              }

              const nameStart = cursor
              while (cursor < tag.length && !/[\\s=/>]/.test(tag[cursor])) cursor += 1
              if (cursor === nameStart) {
                cursor += 1
                continue
              }
              const name = tag.slice(nameStart, cursor)
              while (/\\s/.test(tag[cursor] ?? '')) cursor += 1
              if (tag[cursor] !== '=') continue
              cursor += 1
              while (/\\s/.test(tag[cursor] ?? '')) cursor += 1

              let valueStart = cursor
              let valueEnd = cursor
              if (tag[cursor] === '"' || tag[cursor] === "'") {
                const quote = tag[cursor]
                valueStart = cursor + 1
                cursor = valueStart
                while (cursor < tag.length && tag[cursor] !== quote) cursor += 1
                valueEnd = cursor
                if (cursor < tag.length) cursor += 1
              } else {
                while (cursor < tag.length && !/[\\s>]/.test(tag[cursor])) cursor += 1
                valueEnd = cursor
              }

              if (name.toLowerCase() === expectedName) {
                return { value: tag.slice(valueStart, valueEnd), valueOffset: valueStart }
              }
            }
            return null
          }

          let cursor = 0
          while (cursor < masked.length) {
            if (masked[cursor] !== '<') {
              cursor += 1
              continue
            }

            const opening = /^<(a|img)\\b/i.exec(masked.slice(cursor, cursor + 8))
            if (!opening) {
              cursor += 1
              continue
            }

            const end = findTagEnd(cursor)
            if (end === -1) {
              cursor += 1
              continue
            }
            const tag = masked.slice(cursor, end + 1)
            const attributeName = opening[1].toLowerCase() === 'a' ? 'href' : 'src'
            const attribute = findHtmlAttribute(tag, opening[0].length, attributeName)
            if (attribute) push(attribute.value, cursor + attribute.valueOffset)
            cursor = end + 1
          }''',
          )

          required = [
              'reason: \'unterminated HTML comment\'',
              'function indexBacktickRuns(text)',
              'const labelEnds = indexBalancedLabels(masked)',
              'function stripReferenceContainerPrefix',
              'const findHtmlAttribute =',
          ]
          for fragment in required:
              if fragment not in text:
                  raise RuntimeError(f'Missing post-patch parser fragment: {fragment}')
          forbidden = [
              'function findLabelEnd(',
              'const definitionPattern =',
              'const attributePattern =',
              'maskHtmlComments(buffer, markdown)\n',
          ]
          for fragment in forbidden:
              if fragment in text:
                  raise RuntimeError(f'Stale parser implementation remains: {fragment}')

          path.write_text(text, encoding='utf-8')

      - name: Verify focused and complete parser contracts
        shell: bash
        run: |
          set -euo pipefail
          node --test scripts/check-doc-links*.test.mjs
          node scripts/check-doc-links.mjs
          git diff --check

      - name: Publish implementation
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/apply-3180-doc-links-parser.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/check-doc-links.mjs
          git commit -m 'fix: harden documentation link parser'
          git push origin HEAD:fix/3119-doc-links-parser-residuals
