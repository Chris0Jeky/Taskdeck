name: Apply PR 2588 readiness budget

on:
  push:
    branches:
      - fix/2588-frontend-readiness-budget
    paths:
      - .github/workflows/apply-2588-readiness-budget.yml

permissions:
  contents: write

concurrency:
  group: apply-pr-2588-readiness-budget
  cancel-in-progress: true

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/2588-frontend-readiness-budget
          fetch-depth: 0

      - name: Add delayed-bind regression before the budget fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/ci/dev-up.test.mjs')
          source = path.read_text(encoding='utf-8')

          old_listen = """  }
  listen()
} else if (kind === 'dotnet') {
"""
          new_listen = """  }
  const bindDelayMs = Number(process.env.FAKE_FRONTEND_BIND_DELAY_MS ?? 0)
  if (Number.isFinite(bindDelayMs) && bindDelayMs > 0) {
    setTimeout(listen, bindDelayMs)
  } else {
    listen()
  }
} else if (kind === 'dotnet') {
"""
          if source.count(old_listen) != 1:
              raise SystemExit(f'Expected one frontend listen call, found {source.count(old_listen)}.')
          source = source.replace(old_listen, new_listen, 1)

          old_test = """  {
    concurrency: false,
    timeout: 10_000,
    skip: process.platform === 'win32' ? 'requires POSIX signal handling; hosted Linux proof is required' : false,
  },
"""
          new_test = """  {
    concurrency: false,
    timeout: 25_000,
    skip: process.platform === 'win32' ? 'requires POSIX signal handling; hosted Linux proof is required' : false,
  },
"""
          marker = "test(\n  'Node helper: TERM closes an active frontend connection',\n"
          marker_start = source.index(marker)
          test_block_start = source.index(old_test, marker_start)
          if test_block_start < 0:
              raise SystemExit('Could not find the TERM helper test options.')
          source = source[:test_block_start] + source[test_block_start:].replace(old_test, new_test, 1)

          old_env = """        FAKE_FRONTEND_HOST: '127.0.0.1',
        FAKE_FRONTEND_PORT: String(frontendPort),
"""
          new_env = """        FAKE_FRONTEND_HOST: '127.0.0.1',
        FAKE_FRONTEND_PORT: String(frontendPort),
        // #2588: exceed the historical five-second ceiling deterministically.
        FAKE_FRONTEND_BIND_DELAY_MS: '5250',
"""
          env_start = source.index(old_env, marker_start)
          if env_start < 0:
              raise SystemExit('Could not find the TERM helper environment.')
          source = source[:env_start] + source[env_start:].replace(old_env, new_env, 1)

          path.write_text(source, encoding='utf-8', newline='\n')
          PY

      - name: Prove the old five-second default is red
        shell: bash
        run: |
          set +e
          node --test --test-name-pattern='Node helper: TERM closes an active frontend connection' scripts/ci/dev-up.test.mjs > /tmp/red.log 2>&1
          status=$?
          set -e
          cat /tmp/red.log
          if [ "$status" -eq 0 ]; then
            echo 'The delayed-bind regression unexpectedly passed under the old five-second budget.' >&2
            exit 1
          fi
          grep -F 'no valid readiness marker within 5000ms' /tmp/red.log

      - name: Apply the bounded readiness budget
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/ci/dev-up.test.mjs')
          source = path.read_text(encoding='utf-8')

          old_constants = """const DIAGNOSTIC_OUTPUT_LIMIT = 8 * 1024
const RESET_CYCLE_TEARDOWN_TIMEOUT_MS = 45_000
"""
          new_constants = """const DIAGNOSTIC_OUTPUT_LIMIT = 8 * 1024
const RESET_CYCLE_TEARDOWN_TIMEOUT_MS = 45_000
// #2588: repeated hosted failures reached the former 5s ceiling before the fake frontend bound.
// Stay bounded below the 30s hosted per-test ceiling while retaining time for TERM and cleanup.
const FRONTEND_HELPER_READINESS_TIMEOUT_MS = 15_000
"""
          if source.count(old_constants) != 1:
              raise SystemExit(f'Expected one readiness-constant anchor, found {source.count(old_constants)}.')
          source = source.replace(old_constants, new_constants, 1)

          old_signature = "function waitForFrontendReadiness(child, { expectedHost = 'localhost', expectedPort, readStdout, readStderr, timeout = 5000 }) {"
          new_signature = "function waitForFrontendReadiness(child, { expectedHost = 'localhost', expectedPort, readStdout, readStderr, timeout = FRONTEND_HELPER_READINESS_TIMEOUT_MS }) {"
          if source.count(old_signature) != 1:
              raise SystemExit(f'Expected one readiness signature, found {source.count(old_signature)}.')
          source = source.replace(old_signature, new_signature, 1)

          path.write_text(source, encoding='utf-8', newline='\n')
          PY

      - name: Verify delayed readiness and syntax
        shell: bash
        run: |
          node --check scripts/ci/dev-up.test.mjs
          node --test --test-name-pattern='Node helper: TERM closes an active frontend connection' scripts/ci/dev-up.test.mjs
          git diff --check

      - name: Publish the fix and remove the applicator
        shell: bash
        run: |
          git rm .github/workflows/apply-2588-readiness-budget.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/ci/dev-up.test.mjs
          git commit -m 'test(ci): allow bounded delayed frontend readiness'
          git push origin HEAD:fix/2588-frontend-readiness-budget
