name: Apply PR 3166 post-commit disposal repair

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: apply-3166-post-commit-disposal-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: true

jobs:
  repair:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/3117-post-commit-tail-boundary'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
      TRIGGER_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout exact pull request branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Verify exact triggering head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TRIGGER_HEAD"

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x

      - name: Restore focused test project
        run: dotnet restore backend/tests/Taskdeck.Api.Tests/Taskdeck.Api.Tests.csproj

      - name: Prove the post-commit disposal regression is red
        shell: bash
        run: |
          set +e
          dotnet test backend/tests/Taskdeck.Api.Tests/Taskdeck.Api.Tests.csproj \
            -c Release -m:1 --no-restore \
            --filter FullyQualifiedName~UnitOfWorkTransactionLifecycleTests \
            > /tmp/pr-3166-red.log 2>&1
          status=$?
          set -e
          cat /tmp/pr-3166-red.log
          if [ "$status" -eq 0 ]; then
            echo 'Expected the transaction lifecycle regression to fail before the UnitOfWork repair.' >&2
            exit 1
          fi
          grep -F 'UnitOfWorkTransactionLifecycleTests.CommitTransactionAsync_WhenDisposeFailsAfterCommit_TreatsCommitAsDurable' /tmp/pr-3166-red.log
          grep -F 'transaction cleanup failed after commit' /tmp/pr-3166-red.log

      - name: Establish durability before best-effort transaction cleanup
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('backend/src/Taskdeck.Infrastructure/Repositories/UnitOfWork.cs')
          source = path.read_text(encoding='utf-8').replace('\r\n', '\n')

          def replace_once(old: str, new: str, label: str) -> None:
              global source
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'expected one {label}, found {count}')
              source = source.replace(old, new, 1)

          replace_once(
              'using Microsoft.EntityFrameworkCore.Storage;\n'
              'using Taskdeck.Application.Interfaces;\n',
              'using Microsoft.EntityFrameworkCore.Storage;\n'
              'using Microsoft.Extensions.Logging;\n'
              'using Microsoft.Extensions.Logging.Abstractions;\n'
              'using Taskdeck.Application.Interfaces;\n',
              'UnitOfWork using boundary',
          )

          replace_once(
              '    private readonly TaskdeckDbContext _context;\n'
              '    private IDbContextTransaction? _transaction;\n',
              '    private readonly TaskdeckDbContext _context;\n'
              '    private readonly ILogger<UnitOfWork> _logger;\n'
              '    private IDbContextTransaction? _transaction;\n',
              'UnitOfWork field boundary',
          )

          replace_once(
              '        ITomorrowNoteRepository tomorrowNotes,\n'
              '        IMcpToolHashRepository mcpToolHashes)\n'
              '    {\n'
              '        _context = context;\n',
              '        ITomorrowNoteRepository tomorrowNotes,\n'
              '        IMcpToolHashRepository mcpToolHashes,\n'
              '        ILogger<UnitOfWork>? logger = null)\n'
              '    {\n'
              '        _context = context;\n'
              '        _logger = logger ?? NullLogger<UnitOfWork>.Instance;\n',
              'UnitOfWork constructor tail',
          )

          replace_once(
              '    public async Task CommitTransactionAsync(CancellationToken cancellationToken = default)\n'
              '    {\n'
              '        if (_transaction != null)\n'
              '        {\n'
              '            await _transaction.CommitAsync(cancellationToken);\n'
              '            await _transaction.DisposeAsync();\n'
              '            _transaction = null;\n'
              '        }\n'
              '    }\n',
              '    public async Task CommitTransactionAsync(CancellationToken cancellationToken = default)\n'
              '    {\n'
              '        var transaction = _transaction;\n'
              '        if (transaction == null)\n'
              '            return;\n'
              '\n'
              '        await transaction.CommitAsync(cancellationToken);\n'
              '\n'
              '        // CommitAsync is the durable boundary. Clear the rollback handle before cleanup so\n'
              '        // a provider-specific disposal failure cannot make callers treat committed state as\n'
              '        // uncommitted or attempt to roll it back.\n'
              '        _transaction = null;\n'
              '        try\n'
              '        {\n'
              '            await transaction.DisposeAsync();\n'
              '        }\n'
              '        catch (Exception ex)\n'
              '        {\n'
              '            _logger.LogWarning(\n'
              '                ex,\n'
              '                "Database transaction committed successfully, but transaction cleanup failed.");\n'
              '        }\n'
              '    }\n',
              'UnitOfWork commit method',
          )

          path.write_text(source, encoding='utf-8', newline='\n')
          PY

          git diff --check

      - name: Verify focused transaction lifecycle and executor regressions
        shell: bash
        run: |
          set -euo pipefail
          dotnet test backend/tests/Taskdeck.Api.Tests/Taskdeck.Api.Tests.csproj \
            -c Release -m:1 --no-restore \
            --filter FullyQualifiedName~UnitOfWorkTransactionLifecycleTests
          dotnet test backend/tests/Taskdeck.Application.Tests/Taskdeck.Application.Tests.csproj \
            -c Release -m:1 \
            --filter FullyQualifiedName~AutomationExecutorPostCommitBoundaryTests

      - name: Publish exact-parent repair and remove applicator
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TRIGGER_HEAD"
          remote_head="$(git ls-remote --heads origin "refs/heads/$PR_HEAD_REF" | awk '{print $1}')"
          test -n "$remote_head"
          test "$remote_head" = "$TRIGGER_HEAD"

          git rm .github/workflows/apply-3166-post-commit-disposal.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/src/Taskdeck.Infrastructure/Repositories/UnitOfWork.cs \
            backend/tests/Taskdeck.Api.Tests/UnitOfWorkTransactionLifecycleTests.cs
          git diff --cached --check

          expected_names=$'.github/workflows/apply-3166-post-commit-disposal.yml\nbackend/src/Taskdeck.Infrastructure/Repositories/UnitOfWork.cs\nbackend/tests/Taskdeck.Api.Tests/UnitOfWorkTransactionLifecycleTests.cs'
          actual_names="$(git diff --cached --name-only | sort)"
          test "$actual_names" = "$expected_names"

          tree="$(git write-tree)"
          repair_commit="$(printf '%s\n' 'fix(uow): establish durability before transaction cleanup' | git commit-tree "$tree" -p "$TRIGGER_HEAD")"
          test "$(git rev-parse "$repair_commit^")" = "$TRIGGER_HEAD"
          git push --force-with-lease="refs/heads/$PR_HEAD_REF:$TRIGGER_HEAD" origin "$repair_commit:refs/heads/$PR_HEAD_REF"
