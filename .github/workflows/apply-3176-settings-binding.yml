name: Apply PR 3176 settings binding

on:
  push:
    branches:
      - test/2212-capture-triage-settings-binding

permissions:
  contents: write

concurrency:
  group: apply-pr-3176-settings-binding
  cancel-in-progress: true

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: test/2212-capture-triage-settings-binding
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: |
            backend/Taskdeck.sln
            backend/**/*.csproj
            backend/Directory.Packages.props

      - name: Resolve capture-triage settings from validated options
        shell: python
        run: |
          from pathlib import Path

          path = Path('backend/src/Taskdeck.Api/Extensions/LlmProviderRegistration.cs')
          text = path.read_text(encoding='utf-8')

          using_anchor = 'using Microsoft.Extensions.DependencyInjection.Extensions;\n'
          if text.count(using_anchor) != 1:
              raise SystemExit('Expected one dependency-injection using anchor.')
          text = text.replace(
              using_anchor,
              using_anchor + 'using Microsoft.Extensions.Options;\n',
          )

          old = (
              '        var llmCaptureTriageSettings = configuration.GetSection("CaptureTriageLlm").Get<LlmCaptureTriageSettings>() ?? new LlmCaptureTriageSettings();\n'
              '        services.AddSingleton(llmCaptureTriageSettings);'
          )
          new = (
              '        // Adapt the existing raw-settings dependency to the validated options pipeline.\n'
              '        // Resolving rather than snapshotting here preserves later host configuration\n'
              '        // providers, including WebApplicationFactory and operator overrides.\n'
              '        services.AddSingleton(sp =>\n'
              '            sp.GetRequiredService<IOptions<LlmCaptureTriageSettings>>().Value);'
          )
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one eager capture-triage settings registration, found {text.count(old)}.')
          text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')

      - name: Restore focused test project
        run: dotnet restore backend/tests/Taskdeck.Api.Tests/Taskdeck.Api.Tests.csproj

      - name: Verify host settings binding regression
        run: >-
          dotnet test backend/tests/Taskdeck.Api.Tests/Taskdeck.Api.Tests.csproj
          --configuration Release
          --no-restore
          -m:1
          --filter FullyQualifiedName~CaptureTriageLlmSettingsBindingIntegrationTests

      - name: Publish implementation
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git rm .github/workflows/apply-3176-settings-binding.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/src/Taskdeck.Api/Extensions/LlmProviderRegistration.cs
          git commit -m 'fix: resolve capture triage settings from options'
          git push origin HEAD:test/2212-capture-triage-settings-binding
