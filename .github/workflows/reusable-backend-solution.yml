name: Reusable Backend Solution

on:
  workflow_call:
    inputs:
      dotnet-version:
        description: .NET SDK version used for full backend solution regression
        required: false
        default: "8.0.x"
        type: string

permissions:
  contents: read

env:
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  backend-solution:
    name: Backend Solution Regression
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ inputs.dotnet-version }}
          cache: true
          cache-dependency-path: |
            backend/Taskdeck.sln
            backend/**/*.csproj
            backend/Directory.Packages.props

      - name: Restore backend
        run: dotnet restore backend/Taskdeck.sln

      - name: Run backend solution tests
        run: dotnet test backend/Taskdeck.sln --configuration Release --no-restore -m:1 --logger "trx;LogFileName=backend-solution.trx" --results-directory "backend/TestResults/backend-solution"

      - name: Upload backend solution results
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-solution-trx
          path: backend/TestResults/backend-solution
          if-no-files-found: ignore
          retention-days: 14
