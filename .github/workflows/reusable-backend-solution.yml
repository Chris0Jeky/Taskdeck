name: Reusable Backend Solution

on:
  workflow_call:
    inputs:
      dotnet-version:
        description: .NET SDK version used for full backend solution regression
        required: false
        default: "8.0.x"
        type: string

permissions:
  contents: read

env:
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  backend-solution:
    name: Backend Solution Regression
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ inputs.dotnet-version }}
          cache: true
          cache-dependency-path: |
            backend/Taskdeck.sln
            backend/**/*.csproj

      - name: Restore backend
        run: dotnet restore backend/Taskdeck.sln

      - name: Run backend solution tests
        run: dotnet test backend/Taskdeck.sln --configuration Release --no-restore -m:1 --logger "trx;LogFileName=backend-solution.trx" --results-directory "backend/TestResults/backend-solution"

      - name: Upload backend solution results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-solution-trx
          path: backend/TestResults/backend-solution
          if-no-files-found: ignore
