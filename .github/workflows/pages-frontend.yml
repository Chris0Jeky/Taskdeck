name: Deploy Frontend to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/pages-frontend.yml
      - frontend/taskdeck-web/src/**
      - frontend/taskdeck-web/public/**
      - frontend/taskdeck-web/index.html
      - frontend/taskdeck-web/package.json
      - frontend/taskdeck-web/tailwind.config.js
      - frontend/taskdeck-web/vite.config.ts
      - frontend/taskdeck-web/tsconfig*.json
      - LICENSES/Apache-2.0-material-symbols-font-200.txt
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/taskdeck-web/package-lock.json

      - name: Install dependencies
        working-directory: frontend/taskdeck-web
        run: npm ci

      - name: Build
        working-directory: frontend/taskdeck-web
        run: npx vite build --base /Taskdeck/
        env:
          VITE_API_BASE_URL: ''

      - name: SPA fallback for client-side routing
        run: cp frontend/taskdeck-web/dist/index.html frontend/taskdeck-web/dist/404.html

      - name: Include Material Symbols licence
        shell: bash
        run: |
          set -euo pipefail
          source="LICENSES/Apache-2.0-material-symbols-font-200.txt"
          destination="frontend/taskdeck-web/dist/LICENSES/Apache-2.0-material-symbols-font-200.txt"
          mkdir -p "frontend/taskdeck-web/dist/LICENSES"
          cp "$source" "$destination"
          if ! cmp -s "$source" "$destination"; then
            echo "::error::Material Symbols licence does not match the reviewed source copy"
            exit 1
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: frontend/taskdeck-web/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
