name: Reusable OpenAPI Guardrail

on:
  workflow_call:
    inputs:
      dotnet-version:
        description: .NET SDK version used for OpenAPI generation and validation
        required: false
        default: "8.0.x"
        type: string

permissions:
  contents: read

env:
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  openapi-guardrail:
    name: OpenAPI Guardrail
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ inputs.dotnet-version }}
          cache: true
          cache-dependency-path: |
            backend/Taskdeck.sln
            backend/**/*.csproj
            backend/Directory.Packages.props

      - name: Generate and validate OpenAPI artifact
        shell: pwsh
        run: ./scripts/ci/generate-openapi-artifact.ps1 -OutputPath "artifacts/openapi/taskdeck-api.json"

      - name: Upload OpenAPI artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openapi-guardrail-artifact
          path: |
            artifacts/openapi/taskdeck-api.json
            artifacts/openapi/taskdeck-openapi-stdout.log
            artifacts/openapi/taskdeck-openapi-stderr.log
          if-no-files-found: warn
          retention-days: 14
