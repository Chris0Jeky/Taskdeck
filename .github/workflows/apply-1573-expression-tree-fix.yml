name: Apply 1573 expression-tree assertion fix

on:
  push:
    branches:
      - fix/1573-transcript-evidence-dedupe
    paths:
      - .github/workflows/apply-1573-expression-tree-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/1573-transcript-evidence-dedupe
          fetch-depth: 0

      - name: Apply assertion fix
        run: python3 scripts/ci/apply-1573-expression-tree-fix.py

      - name: Commit corrected assertions
        shell: bash
        run: |
          git rm scripts/ci/apply-1573-expression-tree-fix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/tests/Taskdeck.Application.Tests/Services/LlmCaptureTriageExtractorTests.cs
          git commit -m "test(backend): avoid unsupported expression-tree syntax"
          git push origin HEAD:fix/1573-transcript-evidence-dedupe
