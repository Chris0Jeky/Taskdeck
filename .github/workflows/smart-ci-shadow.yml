# =============================================================================
# Smart CI (shadow) — the ADR-0066 control plane in OBSERVATION mode.
#
# What this workflow does NOT do: it changes no ci-required.yml job selection, it
# is not a required check, it never checks out or executes pull-request head code
# in the control-plane jobs, it uses no secrets, and its token is read-only.
#
# Personal-account control-plane placement (ADR-0066 §8, CI-02 #2326):
#   plan / required-gate  run on `pull_request_target` — the workflow file and the
#                         checked-out tooling come from the PR's BASE commit, so a PR
#                         cannot loosen the policy that plans it; the changed-file list
#                         comes from the API (metadata only).
#   Precondition CI-03 must verify before registering the gate: the repository is private
#                         (no forks), because any fork's `pull_request` run can name a job
#                         `Smart CI / Required Gate` while the repository is public.
#   Smart CI / Planner Self-Test lives in smart-ci-self-test.yml on `pull_request` — the
#                         head's own planner/gate/pin tests (the R4 hosted-control lane). It is a
#                         separate workflow on purpose: a job named like the gate must never be
#                         created by a `pull_request` run, because a skipped job counts as
#                         successful for branch protection.
#
# `Smart CI / Required Gate` is the stable check context CI-03 #2327 will register in
# branch protection once >=20 PRs have run without a false red. Until then a red gate
# means a planner/plan defect (missing or invalid plan, planner error, SHA or policy
# digest mismatch), never a product verdict.
#
# Topology context: header of ci-required.yml. Docs: docs/ci/SMART_CI.md.
# =============================================================================

name: Smart CI

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - edited
      - labeled
      - unlabeled

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: smart-ci-control-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24.13.1
  CONTROL_BASE: ${{ github.sha }}
  CONTROL_HEAD: ${{ github.event.pull_request.head.sha }}

jobs:
  plan:
    name: Smart CI / Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout the base branch (control plane — never the PR head)
        uses: actions/checkout@v7
        with:
          # No ref: on pull_request_target the default checkout IS the base branch's
          # current head — the same protected source the workflow file itself came from.
          # (pull_request.base.sha is the base recorded at PR creation and can predate
          # the control plane entirely; the first live run failed exactly that way.)
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: List changed files (API metadata only)
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" --paginate \
            --jq '.[] | [.status, .filename, (.previous_filename // "")] | @tsv' \
            > artifacts/changed-files.tsv
          listed="$(wc -l < artifacts/changed-files.tsv)"
          printf 'changed files listed: %s (payload says %s)\n' "$listed" "$EXPECTED_CHANGED_FILES"
          # The planner escalates when the listed count differs from the payload's changed_files
          # (the files endpoint caps at 3,000 entries) — see --changed-files-expected below.

      - name: Resolve the head commit identities (author + committer logins; metadata only)
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ env.CONTROL_HEAD }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}" \
            --jq '[.author.login, .committer.login] | map(select(. != null)) | unique | join(",")' \
            > artifacts/head-actors.txt
          printf 'head identities: %s\n' "$(cat artifacts/head-actors.txt)"

      - name: Resolve the merge commit and tree (git objects only; nothing is executed)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          # --base-ref lets the resolver accept a merge ref GitHub regenerated against the
          # base branch live tip when the base advanced after dispatch (CI-03 #2327). The
          # event head must still match exactly.
          node scripts/ci/smart-ci/resolve-merge-ref.mjs \
            --pr "$PR_NUMBER" \
            --base "$CONTROL_BASE" \
            --head "$CONTROL_HEAD" \
            --base-ref "$BASE_REF" \
            --merge-out artifacts/merge-sha.txt \
            --tree-out artifacts/merge-tree-sha.txt \
            --note-out artifacts/merge-ref-note.txt

      - name: Plan
        env:
          CI_EXECUTION_MODE: ${{ vars.CI_EXECUTION_MODE || 'hosted' }}
          EXPECTED_CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
        run: |
          set -euo pipefail
          plan_args=(--head-actors "$(cat artifacts/head-actors.txt)")
          if [ -s artifacts/merge-ref-note.txt ]; then
            plan_args+=(--note "$(cat artifacts/merge-ref-note.txt)")
          fi
          if [ -s artifacts/merge-sha.txt ] && [ -s artifacts/merge-tree-sha.txt ]; then
            plan_args+=(
              --merge-sha "$(cat artifacts/merge-sha.txt)"
              --merge-tree-sha "$(cat artifacts/merge-tree-sha.txt)"
            )
          fi
          node scripts/ci/smart-ci/plan.mjs \
            --policy ci/policy.v1.json \
            --event "$GITHUB_EVENT_PATH" \
            --event-name "$GITHUB_EVENT_NAME" \
            --base-sha "$CONTROL_BASE" \
            --changed-files artifacts/changed-files.tsv \
            --changed-files-expected "$EXPECTED_CHANGED_FILES" \
            --execution-mode "$CI_EXECUTION_MODE" \
            --out artifacts/ci-plan.json \
            --summary "$GITHUB_STEP_SUMMARY" \
            "${plan_args[@]}"

      - name: Upload plan receipt
        uses: actions/upload-artifact@v7
        with:
          name: smart-ci-plan-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: artifacts/ci-plan.json
          retention-days: 14
          if-no-files-found: error

  required-gate:
    name: Smart CI / Required Gate
    if: ${{ always() }}
    needs:
      - plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout the base branch (control plane — never the PR head)
        uses: actions/checkout@v7
        with:
          # No ref: on pull_request_target the default checkout IS the base branch's
          # current head — the same protected source the workflow file itself came from.
          # (pull_request.base.sha is the base recorded at PR creation and can predate
          # the control plane entirely; the first live run failed exactly that way.)
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download plan receipt
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: smart-ci-plan-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: artifacts

      - name: Evaluate (mode follows ci/policy.v1.json; in shadow only planner/plan defects are red)
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN_RESULT: ${{ needs.plan.result }}
          EXPECTED_HEAD: ${{ env.CONTROL_HEAD }}
          EXPECTED_BASE: ${{ env.CONTROL_BASE }}
        run: |
          set -euo pipefail
          head_actors="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${EXPECTED_HEAD}" --jq '[.author.login, .committer.login] | map(select(. != null)) | unique | join(",")' || true)"
          node scripts/ci/smart-ci/evaluate-gate.mjs \
            --plan artifacts/ci-plan.json \
            --policy ci/policy.v1.json \
            --event "$GITHUB_EVENT_PATH" \
            --event-name "$GITHUB_EVENT_NAME" \
            --head-actors "$head_actors" \
            --expected-head "$EXPECTED_HEAD" \
            --expected-base "$EXPECTED_BASE" \
            --plan-job-result "$PLAN_RESULT" \
            --receipt artifacts/ci-run.json \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload gate receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: smart-ci-receipt-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: artifacts/ci-run.json
          retention-days: 14
          if-no-files-found: ignore
