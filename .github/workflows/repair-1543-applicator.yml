name: Repair issue 1543 applicator

on:
  push:
    branches:
      - test/1543-secrets-evidence-verdict

permissions:
  contents: write

concurrency:
  group: repair-1543-applicator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact triggering head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify exact triggering head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Apply reviewed governance patch without trailing blank line
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          workflow_path = Path('.github/workflows/apply-1543-secrets-governance.yml')
          workflow_text = workflow_path.read_text(encoding='utf-8').replace('\r\n', '\n')
          start_marker = "          python - <<'PY'\n"
          end_marker = "          PY\n"
          start = workflow_text.find(start_marker)
          if start < 0:
              raise SystemExit('legacy applicator Python start marker was not found')
          start += len(start_marker)
          end = workflow_text.find(end_marker, start)
          if end < 0:
              raise SystemExit('legacy applicator Python end marker was not found')

          encoded_lines = workflow_text[start:end].splitlines()
          if any(line and not line.startswith('          ') for line in encoded_lines):
              raise SystemExit('legacy applicator Python block has unexpected indentation')
          patch_source = '\n'.join(line[10:] if line else '' for line in encoded_lines) + '\n'

          old_writer = "test_path.write_text(tests.rstrip()+addition+'\\n',encoding='utf-8')"
          new_writer = "test_path.write_text(tests.rstrip()+addition.rstrip()+'\\n',encoding='utf-8')"
          if patch_source.count(old_writer) != 1:
              raise SystemExit('expected exactly one legacy test writer to repair')
          patch_source = patch_source.replace(old_writer, new_writer, 1)

          exec(compile(patch_source, str(workflow_path), 'exec'), {})

          repair_path = Path('.github/workflows/repair-1543-applicator.yml')
          if not repair_path.exists():
              raise SystemExit('repair workflow was not present for final-tree cleanup')
          repair_path.unlink()
          PY

      - name: Verify focused governance regressions
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node --check scripts/github/check-pre-merge-secrets-evidence.mjs
          node --check scripts/check-docs-governance.pre-merge-secrets.test.mjs
          node --test scripts/check-docs-governance.pre-merge-secrets.test.mjs
          node --test scripts/check-docs-governance.test.mjs
          node scripts/check-docs-governance.mjs
          git diff --check

      - name: Publish one exact-parent implementation commit
        shell: bash
        run: |
          set -euo pipefail
          branch='test/1543-secrets-evidence-verdict'
          trigger_head="$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$trigger_head"

          remote_head="$(git ls-remote --heads origin "refs/heads/$branch" | awk '{print $1}')"
          test -n "$remote_head"
          test "$remote_head" = "$trigger_head"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/check-docs-governance.mjs \
            scripts/check-docs-governance.test.mjs \
            .github/workflows/apply-1543-secrets-governance.yml \
            .github/workflows/repair-1543-applicator.yml

          expected_names=$'.github/workflows/apply-1543-secrets-governance.yml\n.github/workflows/repair-1543-applicator.yml\nscripts/check-docs-governance.mjs\nscripts/check-docs-governance.test.mjs'
          actual_names="$(git diff --cached --name-only | sort)"
          test "$actual_names" = "$expected_names"

          tree="$(git write-tree)"
          implementation_commit="$(printf '%s\n' 'test: enforce exact-head secrets evidence governance' | git commit-tree "$tree" -p "$trigger_head")"
          test "$(git rev-parse "$implementation_commit^")" = "$trigger_head"
          git push --force-with-lease="refs/heads/$branch:$trigger_head" origin "$implementation_commit:refs/heads/$branch"
