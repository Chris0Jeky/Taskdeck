name: Apply 3023 CardModal contract update

on:
  push:
    branches:
      - fix/3023-archive-refresh-comment-cache
    paths:
      - .github/workflows/apply-3023-card-modal-spec.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/3023-archive-refresh-comment-cache
          fetch-depth: 0

      - name: Update component contracts
        run: python3 scripts/ci/apply-3023-card-modal-spec.py

      - name: Commit contract update
        shell: bash
        run: |
          git rm scripts/ci/apply-3023-card-modal-spec.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/taskdeck-web/src/tests/components/CardModal.spec.ts
          git commit -m "test(frontend): pin archive refresh background contracts"
          git push origin HEAD:fix/3023-archive-refresh-comment-cache
