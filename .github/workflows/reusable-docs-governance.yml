name: Reusable Docs Governance

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version for docs governance checks
        required: false
        default: "24.13.1"
        type: string

permissions:
  contents: read

jobs:
  worktree-helper-windows:
    name: Worktree Helper (Windows PowerShell)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate worktree guard expectation contract
        shell: bash
        run: bash scripts/worktree_guard.expectation.tests.sh

      - name: Validate shell guard export path contract
        shell: bash
        run: bash scripts/worktree_guard.path-flavor.tests.sh

      - name: Validate detached-first worktree helper
        shell: powershell
        run: powershell -NoLogo -NoProfile -NonInteractive -File scripts/git/Test-New-CodexIssueWorktree.ps1

      - name: Validate equivalent tracked-file index refresh
        run: node --test scripts/git/refresh-equivalent-tracked-file.test.mjs

      - name: Validate read-only inventory command contract
        shell: powershell
        run: powershell -NoLogo -NoProfile -NonInteractive -File scripts/github/Invoke-TaskdeckReadOnlyInventory.ps1 -SelfTest

      - name: Validate read-only inventory environment contract on PowerShell 7
        shell: pwsh
        run: pwsh -NoLogo -NoProfile -NonInteractive -File scripts/github/Invoke-TaskdeckReadOnlyInventory.ps1 -SelfTest

      - name: Validate read-only inventory launch on PowerShell 7
        shell: pwsh
        run: |
          & ./scripts/github/Invoke-TaskdeckReadOnlyInventory.ps1 -Command @("git", "status", "--short")

      - name: Validate checkout fingerprint guard
        shell: powershell
        run: powershell -NoLogo -NoProfile -NonInteractive -File scripts/agentic/Test-Assert-TaskdeckCheckoutFingerprint.ps1

  docs-governance:
    name: Docs Governance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate worktree guard contracts
        shell: bash
        run: |
          bash scripts/worktree_guard.tests.sh
          bash scripts/worktree_guard.submodule.tests.sh
          bash scripts/worktree_guard.expectation.tests.sh
          bash scripts/worktree_guard.path-flavor.tests.sh

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Validate project Priority audit parser and regressions
        shell: pwsh
        run: |
          $script = "scripts/github/Sync-TaskdeckProjectPriority.ps1"
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path -LiteralPath $script).Path,
            [ref]$tokens,
            [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count -ne 0) {
            $parseErrors | ForEach-Object { Write-Error $_ }
            exit 1
          }

          & $script -SelfTest

      - name: Validate failure ledger projection synchronization
        run: python -m unittest discover -s scripts/agent_hooks -p "test_render_failure_ledger.py"

      - name: Validate refactoring evidence ranker
        run: python -m unittest discover -s scripts/analysis -p "test_rank_refactor_candidates.py"

      - name: Validate docs governance invariants
        run: |
          node --test scripts/check-docs-governance*.test.mjs
          node --test scripts/check-doc-links*.test.mjs
          node scripts/check-docs-governance.mjs

      - name: Validate golden principles invariants
        run: node scripts/check-golden-principles.mjs

      - name: Validate GitHub operations governance invariants
        run: |
          node --test scripts/check-github-ops-governance.test.mjs
          node scripts/check-github-ops-governance.mjs

      - name: Validate unknown-exception boundary invariants
        run: |
          node --test scripts/check-unknown-exception-boundary.test.mjs
          node scripts/check-unknown-exception-boundary.mjs
