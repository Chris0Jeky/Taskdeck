name: PR 3142 stale probe repair

on:
  push:
    branches:
      - fix/3030-permission-probe-403
    paths:
      - .github/workflows/pr3142-stale-probe-repair.yml

permissions:
  contents: write

concurrency:
  group: pr-3142-stale-probe-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/3030-permission-probe-403
          fetch-depth: 0

      - name: Verify repair seed
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "58fab2fd23d4049f17996979284f7b2dd0462ad8"

      - name: Add stale-probe regression
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('frontend/taskdeck-web/src/tests/composables/useCardTypePermission.retryOrdering.spec.ts')
          text = path.read_text()
          marker = "  it.each([403, 404])(\n"
          addition = """  it('lets a newer authoritative board payload supersede a stale automatic probe 403', async () => {
            const automaticProbe = deferred<BoardDetail>()
            vi.mocked(boardsApi.getBoard).mockReturnValueOnce(automaticProbe.promise)
            store.currentBoard = { ...board(true), canWrite: undefined } as Board
            store.currentBoardRequestGeneration = 1
            store.currentBoardPayloadGeneration = 1
            const { api, wrapper } = create()
            await flushPromises()

            const probeSignal = vi.mocked(boardsApi.getBoard).mock.calls[0]![1]!.signal!
            expect(api.permissionChecking.value).toBe(true)

            store.currentBoardRequestGeneration = 2
            store.currentBoard = board(true)
            store.currentBoardPayloadGeneration = 2
            await flushPromises()

            automaticProbe.reject({ response: { status: 403 } })
            await flushPromises()

            expect(probeSignal.aborted).toBe(true)
            expect(api.canWrite.value).toBe(true)
            expect(api.permissionRecovery.value).toBe(false)
            expect(api.accessUnavailable.value).toBe(false)
            expect(api.readsBlocked.value).toBe(false)
            wrapper.unmount()
          })

          """
          if text.count(marker) != 1:
              raise SystemExit('retry-ordering insertion seam did not match exactly once')
          path.write_text(text.replace(marker, addition + marker))
          PY

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.13.1
          cache: npm
          cache-dependency-path: frontend/taskdeck-web/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend/taskdeck-web
        run: npm ci

      - name: Prove regression is red
        shell: bash
        working-directory: frontend/taskdeck-web
        run: |
          set -euo pipefail
          set +e
          npx vitest --run src/tests/composables/useCardTypePermission.retryOrdering.spec.ts \
            -t "lets a newer authoritative board payload supersede a stale automatic probe 403" \
            --maxWorkers=2 > /tmp/pr3142-red.log 2>&1
          status=$?
          set -e
          cat /tmp/pr3142-red.log
          test "$status" -ne 0
          grep -F "expected false to be true" /tmp/pr3142-red.log

      - name: Apply generation-aware repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('frontend/taskdeck-web/src/composables/useCardTypePermission.ts')
          text = path.read_text()

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label} matched {count} times, expected exactly once')
              text = text.replace(old, new)

          replace_once(
              '  let inFlightBoardId: string | null = null\n',
              '  let inFlightBoardId: string | null = null\n'
              '  /** Store payload generation visible when the direct read started. */\n'
              '  let inFlightPayloadGeneration: number | null = null\n',
              'in-flight generation declaration',
          )
          replace_once(
              '    inFlightBoardId = boardId\n    checking.value = true\n',
              '    inFlightBoardId = boardId\n'
              '    inFlightPayloadGeneration = boardPayloadGeneration.value\n'
              '    checking.value = true\n',
              'read start capture',
          )
          replace_once(
              '        inFlightBoardId = null\n        inFlightRequest = null\n',
              '        inFlightBoardId = null\n'
              '        inFlightPayloadGeneration = null\n'
              '        inFlightRequest = null\n',
              'read completion cleanup',
          )
          replace_once(
              '    inFlightRequest = null\n    inFlightBoardId = null\n    checking.value = false\n',
              '    inFlightRequest = null\n'
              '    inFlightBoardId = null\n'
              '    inFlightPayloadGeneration = null\n'
              '    checking.value = false\n',
              'cancel cleanup',
          )

          watch_prefix = (
              '  watch([statedPermission, boardPayloadGeneration], ([value, payloadGeneration], '
              '[previousValue, previousPayloadGeneration]) => {\n'
              '    if (!permissionRecovery.value || value === null) return\n'
          )
          watch_replacement = (
              '  watch([statedPermission, boardPayloadGeneration], ([value, payloadGeneration], '
              '[previousValue, previousPayloadGeneration]) => {\n'
              '    if (value === null) return\n\n'
              '    const payloadAdvanced = payloadGeneration !== null &&\n'
              '      payloadGeneration !== previousPayloadGeneration\n\n'
              '    if (!permissionRecovery.value) {\n'
              '      const supersedesAutomaticProbe = inFlightBoardId === options.getBoardId() &&\n'
              '        inFlightPayloadGeneration !== null &&\n'
              '        payloadGeneration !== null &&\n'
              '        payloadGeneration > inFlightPayloadGeneration\n'
              '      if (payloadAdvanced && supersedesAutomaticProbe) {\n'
              '        // Newer committed server evidence owns the permission decision. Retire\n'
              '        // the older legacy-payload probe before a stale denial can replace it.\n'
              '        cancelRead()\n'
              '        failedBoardId.value = null\n'
              '        accessUnavailable.value = false\n'
              '      }\n'
              '      return\n'
              '    }\n'
          )
          replace_once(watch_prefix, watch_replacement, 'permission watcher prefix')
          replace_once(
              '    const hasFreshServerPayload = payloadGeneration !== null &&\n'
              '      payloadGeneration !== previousPayloadGeneration &&\n',
              '    const hasFreshServerPayload = payloadAdvanced &&\n',
              'recovery payload freshness',
          )

          path.write_text(text)
          PY

      - name: Verify permission contracts
        shell: bash
        working-directory: frontend/taskdeck-web
        run: |
          set -euo pipefail
          npx vitest --run \
            src/tests/composables/useCardTypePermission.retryOrdering.spec.ts \
            src/tests/composables/useCardTypePermission.accessDenied.spec.ts \
            src/tests/composables/useCardTypePermission.spec.ts \
            src/tests/components/CardModalPermissionRecovery.spec.ts \
            --maxWorkers=2
          npm run typecheck

      - name: Commit repair and remove helper
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/pr3142-stale-probe-repair.yml
          git add -A
          git diff --cached --check
          git config user.name "Cristian Tcaci"
          git config user.email "59696583+Chris0Jeky@users.noreply.github.com"
          git commit -s -m "fix: preserve newer permission evidence"
          git push origin HEAD:refs/heads/fix/3030-permission-probe-403
