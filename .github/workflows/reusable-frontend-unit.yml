name: Reusable Frontend Unit

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version used for frontend quality gates
        required: false
        default: "24.13.1"
        type: string

permissions:
  contents: read

jobs:
  frontend-unit:
    name: Frontend Unit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: frontend/taskdeck-web/package-lock.json

      # #2378: this step launches real PowerShell/Bash launchers and their API/Vite children. When
      # it hangs it used to consume the whole job budget (cancellations observed at 25:00), taking
      # the job's remaining steps down with it. A passed windows-latest run of this step measured
      # 6m31s, so 10 minutes fails a hang fast while leaving ~1.5x headroom on a slow runner. The
      # suite's own watchdog trips at 9 minutes first and logs which launcher trees leaked.
      - name: Run source launcher regression suite
        timeout-minutes: 10
        run: node --test --test-concurrency=1 --test-timeout=30000 scripts/ci/dev-up.test.mjs

      - name: Install frontend dependencies
        working-directory: frontend/taskdeck-web
        run: npm ci

      - name: Run frontend lint
        working-directory: frontend/taskdeck-web
        run: npm run lint

      - name: Run frontend typecheck
        working-directory: frontend/taskdeck-web
        run: npm run typecheck

      - name: Run frontend build
        working-directory: frontend/taskdeck-web
        run: npx vite build

      - name: Validate generated PWA worker
        working-directory: frontend/taskdeck-web
        run: npm run test:pwa-generated-worker:built

      - name: Run frontend tests with coverage thresholds
        working-directory: frontend/taskdeck-web
        run: npm run test:coverage

      # Bundle-size budget promoted into the required lane (#1132). Reuses the build above
      # (no extra install/build), so it is the "cheap" check the issue asks for. Runs AFTER the
      # unit tests so a bundle regression does not mask test results. Linux-only to avoid a
      # redundant second run on the Windows matrix leg. Error thresholds (entry 150 / single 250 /
      # eager-graph 1250 KB per the #1858 ruling; total JS warns only) are the defaults in
      # scripts/ci/check-bundle-size.mjs, matching the existing performance-regression gate.
      - name: Check frontend bundle size
        if: runner.os == 'Linux'
        run: node scripts/ci/check-bundle-size.mjs --dist frontend/taskdeck-web/dist --fail-on-error

      # CI-09 #2333: failure-only triage evidence (coverage is published by nightly-quality.yml);
      # 14 days survives a weekend and costs ~10x less than 3 days on every green run.
      - name: Upload frontend test artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-unit-artifacts-${{ matrix.os }}
          path: |
            frontend/taskdeck-web/test-results
            frontend/taskdeck-web/coverage
          if-no-files-found: ignore
          retention-days: 14
