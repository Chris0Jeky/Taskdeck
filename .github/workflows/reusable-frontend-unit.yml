name: Reusable Frontend Unit

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version used for frontend quality gates
        required: false
        default: "24.13.1"
        type: string

permissions:
  contents: read

jobs:
  frontend-unit:
    name: Frontend Unit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: frontend/taskdeck-web/package-lock.json

      - name: Run source launcher regression suite
        run: node --test --test-concurrency=1 --test-timeout=30000 scripts/ci/dev-up.test.mjs

      - name: Install frontend dependencies
        working-directory: frontend/taskdeck-web
        run: npm ci

      - name: Run frontend lint
        working-directory: frontend/taskdeck-web
        run: npm run lint

      - name: Run frontend typecheck
        working-directory: frontend/taskdeck-web
        run: npm run typecheck

      - name: Run frontend build
        working-directory: frontend/taskdeck-web
        run: npx vite build

      - name: Run frontend tests with coverage thresholds
        working-directory: frontend/taskdeck-web
        run: npm run test:coverage

      # Bundle-size budget promoted into the required lane (#1132). Reuses the build above
      # (no extra install/build), so it is the "cheap" check the issue asks for. Runs AFTER the
      # unit tests so a bundle regression does not mask test results. Linux-only to avoid a
      # redundant second run on the Windows matrix leg. Error thresholds (entry 150 / single 250 /
      # eager-graph 1250 KB per the #1858 ruling; total JS warns only) are the defaults in
      # scripts/ci/check-bundle-size.mjs, matching the existing performance-regression gate.
      - name: Check frontend bundle size
        if: runner.os == 'Linux'
        run: node scripts/ci/check-bundle-size.mjs --dist frontend/taskdeck-web/dist --fail-on-error

      - name: Upload frontend test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-unit-artifacts-${{ matrix.os }}
          path: |
            frontend/taskdeck-web/test-results
            frontend/taskdeck-web/coverage
          if-no-files-found: ignore
