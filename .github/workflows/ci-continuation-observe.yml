# Read-only execution metadata. This is NOT a required gate or evidence issuer.
# Never check out the triggering head, download its artifacts, restore its caches or execute its code.
name: CI Continuation Observation

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-continuation-observe-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
  cancel-in-progress: false

jobs:
  observe:
    name: Observe completed CI attempts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout protected observer tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.13.1
          package-manager-cache: false

      - name: Collect authenticated metadata only
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ github.event.workflow_run.id }}
          SOURCE_HEAD: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/ci-continuation
          node scripts/ci/smart-ci/continuation/tools/collect-github.mjs \
            --repository "$GITHUB_REPOSITORY" \
            --repository-id "$GITHUB_REPOSITORY_ID" \
            --run "$SOURCE_RUN" \
            --workflow-id 236855317 \
            --workflow-path .github/workflows/ci-required.yml \
            --head "$SOURCE_HEAD" \
            --out artifacts/ci-continuation/observation.json \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Retain bounded metadata report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-observation-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/ci-continuation/observation.json
          retention-days: 14
          if-no-files-found: warn
