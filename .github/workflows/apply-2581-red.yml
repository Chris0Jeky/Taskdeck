name: Apply issue 2581 red regression

on:
  push:
    branches:
      - fix/2581-rekey-revision-unavailable-note

permissions:
  contents: write

concurrency:
  group: apply-2581-red
  cancel-in-progress: true

jobs:
  red:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/2581-rekey-revision-unavailable-note
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.13.1"
          cache: npm
          cache-dependency-path: frontend/taskdeck-web/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend/taskdeck-web
        run: npm ci

      - name: Add poll-driven identity regression
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('frontend/taskdeck-web/src/tests/views/paper/review/PaperReviewView.spec.ts')
          text = path.read_text(encoding='utf-8')
          start_marker = "    it('scopes unavailable review evidence to the active revision', async () => {"
          end_marker = "\n\n    it('clears unavailable review evidence when the proposal is deferred'"
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('Could not locate the exact revision-scoped regression block.')
          if text.find(start_marker, start + 1) >= 0:
              raise SystemExit('Revision-scoped regression block is ambiguous.')

          replacement = r'''    it('keeps unavailable review guidance with its barrier across revision identity polls', async () => {
              vi.useFakeTimers({ toFake: ['setInterval', 'clearInterval', 'setTimeout', 'clearTimeout', 'Date'] })
              try {
                const now = new Date().toISOString()
                const original = makeProposal({ id: 'revision-scoped' })
                const revisionOne = makeProposal({
                  id: 'revision-scoped',
                  latestRevisionId: 'rev-scoped-1',
                })
                const revisionTwo = makeProposal({
                  id: 'revision-scoped',
                  latestRevisionId: 'rev-scoped-2',
                })
                mocks.createRevision.mockResolvedValueOnce({
                  id: 'rev-scoped-1',
                  proposalId: 'revision-scoped',
                  revisionNumber: 1,
                  editorUserId: 'u-1',
                  revisedPayload: '{"operations":[{"sequence":0,"actionType":"CreateCard"}]}',
                  revisedAt: now,
                  reason: 'Scope the evidence state',
                  createdAt: now,
                })
                const wrapper = await mountView(
                  [original],
                  '/workspace/review#proposal-revision-scoped',
                )

                await wrapper.get('[data-testid="decision-edit"]').trigger('click')
                await flushPromises()
                wrapper.findComponent(ReviewRevisionEditor).vm.$emit('save', {
                  revisedPayload: '{"operations":[{"sequence":0,"actionType":"CreateCard"}]}',
                  reason: 'Scope the evidence state',
                })
                await flushPromises()

                mocks.getProposals.mockResolvedValue([revisionOne])
                mocks.getHistory
                  .mockRejectedValueOnce(new Error('history unavailable'))
                  .mockRejectedValueOnce(new Error('history still unavailable'))
                await wrapper.get('[data-testid="decision-apply"]').trigger('click')
                await flushPromises()
                expect(wrapper.find('[data-testid="paper-review-evidence-unavailable"]').exists()).toBe(true)

                // The normal queue poll can learn the post-save revision identity before
                // the reviewer retries. The unavailable guidance belongs to the still-armed
                // barrier, not to the DTO identity that happened to be current when it failed.
                mocks.getProposals.mockResolvedValueOnce([revisionTwo])
                vi.advanceTimersByTime(REVIEW_QUEUE_REFRESH_MS)
                await flushPromises()
                await nextTick()

                expect(
                  wrapper.find('[data-testid="paper-review-evidence-unavailable"]').exists(),
                  'the unavailable note must survive same-proposal revision identity polling',
                ).toBe(true)
                expect(wrapper.get('[data-testid="paper-review-evidence-unavailable"]').text()).toContain(
                  'Review evidence could not be refreshed',
                )
                expect(wrapper.find('[data-testid="apply-risk-posture"]').exists()).toBe(false)

                // A successful explicit retry consumes the same barrier and clears its note.
                mocks.getProposals.mockResolvedValue([revisionTwo])
                await wrapper.get('[data-testid="decision-apply"]').trigger('click')
                await flushPromises()
                expect(mocks.approveProposal).not.toHaveBeenCalled()
                expect(wrapper.find('[data-testid="paper-review-evidence-unavailable"]').exists()).toBe(false)
                expect(wrapper.find('[data-testid="apply-risk-posture"]').exists()).toBe(true)

                // Returning to the former identity after the barrier is gone must not revive
                // a stale map entry from revision one.
                mocks.getProposals.mockResolvedValueOnce([revisionOne])
                vi.advanceTimersByTime(REVIEW_QUEUE_REFRESH_MS)
                await flushPromises()
                await nextTick()
                expect(wrapper.find('[data-testid="paper-review-evidence-unavailable"]').exists()).toBe(false)
                expect(wrapper.find('[data-testid="apply-risk-posture"]').exists()).toBe(true)
                wrapper.unmount()
              } finally {
                vi.useRealTimers()
              }
            })'''
          replacement = '\n'.join(line[12:] if line.startswith('            ') else line for line in replacement.splitlines())
          path.write_text(text[:start] + replacement + text[end:], encoding='utf-8')
          PY

      - name: Prove the regression is red for the intended reason
        working-directory: frontend/taskdeck-web
        shell: bash
        run: |
          set +e
          npm test -- src/tests/views/paper/review/PaperReviewView.spec.ts -t "keeps unavailable review guidance with its barrier across revision identity polls" 2>&1 | tee /tmp/issue-2581-red.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -eq 0 ]; then
            echo 'Expected the regression to fail before implementation, but it passed.' >&2
            exit 1
          fi
          grep -F "the unavailable note must survive same-proposal revision identity polling" /tmp/issue-2581-red.log

      - name: Publish the red test commit
        shell: bash
        run: |
          git diff --check
          git rm .github/workflows/apply-2581-red.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/taskdeck-web/src/tests/views/paper/review/PaperReviewView.spec.ts
          git commit -m 'test: reproduce revision unavailable note identity loss'
          git push origin HEAD:fix/2581-rekey-revision-unavailable-note
