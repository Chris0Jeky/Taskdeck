name: Apply PR 3188 editor baseline patch

on:
  push:
    branches:
      - fix/3083-paper-restore-write-baselines
    paths:
      - .github/workflows/pr-3188-branch-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/3083-paper-restore-write-baselines
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.13.1
          cache: npm
          cache-dependency-path: frontend/taskdeck-web/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend/taskdeck-web
        run: npm ci

      - name: Prove the late-restore regression is red before repair
        working-directory: frontend/taskdeck-web
        shell: bash
        run: |
          set +e
          npx vitest --run src/tests/components/CardModalLateRestoreWriteBaselines.spec.ts --maxWorkers=1 --maxConcurrency=1 2>&1 | tee "$RUNNER_TEMP/pr-3188-red.log"
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -eq 0 ]; then
            echo "Expected the red-first regression to fail before the production repair." >&2
            exit 1
          fi
          grep -q "CardModal late restore write baselines" "$RUNNER_TEMP/pr-3188-red.log"

      - name: Apply bounded editor-baseline repair
        run: python scripts/ci/pr3188_patch.py

      - name: Verify focused frontend behavior
        working-directory: frontend/taskdeck-web
        run: >-
          npx vitest --run
          src/tests/components/CardModalLateRestoreWriteBaselines.spec.ts
          src/tests/components/CardModalArchiveRequestOwnership.spec.ts
          src/tests/components/CardAssignmentField.spec.ts
          --maxWorkers=1 --maxConcurrency=1

      - name: Verify frontend types
        working-directory: frontend/taskdeck-web
        run: npm run typecheck

      - name: Commit bounded repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/taskdeck-web/src/composables/useCardModal.ts \
            frontend/taskdeck-web/src/components/board/CardAssignmentField.vue \
            frontend/taskdeck-web/src/components/board/CardModal.vue \
            .github/workflows/pr-3188-branch-patch.yml \
            scripts/ci/pr3188_patch.py
          git diff --cached --check
          git commit -m "fix(frontend): advance write baselines after late restore"
          git push origin HEAD:fix/3083-paper-restore-write-baselines
