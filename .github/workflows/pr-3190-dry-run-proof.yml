name: Prove PR 3190 Stryker dry run

on:
  push:
    branches:
      - fix/3009-stryker-source-guard-isolation
    paths:
      - .github/workflows/pr-3190-dry-run-proof.yml

permissions:
  contents: read

concurrency:
  group: pr-3190-dry-run-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify exact checkout provenance
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/taskdeck-web/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend/taskdeck-web
        run: npm ci

      - name: Validate source-text guard registry
        working-directory: frontend/taskdeck-web
        run: node --test scripts/stryker-source-text-guards.test.mjs

      - name: Prove ordinary required-CI guard remains active
        working-directory: frontend/taskdeck-web
        run: >-
          npx vitest --run
          src/tests/views/paper/boardMutationCapabilityParity.spec.ts
          --maxWorkers=1 --maxConcurrency=1

      - name: Prove Stryker initial dry run completes
        working-directory: frontend/taskdeck-web
        run: npx stryker run --dryRunOnly
