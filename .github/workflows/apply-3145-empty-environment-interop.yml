name: Apply issue 3145 empty-environment interop fix

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/3145-pwsh7-environment-null'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Collapse the compatibility bootstrap into the inventory script
        shell: python
        run: |
          from pathlib import Path

          public_path = Path('scripts/github/Invoke-TaskdeckReadOnlyInventory.ps1')
          core_path = Path('scripts/github/Invoke-TaskdeckReadOnlyInventory.Core.ps1')
          source_path = core_path if core_path.is_file() else public_path
          text = source_path.read_text(encoding='utf-8')

          old = r'''using System.Runtime.InteropServices;

          public static class TaskdeckInventoryNativeEnvironment
          {
              [DllImport("kernel32.dll", CharSet = CharSet.Unicode, SetLastError = true, EntryPoint = "SetEnvironmentVariableW")]
              [return: MarshalAs(UnmanagedType.Bool)]
              public static extern bool SetWindows(string name, string value);

              [DllImport("libc", CharSet = CharSet.Ansi, SetLastError = true, EntryPoint = "setenv")]
              public static extern int SetUnix(string name, string value, int overwrite);
          }'''.replace('          ', '')

          new = r'''using System;
          using System.Runtime.InteropServices;

          public static class TaskdeckInventoryNativeEnvironment
          {
              [DllImport("kernel32.dll", CharSet = CharSet.Unicode, SetLastError = true, EntryPoint = "SetEnvironmentVariableW")]
              [return: MarshalAs(UnmanagedType.Bool)]
              private static extern bool SetWindowsNative(string name, string value);

              public static bool SetWindows(string name, string value)
              {
                  return SetWindowsNative(name, value ?? string.Empty);
              }

              [DllImport("libc", CharSet = CharSet.Ansi, SetLastError = true, EntryPoint = "setenv")]
              private static extern int SetUnixNative(string name, string value, int overwrite);

              public static int SetUnix(string name, string value, int overwrite)
              {
                  return SetUnixNative(name, value ?? string.Empty, overwrite);
              }
          }'''.replace('          ', '')

          if new not in text:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected one native environment type block, found {count}')
              text = text.replace(old, new)

          public_path.write_text(text, encoding='utf-8', newline='\n')
          if core_path.exists():
              core_path.unlink()

      - name: Commit the bounded compatibility fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/github/Invoke-TaskdeckReadOnlyInventory.ps1
          git rm --ignore-unmatch scripts/github/Invoke-TaskdeckReadOnlyInventory.Core.ps1
          git rm .github/workflows/apply-3145-empty-environment-interop.yml
          git diff --cached --check
          git commit -m "fix(scripts): preserve empty environment values across PowerShell binders"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
