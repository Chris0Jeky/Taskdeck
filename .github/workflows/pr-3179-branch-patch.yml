name: Apply PR 3179 branch patch

on:
  push:
    branches:
      - fix/1921-demo-collaborator-preflight
    paths:
      - .github/workflows/pr-3179-branch-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/1921-demo-collaborator-preflight
          fetch-depth: 0

      - name: Apply bounded source and documentation patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source_path = Path('frontend/taskdeck-web/scripts/demo-seed.mjs')
          source = source_path.read_text(encoding='utf-8')

          replacements = [
              (
                  "  // 2) Complete the pure reset inventory plan before collaborator provisioning or product writes.\n",
                  "  // 2) Complete the pure board inventory/reset plan before collaborator provisioning or product writes.\n",
              ),
              (
                  "  let collabLogin = null\n"
                  "  if (reset) {\n"
                  "    collabLogin = await ensureSeedUser(COLLAB)\n"
                  "    console.log(`Collab user: ${collabLogin.user.username} (${collabLogin.user.email})`)\n"
                  "  }\n\n"
                  "  // 3) Reuse canonical boards normally; protected reset retires them only after both accounts authenticate.\n",
                  "  // A valid plan is still read-only. Authenticate or provision the collaborator now so\n"
                  "  // stale credentials cannot leave either ordinary or reset seeding partially written.\n"
                  "  const collabLogin = await ensureSeedUser(COLLAB)\n"
                  "  console.log(`Collab user: ${collabLogin.user.username} (${collabLogin.user.email})`)\n\n"
                  "  // 3) Reuse canonical boards normally; protected reset retires them only after both accounts authenticate.\n",
              ),
              (
                  "  // Ordinary seeds preserve their existing board-before-collaborator ordering.\n"
                  "  collabLogin ||= await ensureSeedUser(COLLAB)\n"
                  "  const collabToken = collabLogin.token\n"
                  "  const collabUser = collabLogin.user\n"
                  "  if (!reset) console.log(`Collab user: ${collabUser.username} (${collabUser.email})`)\n",
                  "  const collabToken = collabLogin.token\n"
                  "  const collabUser = collabLogin.user\n",
              ),
          ]

          for old, new in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one source replacement, found {count}: {old[:80]!r}')
              source = source.replace(old, new, 1)

          source_path.write_text(source, encoding='utf-8', newline='\n')

          docs_path = Path('docs/product/DEMO_PLAYBOOK.md')
          docs = docs_path.read_text(encoding='utf-8')
          start_marker = 'After the launcher proves its exact run identity, the one-socket seeder authenticates the demo owner so\n'
          end_marker = '\n\n### Database location'
          start = docs.find(start_marker)
          end = docs.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('Could not locate the bounded clean-reset ordering paragraph.')

          replacement = '\n'.join([
              "After the launcher proves its exact run identity, the one-socket seeder authenticates the demo owner so",
              "it can read that user's complete board list. It then computes the pure board inventory/reset plan before",
              "any collaborator-account or product write. A first-ever seed may create that source-only demo owner, but",
              "an invalid plan performs no collaborator provisioning and no board or artifact mutation. Unknown,",
              "duplicate, or malformed `DEMO:*` candidates and malformed reserved tombstones fail closed. The exact",
              "script-owned temporary name `DEMO: Client Onboarding Demo (Chat)` is recognised as the capture-board",
              "family so an interrupted chat rename can be recovered, while duplicate and near-match names still fail",
              "closed.",
              "",
              "After a valid plan, both ordinary and reset seeding authenticate or provision the collaborator before",
              "canonical board preparation. Stale collaborator credentials therefore leave the existing board inventory",
              "unchanged. Collaborator registration is a separate committed account operation: if a new collaborator is",
              "provisioned successfully and a later quarantine, replacement-board, or verification step fails, that account",
              "may remain and can be reused on the next attempt.",
              "",
              "For a reset, each documented demo board is then atomically renamed to an ID-bound non-demo tombstone and",
              "archived; prior valid tombstones and non-demo boards are preserved. The seeder re-fetches and verifies that",
              "quarantine before creating four fresh canonical boards with new IDs, including a new intentionally archived",
              "board, and verifies the persisted set before seeding child artifacts. A 403 or any quarantine/fresh-state",
              "failure exits nonzero without artifact seeding. Because collaborator provisioning, an earlier transition, or",
              "fresh-board creation may already have succeeded, inspect the remaining demo state before retrying. The",
              "launcher then cleans only its own API/frontend process trees and does not claim that old tombstone data was",
              "physically deleted.",
          ])

          docs = docs[:start] + replacement + docs[end:]
          docs_path.write_text(docs, encoding='utf-8', newline='\n')

          Path('.github/workflows/pr-3179-branch-patch.yml').unlink()
          PY

      - name: Commit bounded patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/taskdeck-web/scripts/demo-seed.mjs docs/product/DEMO_PLAYBOOK.md .github/workflows/pr-3179-branch-patch.yml
          git diff --cached --check
          git commit -m "fix(demo): preflight collaborator before seed writes"
          git push origin HEAD:fix/1921-demo-collaborator-preflight
