name: Repair inventory self-test probe restoration

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: repair-3149-self-test-probes-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: true

jobs:
  repair:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/3145-pwsh7-environment-null'
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
      TRIGGER_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout exact pull request branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Verify exact triggering head
        shell: pwsh
        run: |
          if ((git rev-parse HEAD) -cne $env:TRIGGER_HEAD) {
            throw "Checked out head does not match the triggering PR head."
          }

      - name: Preserve and prove caller probe states
        shell: pwsh
        run: |
          $path = 'scripts/github/Invoke-TaskdeckReadOnlyInventory.ps1'
          $text = [System.IO.File]::ReadAllText($path).Replace("`r`n", "`n")
          $startAnchor = '    foreach ($probeName in @($environmentProbeName, $missingEnvironmentProbeName, $emptyEnvironmentProbeName)) {'
          $endAnchor = '    $pathspecLaunch = Get-GitLaunchArguments -Arguments @("diff", "--name-only", "HEAD", "--", "scripts")'
          $start = $text.IndexOf($startAnchor, [System.StringComparison]::Ordinal)
          $end = $text.IndexOf($endAnchor, $start, [System.StringComparison]::Ordinal)
          if ($start -lt 0 -or $end -le $start) {
            throw 'Environment self-test block anchors were not found in the expected order.'
          }

          $oldBlock = $text.Substring($start, $end - $start)
          if ($oldBlock.Contains('$originalEnvironmentProbeStates')) {
            throw 'Caller-state preservation is already present; refusing to apply the repair twice.'
          }
          $indentedBlock = (($oldBlock -split "`n", -1) | ForEach-Object {
              if ($_.Length -eq 0) { '' } else { "        $_" }
            }) -join "`n"

          $replacementPrefix = @'
              $environmentProbeNames = @(
                  $environmentProbeName,
                  $missingEnvironmentProbeName,
                  $emptyEnvironmentProbeName
              )
              $originalEnvironmentProbeStates = @{}
              foreach ($probeName in $environmentProbeNames) {
                  $originalEnvironmentProbeStates[$probeName] = Get-InventoryProcessEnvironmentVariableState -Name $probeName
              }

              try {
                  # Exercise the exact caller-state shapes named by the regression while the outer
                  # finally remains responsible for restoring whatever the invoking process supplied.
                  Set-InventoryProcessEnvironmentVariable -Name $environmentProbeName -Value "caller-non-empty"
                  Set-InventoryProcessEnvironmentVariable -Name $missingEnvironmentProbeName -Value $null
                  Set-InventoryProcessEnvironmentVariable -Name $emptyEnvironmentProbeName -Value ""

                  $selfTestEnvironmentProbeStates = @{}
                  foreach ($probeName in $environmentProbeNames) {
                      $selfTestEnvironmentProbeStates[$probeName] = Get-InventoryProcessEnvironmentVariableState -Name $probeName
                  }

                  try {
          '@
          $replacementSuffix = @'
                  }
                  finally {
                      Restore-InventoryEnvironment -Saved $selfTestEnvironmentProbeStates
                  }

                  Assert-InventoryEnvironmentState `
                      -Name $environmentProbeName `
                      -Present $true `
                      -Value "caller-non-empty" `
                      -Message "The self-test must restore a caller's non-empty probe value."
                  Assert-InventoryEnvironmentState `
                      -Name $missingEnvironmentProbeName `
                      -Present $false `
                      -Message "The self-test must preserve a caller's missing probe state."
                  Assert-InventoryEnvironmentState `
                      -Name $emptyEnvironmentProbeName `
                      -Present $true `
                      -Value "" `
                      -Message "The self-test must restore a caller's present-empty probe value."
                  $state.Checks++
              }
              finally {
                  Restore-InventoryEnvironment -Saved $originalEnvironmentProbeStates
              }

          '@
          $replacement = $replacementPrefix + $indentedBlock + $replacementSuffix
          $updated = $text.Substring(0, $start) + $replacement + $text.Substring($end)
          if ($updated -ceq $text) {
            throw 'Probe restoration repair produced no source change.'
          }
          [System.IO.File]::WriteAllText($path, $updated, [System.Text.UTF8Encoding]::new($false))

      - name: Verify Windows PowerShell 5.1 self-test
        shell: powershell
        run: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -File scripts/github/Invoke-TaskdeckReadOnlyInventory.ps1 -SelfTest

      - name: Verify PowerShell 7 self-test
        shell: pwsh
        run: pwsh -NoLogo -NoProfile -NonInteractive -File scripts/github/Invoke-TaskdeckReadOnlyInventory.ps1 -SelfTest

      - name: Commit verified repair and remove applicator
        shell: pwsh
        run: |
          if ((git rev-parse HEAD) -cne $env:TRIGGER_HEAD) {
            throw "Branch moved locally after checkout; refusing to publish."
          }
          $remoteHead = (git ls-remote --heads origin "refs/heads/$env:PR_HEAD_REF" | ForEach-Object { ($_ -split "`t")[0] })
          if ([string]::IsNullOrWhiteSpace($remoteHead) -or $remoteHead -cne $env:TRIGGER_HEAD) {
            throw "Remote branch moved after this run started; refusing to overwrite it."
          }

          Remove-Item -LiteralPath '.github/workflows/repair-3149-self-test-probes.yml'
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/github/Invoke-TaskdeckReadOnlyInventory.ps1 .github/workflows/repair-3149-self-test-probes.yml

          $changed = @(git diff --cached --name-only | Sort-Object)
          $expected = @(
            '.github/workflows/repair-3149-self-test-probes.yml',
            'scripts/github/Invoke-TaskdeckReadOnlyInventory.ps1'
          )
          if (($changed -join "`n") -cne ($expected -join "`n")) {
            throw "Repair produced an unexpected changed-file set: $($changed -join ', ')"
          }

          git commit -m 'test: preserve inventory self-test caller environment'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin "HEAD:$env:PR_HEAD_REF"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
