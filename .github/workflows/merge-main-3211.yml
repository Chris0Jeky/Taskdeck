name: Merge main for 3211

on:
  push:
    branches:
      - fix/1746-tablet-visual-viewport

permissions:
  contents: write

jobs:
  merge-main:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/1746-tablet-visual-viewport
          fetch-depth: 0

      - name: Merge current main and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin 801c97c91d65c8670ab687aaaa99a3beee3a4c02
          git merge --no-ff --no-edit 801c97c91d65c8670ab687aaaa99a3beee3a4c02 -m "Merge current main into fix/1746-tablet-visual-viewport"
          rm .github/workflows/merge-main-3211.yml
          git add .github/workflows/merge-main-3211.yml
          git commit -m "ci: remove temporary #3211 main merge workflow"
          git push origin HEAD:fix/1746-tablet-visual-viewport
