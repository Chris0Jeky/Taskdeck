name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  docs-governance:
    name: Docs Governance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      - name: Validate docs governance invariants
        run: node scripts/check-docs-governance.mjs

  backend-architecture:
    name: Backend Architecture
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: |
            backend/Taskdeck.sln
            backend/**/*.csproj

      - name: Restore backend
        run: dotnet restore backend/Taskdeck.sln

      - name: Run architecture boundary tests
        run: dotnet test backend/tests/Taskdeck.Architecture.Tests/Taskdeck.Architecture.Tests.csproj --configuration Release --no-restore --logger "trx;LogFileName=architecture.trx" --results-directory "backend/TestResults/architecture"

      - name: Upload architecture test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-architecture-trx
          path: backend/TestResults/architecture
          if-no-files-found: ignore

  backend-unit:
    name: Backend Unit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: |
            backend/Taskdeck.sln
            backend/**/*.csproj

      - name: Restore backend
        run: dotnet restore backend/Taskdeck.sln

      - name: Run domain tests
        run: dotnet test backend/tests/Taskdeck.Domain.Tests/Taskdeck.Domain.Tests.csproj --configuration Release --no-restore --logger "trx;LogFileName=domain.trx" --results-directory "backend/TestResults/backend-unit/${{ matrix.os }}/domain"

      - name: Run application tests
        run: dotnet test backend/tests/Taskdeck.Application.Tests/Taskdeck.Application.Tests.csproj --configuration Release --no-restore --logger "trx;LogFileName=application.trx" --results-directory "backend/TestResults/backend-unit/${{ matrix.os }}/application"

      - name: Run CLI contract tests
        run: dotnet test backend/tests/Taskdeck.Cli.Tests/Taskdeck.Cli.Tests.csproj --configuration Release --no-restore --logger "trx;LogFileName=cli.trx" --results-directory "backend/TestResults/backend-unit/${{ matrix.os }}/cli"

      - name: Upload backend unit test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-unit-trx-${{ matrix.os }}
          path: backend/TestResults/backend-unit/${{ matrix.os }}
          if-no-files-found: ignore

  api-integration:
    name: API Integration (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: |
            backend/Taskdeck.sln
            backend/**/*.csproj

      - name: Restore backend
        run: dotnet restore backend/Taskdeck.sln

      - name: Run API integration tests
        run: dotnet test backend/tests/Taskdeck.Api.Tests/Taskdeck.Api.Tests.csproj --configuration Release --no-restore --logger "trx;LogFileName=api-integration.trx" --results-directory "backend/TestResults/api-integration/${{ matrix.os }}"

      - name: Upload API integration test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: api-integration-trx-${{ matrix.os }}
          path: backend/TestResults/api-integration/${{ matrix.os }}
          if-no-files-found: ignore

  frontend-unit:
    name: Frontend Unit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: frontend/taskdeck-web/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend/taskdeck-web
        run: npm ci

      - name: Run frontend typecheck
        working-directory: frontend/taskdeck-web
        run: npm run typecheck

      - name: Run frontend build
        working-directory: frontend/taskdeck-web
        run: npx vite build

      - name: Run frontend tests
        working-directory: frontend/taskdeck-web
        run: |
          node -e "require('fs').mkdirSync('test-results',{recursive:true});"
          npx vitest run --reporter=default --reporter=junit --outputFile.junit=./test-results/vitest.junit.xml

      - name: Upload frontend test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-unit-artifacts-${{ matrix.os }}
          path: |
            frontend/taskdeck-web/test-results
          if-no-files-found: ignore

  e2e-smoke:
    name: E2E Smoke
    needs:
      - docs-governance
      - backend-architecture
      - backend-unit
      - api-integration
      - frontend-unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: |
            backend/Taskdeck.sln
            backend/**/*.csproj

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: frontend/taskdeck-web/package-lock.json

      - name: Restore backend
        run: dotnet restore backend/Taskdeck.sln

      - name: Install frontend dependencies
        working-directory: frontend/taskdeck-web
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ hashFiles('frontend/taskdeck-web/package-lock.json') }}

      - name: Install Playwright browser
        working-directory: frontend/taskdeck-web
        run: npx playwright install --with-deps chromium

      - name: Remove stale E2E database
        working-directory: frontend/taskdeck-web
        run: node -e "require('fs').rmSync('taskdeck.e2e.ci.db',{force:true});"

      - name: Run Playwright smoke tests
        timeout-minutes: 12
        working-directory: frontend/taskdeck-web
        env:
          CI: "true"
          TASKDECK_E2E_DB: taskdeck.e2e.ci.db
        run: npx playwright test --reporter=line

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/taskdeck-web/playwright-report
          if-no-files-found: ignore

      - name: Upload Playwright test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: frontend/taskdeck-web/test-results
          if-no-files-found: ignore
