name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  backend-unit:
    name: Backend Unit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore backend
        run: dotnet restore backend/Taskdeck.sln

      - name: Run domain tests
        run: dotnet test backend/tests/Taskdeck.Domain.Tests/Taskdeck.Domain.Tests.csproj --configuration Release --no-restore

      - name: Run application tests
        run: dotnet test backend/tests/Taskdeck.Application.Tests/Taskdeck.Application.Tests.csproj --configuration Release --no-restore

      - name: Run CLI contract tests
        run: dotnet test backend/tests/Taskdeck.Cli.Tests/Taskdeck.Cli.Tests.csproj --configuration Release --no-restore

  api-integration:
    name: API Integration (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore backend
        run: dotnet restore backend/Taskdeck.sln

      - name: Run API integration tests
        run: dotnet test backend/tests/Taskdeck.Api.Tests/Taskdeck.Api.Tests.csproj --configuration Release --no-restore

  frontend-unit:
    name: Frontend Unit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: frontend/taskdeck-web/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend/taskdeck-web
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend/taskdeck-web
        run: npx vitest run

  e2e-smoke:
    name: E2E Smoke
    needs:
      - backend-unit
      - api-integration
      - frontend-unit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: frontend/taskdeck-web/package-lock.json

      - name: Restore backend
        run: dotnet restore backend/Taskdeck.sln

      - name: Install frontend dependencies
        working-directory: frontend/taskdeck-web
        run: npm ci

      - name: Install Playwright browser
        working-directory: frontend/taskdeck-web
        run: npx playwright install --with-deps chromium

      - name: Remove stale E2E database
        working-directory: frontend/taskdeck-web
        run: node -e "require('fs').rmSync('taskdeck.e2e.ci.db',{force:true});"

      - name: Run Playwright smoke tests
        working-directory: frontend/taskdeck-web
        env:
          CI: "true"
          TASKDECK_E2E_DB: taskdeck.e2e.ci.db
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/taskdeck-web/playwright-report
          if-no-files-found: ignore
