name: Repair 3023 applicator pin

on:
  push:
    branches:
      - fix/3023-archive-refresh-comment-cache
    paths:
      - .github/workflows/fix-3023-applicator-pin.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/3023-archive-refresh-comment-cache
          fetch-depth: 0

      - name: Pin the one-shot applicator and remove this repair workflow
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/apply-3023-archive-refresh.yml')
          text = path.read_text()
          old = 'uses: actions/checkout@v4'
          new = 'uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1'
          if text.count(old) != 1:
              raise SystemExit(f'expected one unpinned checkout, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          git rm .github/workflows/fix-3023-applicator-pin.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/apply-3023-archive-refresh.yml
          git commit -m "ci: pin temporary archive refresh applicator"
          git push origin HEAD:fix/3023-archive-refresh-comment-cache
