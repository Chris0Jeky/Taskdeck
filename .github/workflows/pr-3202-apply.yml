name: Apply PR 3202 effective related evidence repair

on:
  push:
    branches:
      - fix/2452-effective-related-evidence
    paths:
      - .github/workflows/pr-3202-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/2452-effective-related-evidence
          fetch-depth: 0

      - name: Apply the bounded production repair
        run: python scripts/ci/pr-3202-apply.py

      - name: Verify focused backend contracts
        shell: bash
        run: |
          set +e
          mkdir -p artifacts/pr-3202

          dotnet test backend/tests/Taskdeck.Application.Tests/Taskdeck.Application.Tests.csproj \
            -c Release -m:1 \
            --filter "FullyQualifiedName~ProposalConflictDetectorTests|FullyQualifiedName~CardHistoryServiceTests|FullyQualifiedName~SimilarDecisionServiceTests" \
            2>&1 | tee artifacts/pr-3202/application.log
          application_status=${PIPESTATUS[0]}

          dotnet test backend/tests/Taskdeck.Api.Tests/Taskdeck.Api.Tests.csproj \
            -c Release -m:1 \
            --filter "FullyQualifiedName~RelatedProposalRevisionEvidenceTests" \
            2>&1 | tee artifacts/pr-3202/api.log
          api_status=${PIPESTATUS[0]}

          dotnet test backend/tests/Taskdeck.Architecture.Tests/Taskdeck.Architecture.Tests.csproj \
            -c Release -m:1 \
            2>&1 | tee artifacts/pr-3202/architecture.log
          architecture_status=${PIPESTATUS[0]}

          dotnet build backend/Taskdeck.sln -c Release --no-restore \
            2>&1 | tee artifacts/pr-3202/build.log
          build_status=${PIPESTATUS[0]}

          printf 'application=%s\napi=%s\narchitecture=%s\nbuild=%s\n' \
            "$application_status" "$api_status" "$architecture_status" "$build_status" \
            > artifacts/pr-3202/status.txt

          if [ "$application_status" -ne 0 ] || [ "$api_status" -ne 0 ] \
            || [ "$architecture_status" -ne 0 ] || [ "$build_status" -ne 0 ]; then
            exit 1
          fi

      - name: Upload focused verification output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-3202-focused-verification
          path: artifacts/pr-3202/
          if-no-files-found: error
          retention-days: 7

      - name: Commit verified repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(review): filter related proposals by effective operations"
          git push origin HEAD:fix/2452-effective-related-evidence
