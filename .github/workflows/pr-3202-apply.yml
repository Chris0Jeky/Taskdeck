name: Apply PR 3202 effective related evidence repair

on:
  push:
    branches:
      - fix/2452-effective-related-evidence
    paths:
      - .github/workflows/pr-3202-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/2452-effective-related-evidence
          fetch-depth: 0

      - name: Wire effective related evidence into review services
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              source = file.read_text(encoding='utf-8-sig')
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one anchor, found {count}: {old[:140]!r}')
              file.write_text(source.replace(old, new), encoding='utf-8', newline='\n')

          # Infrastructure registration: candidate pages come from the same scoped DbContext.
          replace_once(
              'backend/src/Taskdeck.Infrastructure/DependencyInjection.cs',
              '        services.AddScoped<IAutomationProposalRepository, AutomationProposalRepository>();\n',
              '        services.AddScoped<IAutomationProposalRepository, AutomationProposalRepository>();\n'
              '        services.AddScoped<IProposalEvidenceCandidateStore, ProposalEvidenceCandidateStore>();\n',
          )

          # Application registration must precede the three consumers so every production host
          # resolves the revision-aware path. Their legacy-sized constructors become internal test seams.
          replace_once(
              'backend/src/Taskdeck.Api/Extensions/ApplicationServiceRegistration.cs',
              '        services.AddScoped<IAutomationProposalService, AutomationProposalService>();\n'
              '        services.AddScoped<IProposalConflictDetector, ProposalConflictDetector>();\n',
              '        services.AddScoped<IAutomationProposalService, AutomationProposalService>();\n'
              '        services.AddScoped<IRelatedProposalEvidenceService, RelatedProposalEvidenceService>();\n'
              '        services.AddScoped<IProposalConflictDetector, ProposalConflictDetector>();\n',
          )

          # AutomationProposalService keeps its existing two-phase loaders, but delegates the
          # selection rules to the shared resolver used by related evidence.
          service_path = 'backend/src/Taskdeck.Application/Services/AutomationProposalService.cs'
          replace_once(
              service_path,
              '''    private static bool CanHaveEffectiveRevision(AutomationProposal proposal) =>
        proposal.ApprovedRevisionId is not null
        || proposal.Status is ProposalStatus.PendingReview or ProposalStatus.Rejected;
''',
              '''    private static bool CanHaveEffectiveRevision(AutomationProposal proposal) =>
        ProposalEffectiveOperationsResolver.CanHaveEffectiveRevision(proposal);
''',
          )
          service_file = Path(service_path)
          service = service_file.read_text(encoding='utf-8-sig')
          start_marker = '    private static ProposalRevisionRef? SelectEffectiveRevisionRef(\n'
          end_marker = '\n    /// <summary>\n    /// Maps a proposal to its response DTO'
          start = service.index(start_marker)
          end = service.index(end_marker, start)
          delegated_selector = '''    private static ProposalRevisionRef? SelectEffectiveRevisionRef(
        AutomationProposal proposal,
        IReadOnlyList<ProposalRevisionRef> refsForProposal) =>
        ProposalEffectiveOperationsResolver.SelectEffectiveRevisionRef(proposal, refsForProposal);
'''
          service_file.write_text(
              service[:start] + delegated_selector + service[end:],
              encoding='utf-8',
              newline='\n',
          )

          # Conflict detector: public production constructor requires the related-evidence service;
          # the old shape stays internal solely for the existing isolated mock suite.
          conflict = 'backend/src/Taskdeck.Application/Services/ProposalConflictDetector.cs'
          replace_once(
              conflict,
              '''    private readonly IUnitOfWork _unitOfWork;
    private readonly IAuthorizationService _authorizationService;

    public ProposalConflictDetector(
        IUnitOfWork unitOfWork,
        IAuthorizationService authorizationService)
    {
        _unitOfWork = unitOfWork;
        _authorizationService = authorizationService;
    }
''',
              '''    private readonly IUnitOfWork _unitOfWork;
    private readonly IAuthorizationService _authorizationService;
    private readonly IRelatedProposalEvidenceService? _relatedProposalEvidence;

    internal ProposalConflictDetector(
        IUnitOfWork unitOfWork,
        IAuthorizationService authorizationService)
    {
        _unitOfWork = unitOfWork;
        _authorizationService = authorizationService;
    }

    public ProposalConflictDetector(
        IUnitOfWork unitOfWork,
        IAuthorizationService authorizationService,
        IRelatedProposalEvidenceService relatedProposalEvidence)
    {
        _unitOfWork = unitOfWork;
        _authorizationService = authorizationService;
        _relatedProposalEvidence = relatedProposalEvidence;
    }
''',
          )
          replace_once(
              conflict,
              '''            var pendingProposals = await _unitOfWork.AutomationProposals
                .GetPendingByOperationTargetAsync("card", cardId.ToString("D"), cancellationToken);

            var hasDuplicate = pendingProposals.Any(p => p.Id != proposal.Id);
''',
              '''            var hasDuplicate = _relatedProposalEvidence is null
                ? (await _unitOfWork.AutomationProposals
                    .GetPendingByOperationTargetAsync("card", cardId.ToString("D"), cancellationToken))
                    .Any(candidate => candidate.Id != proposal.Id)
                : await _relatedProposalEvidence.HasOtherPendingProposalTargetingCardAsync(
                    new ProposalEvidenceScope(proposal.BoardId, proposal.RequestedByUserId),
                    proposal.Id,
                    cardId,
                    cancellationToken);
''',
          )

          # Card history: carry the current proposal's scope in its read context, then select the
          # first effective target match from deterministic candidate pages.
          history = 'backend/src/Taskdeck.Application/Services/CardHistoryService.cs'
          replace_once(
              history,
              '''    private readonly IUnitOfWork _unitOfWork;

    public CardHistoryService(IUnitOfWork unitOfWork)
    {
        _unitOfWork = unitOfWork;
    }
''',
              '''    private readonly IUnitOfWork _unitOfWork;
    private readonly IRelatedProposalEvidenceService? _relatedProposalEvidence;

    internal CardHistoryService(IUnitOfWork unitOfWork)
    {
        _unitOfWork = unitOfWork;
    }

    public CardHistoryService(
        IUnitOfWork unitOfWork,
        IRelatedProposalEvidenceService relatedProposalEvidence)
    {
        _unitOfWork = unitOfWork;
        _relatedProposalEvidence = relatedProposalEvidence;
    }
''',
          )
          replace_once(
              history,
              '''            new ProposalCardHistoryContext(
                proposal.Id,
                proposal.Summary,
                proposal.CreatedAt,
                proposal.Operations.Select(ToDto).ToList()),
''',
              '''            new ProposalCardHistoryContext(
                proposal.Id,
                proposal.BoardId,
                proposal.RequestedByUserId,
                proposal.Summary,
                proposal.CreatedAt,
                proposal.Operations.Select(ToDto).ToList()),
''',
          )
          replace_once(
              history,
              '''            new ProposalCardHistoryContext(
                effectiveProposal.Id,
                effectiveProposal.Summary,
                effectiveProposal.CreatedAt,
                effectiveProposal.Operations),
''',
              '''            new ProposalCardHistoryContext(
                effectiveProposal.Id,
                effectiveProposal.BoardId,
                effectiveProposal.RequestedByUserId,
                effectiveProposal.Summary,
                effectiveProposal.CreatedAt,
                effectiveProposal.Operations),
''',
          )
          replace_once(
              history,
              '''            var relatedProposal = await _unitOfWork.AutomationProposals
                .GetLatestByOperationTargetAsync("card", cardId.ToString(), cancellationToken);

            if (relatedProposal != null && seenProposalIds.Add(relatedProposal.Id))
''',
              '''            var relatedProposal = _relatedProposalEvidence is null
                ? await _unitOfWork.AutomationProposals
                    .GetLatestByOperationTargetAsync("card", cardId.ToString(), cancellationToken)
                : await _relatedProposalEvidence.GetLatestOtherProposalTargetingCardAsync(
                    new ProposalEvidenceScope(proposal.BoardId, proposal.RequestedByUserId),
                    proposal.Id,
                    cardId,
                    cancellationToken);

            if (relatedProposal != null && seenProposalIds.Add(relatedProposal.Id))
''',
          )
          replace_once(
              history,
              '''    private sealed record ProposalCardHistoryContext(
        Guid Id,
        string Summary,
        DateTimeOffset CreatedAt,
        IReadOnlyList<ProposalOperationDto> Operations);
''',
              '''    private sealed record ProposalCardHistoryContext(
        Guid Id,
        Guid? BoardId,
        Guid RequestedByUserId,
        string Summary,
        DateTimeOffset CreatedAt,
        IReadOnlyList<ProposalOperationDto> Operations);
''',
          )

          # Similar-past retains its public result semantics; only the candidate source changes.
          similar = 'backend/src/Taskdeck.Application/Services/SimilarDecisionService.cs'
          replace_once(
              similar,
              '''    private readonly IUnitOfWork _unitOfWork;

    public SimilarDecisionService(IUnitOfWork unitOfWork)
    {
        _unitOfWork = unitOfWork ?? throw new ArgumentNullException(nameof(unitOfWork));
    }
''',
              '''    private readonly IUnitOfWork _unitOfWork;
    private readonly IRelatedProposalEvidenceService? _relatedProposalEvidence;

    internal SimilarDecisionService(IUnitOfWork unitOfWork)
    {
        _unitOfWork = unitOfWork ?? throw new ArgumentNullException(nameof(unitOfWork));
    }

    public SimilarDecisionService(
        IUnitOfWork unitOfWork,
        IRelatedProposalEvidenceService relatedProposalEvidence)
    {
        _unitOfWork = unitOfWork ?? throw new ArgumentNullException(nameof(unitOfWork));
        _relatedProposalEvidence = relatedProposalEvidence
            ?? throw new ArgumentNullException(nameof(relatedProposalEvidence));
    }
''',
          )
          old_query = '''        var pastProposals = (await _unitOfWork.AutomationProposals
            .GetTerminalByActionTypeAsync(actionType, proposal.BoardId, userId, LookbackLimit, cancellationToken))
            ?? Array.Empty<AutomationProposal>();
'''
          new_query = '''        var pastProposals = _relatedProposalEvidence is null
            ? (await _unitOfWork.AutomationProposals
                .GetTerminalByActionTypeAsync(actionType, proposal.BoardId, userId, LookbackLimit, cancellationToken))
                ?? Array.Empty<AutomationProposal>()
            : await _relatedProposalEvidence.GetTerminalProposalsByEffectiveActionAsync(
                new ProposalEvidenceScope(proposal.BoardId, proposal.RequestedByUserId),
                proposal.Id,
                actionType,
                LookbackLimit,
                cancellationToken);
'''
          replace_once(similar, old_query, new_query)
          old_dto_query = '''        var pastProposals = (await _unitOfWork.AutomationProposals
            .GetTerminalByActionTypeAsync(actionType, effectiveProposal.BoardId, userId, LookbackLimit, cancellationToken))
            ?? Array.Empty<AutomationProposal>();
'''
          new_dto_query = '''        var pastProposals = _relatedProposalEvidence is null
            ? (await _unitOfWork.AutomationProposals
                .GetTerminalByActionTypeAsync(actionType, effectiveProposal.BoardId, userId, LookbackLimit, cancellationToken))
                ?? Array.Empty<AutomationProposal>()
            : await _relatedProposalEvidence.GetTerminalProposalsByEffectiveActionAsync(
                new ProposalEvidenceScope(effectiveProposal.BoardId, effectiveProposal.RequestedByUserId),
                effectiveProposal.Id,
                actionType,
                LookbackLimit,
                cancellationToken);
'''
          replace_once(similar, old_dto_query, new_dto_query)

          Path('.github/workflows/pr-3202-apply.yml').unlink()
          PY

      - name: Verify focused backend contracts
        shell: bash
        run: |
          dotnet test backend/tests/Taskdeck.Application.Tests/Taskdeck.Application.Tests.csproj \
            -c Release -m:1 \
            --filter "FullyQualifiedName~ProposalConflictDetectorTests|FullyQualifiedName~CardHistoryServiceTests|FullyQualifiedName~SimilarDecisionServiceTests"
          dotnet test backend/tests/Taskdeck.Api.Tests/Taskdeck.Api.Tests.csproj \
            -c Release -m:1 \
            --filter "FullyQualifiedName~RelatedProposalRevisionEvidenceTests"
          dotnet test backend/tests/Taskdeck.Architecture.Tests/Taskdeck.Architecture.Tests.csproj \
            -c Release -m:1
          dotnet build backend/Taskdeck.sln -c Release --no-restore

      - name: Commit verified repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            backend/src/Taskdeck.Application/Interfaces/IProposalEvidenceCandidateStore.cs \
            backend/src/Taskdeck.Application/Services/ProposalEffectiveOperationsResolver.cs \
            backend/src/Taskdeck.Application/Services/RelatedProposalEvidenceService.cs \
            backend/src/Taskdeck.Application/Services/AutomationProposalService.cs \
            backend/src/Taskdeck.Application/Services/ProposalConflictDetector.cs \
            backend/src/Taskdeck.Application/Services/CardHistoryService.cs \
            backend/src/Taskdeck.Application/Services/SimilarDecisionService.cs \
            backend/src/Taskdeck.Infrastructure/Repositories/ProposalEvidenceCandidateStore.cs \
            backend/src/Taskdeck.Infrastructure/DependencyInjection.cs \
            backend/src/Taskdeck.Api/Extensions/ApplicationServiceRegistration.cs \
            backend/tests/Taskdeck.Api.Tests/RelatedProposalRevisionEvidenceTests.cs \
            .github/workflows/pr-3202-apply.yml
          git diff --cached --check
          git commit -m "fix(review): filter related proposals by effective operations"
          git push origin HEAD:fix/2452-effective-related-evidence
