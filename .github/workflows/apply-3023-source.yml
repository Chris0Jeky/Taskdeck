name: Apply 3023 archive refresh source repair

on:
  push:
    branches:
      - fix/3023-archive-refresh-comment-cache
    paths:
      - .github/workflows/apply-3023-source.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/3023-archive-refresh-comment-cache
          fetch-depth: 0

      - name: Apply guarded source patch
        run: python3 scripts/ci/apply-3023-archive-refresh.py

      - name: Commit source repair
        shell: bash
        run: |
          git rm scripts/ci/apply-3023-archive-refresh.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/taskdeck-web/src/store/board/boardCrudStore.ts \
                  frontend/taskdeck-web/src/components/board/CardModal.vue
          git commit -m "fix(frontend): preserve comments across archive refresh"
          git push origin HEAD:fix/3023-archive-refresh-comment-cache
