name: PR 3226 apply bounded chat board recovery

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
    paths:
      - .github/workflows/pr3226-chat-board-bound.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  red-green:
    if: github.repository == 'Chris0Jeky/Taskdeck'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/2689-chat-board-recovery
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.13.1
          cache: npm
          cache-dependency-path: frontend/taskdeck-web/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend/taskdeck-web
        run: npm ci

      - name: Prove the focused contract is red before implementation
        shell: bash
        working-directory: frontend/taskdeck-web
        run: |
          set -euo pipefail
          grep -F "const result = await boardsApi.getBoards()" src/composables/useAutomationChat.ts
          set +e
          npx vitest run src/tests/composables/useAutomationChat.boardRecovery.spec.ts 2>&1 | tee /tmp/pr3226-red.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -eq 0 ]; then
            echo "Expected the bounded board-read regression to fail before implementation" >&2
            exit 1
          fi
          grep -F "useAutomationChat.boardRecovery.spec.ts" /tmp/pr3226-red.log

      - name: Apply the minimal bounded read
        shell: python
        run: |
          from pathlib import Path

          path = Path('frontend/taskdeck-web/src/composables/useAutomationChat.ts')
          source = path.read_text(encoding='utf-8')
          import_anchor = "import { boardsApi } from '../api/boardsApi'\n"
          import_line = "import { BOARD_REQUEST_TIMEOUT_MS } from '../api/http'\n"
          old_call = "        const result = await boardsApi.getBoards()\n"
          new_call = "        const result = await boardsApi.getBoards(undefined, false, {\n          timeout: BOARD_REQUEST_TIMEOUT_MS,\n          skipRetry: true,\n        })\n"
          if source.count(import_anchor) != 1 or import_line in source:
              raise SystemExit('unexpected board API import shape')
          if source.count(old_call) != 1:
              raise SystemExit(f'expected one unbounded board read, found {source.count(old_call)}')
          source = source.replace(import_anchor, import_anchor + import_line)
          source = source.replace(old_call, new_call)
          path.write_text(source, encoding='utf-8')

      - name: Verify focused and compatibility chat suites
        working-directory: frontend/taskdeck-web
        run: |
          npx vitest run src/tests/composables/useAutomationChat.boardRecovery.spec.ts src/tests/composables/useAutomationChat.spec.ts
          npm run typecheck

      - name: Publish implementation and remove helper workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/pr3226-chat-board-bound.yml
          git add frontend/taskdeck-web/src/composables/useAutomationChat.ts
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(chat): bound board option recovery reads"
          git push origin HEAD:fix/2689-chat-board-recovery
